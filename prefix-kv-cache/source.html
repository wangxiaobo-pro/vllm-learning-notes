<div id="prefix-kv-map" lang="zh-CN">
  <style>
    #prefix-kv-map{display:grid;gap:calc(var(--font-size-base)*.7);--kv-hit:var(--viz-series-1);--kv-new:var(--viz-series-2);--kv-line:var(--muted-foreground);--kv-bg:var(--background)}
    #prefix-kv-map .kv-toolbar,#prefix-kv-map .kv-legend{display:flex;align-items:center;flex-wrap:wrap;gap:.425em 1em}
    #prefix-kv-map .kv-legend{color:var(--muted-foreground)}
    #prefix-kv-map .kv-legend span{display:inline-flex;align-items:center;gap:.32em}
    #prefix-kv-map .kv-legend i{width:.72em;height:.72em;border-radius:2px;display:inline-block}
    #prefix-kv-map .kv-legend .reuse{background:var(--kv-hit)}
    #prefix-kv-map .kv-legend .write{background:var(--kv-new)}
    #prefix-kv-map .kv-figure{display:block;width:100%;overflow:visible;font-family:inherit}
    #prefix-kv-map .kv-figure text{fill:var(--foreground)}
    #prefix-kv-map .kv-figure .kv-t-main{font-size:14px;font-weight:500}
    #prefix-kv-map .kv-figure .kv-t-mono{font-size:13px;font-family:ui-monospace,Consolas,"Microsoft YaHei",monospace}
    #prefix-kv-map .kv-figure .kv-t-small,#prefix-kv-map .kv-figure .kv-t-sub{font-size:12px;fill:var(--muted-foreground)}
    #prefix-kv-map .kv-figure .kv-edge-label{font-size:12px;paint-order:stroke;stroke:var(--kv-bg);stroke-width:5px;stroke-linejoin:round}
    #prefix-kv-map .kv-muted-phase{opacity:.45}
    #prefix-kv-map rect.kv-current{stroke:var(--foreground);stroke-width:2}
    #prefix-kv-map text.kv-current{fill:var(--foreground);font-weight:500}
    #prefix-kv-map g.kv-current>path{stroke-width:3}
    #prefix-kv-map .kv-executor{display:grid;gap:.45em}
    #prefix-kv-map [data-status]{font-weight:500}
    #prefix-kv-map .kv-frame{min-width:0}
    #prefix-kv-map .kv-tab-content:not([hidden]){display:grid;gap:calc(var(--font-size-base)*.7)}
    #prefix-kv-map .kv-src{color:var(--muted-foreground)}
    #prefix-kv-map .kv-step-list{display:grid;gap:6px;padding-left:1.8em}
    #prefix-kv-map .kv-step-list button{color:var(--foreground);text-align:left;white-space:normal;max-width:100%;overflow-wrap:anywhere}
    #prefix-kv-map .kv-step-list button[aria-current="step"]{font-weight:600;outline:1px solid var(--kv-hit)}
    #prefix-kv-map .is-traced path{stroke-width:3}
    #prefix-kv-map .is-traced .kv-edge-label{font-weight:500}
  </style>
  <h2>一次请求怎样复用前缀 KV</h2>
  <div class="nav nav-pills" role="tablist" aria-label="缓存实现">
    <button id="kv-map-tab-v" type="button" class="nav-link active" role="tab" aria-selected="true" aria-controls="kv-map-common" data-engine="vllm">vLLM · 哈希表</button>
    <button id="kv-map-tab-s" type="button" class="nav-link" role="tab" aria-selected="false" aria-controls="kv-map-common" data-engine="sglang">SGLang · 前缀树</button>
  </div>
  <section id="kv-map-common" class="kv-tab-content" role="tabpanel" aria-labelledby="kv-map-tab-v">
    <div class="viz-controls" role="group" aria-label="高亮图中的阶段">
      <button type="button" data-phase="0" data-overview class="btn" aria-pressed="true">全图</button>
      <button type="button" data-phase="1" class="btn" aria-pressed="false">建缓存</button>
      <button type="button" data-phase="2" class="btn" aria-pressed="false">查前缀</button>
      <button type="button" data-phase="3" class="btn" aria-pressed="false">用 KV</button>
    </div>
    <div class="kv-executor">
      <div class="viz-controls" role="group" aria-label="单步执行器">
        <button type="button" class="btn" data-prev disabled>上一步</button>
        <button type="button" class="btn btn-primary" data-next>下一步</button>
        <button type="button" class="btn" data-play>播放一次查找</button>
      </div>
      <div data-status aria-live="polite" aria-atomic="true"></div>
    </div>
  <div class="kv-legend text-small" aria-label="图例"><span><i class="reuse"></i>复用已有 KV</span><span><i class="write"></i>计算新 KV</span><span>⇢ 返回结果</span></div>
  <div class="kv-frame"><svg class="kv-figure" role="img"></svg></div>
  <div class="kv-src text-small" data-source></div>
  <nav aria-label="完整八步流程"><h3>完整编号流程</h3><ol class="kv-step-list text-small" data-steps></ol></nav>
  </section>
</div>
<script>
(() => {
  const root = document.getElementById('prefix-kv-map');
  const svg = root.querySelector('.kv-figure');
  const ns = 'http://www.w3.org/2000/svg';
  const phaseButtons = Array.from(root.querySelectorAll('[data-phase]'));
  const tabs = Array.from(root.querySelectorAll('[data-engine]'));
  const actions = {
    vllm:['全图','R1 建立缓存','R2 入队并生成块哈希','查 h1，AB 命中块 7','查 h4，CX 未命中','向调度器返回块 7 和命中长度 2','分配块 24、31 并登记哈希','向 Worker 下发块表 [7, 24, 31]','Worker 读块 7，将 CXEF 写入块 24、31'],
    sglang:['全图','R1 写入压缩节点 ABCDEF','调度器取出 R2，准备查树','匹配 ABC，拆开旧节点','返回命中长度 3 和 ABC 的节点 ID','取出 ABC 的旧槽位，为 XEF 分配新槽位','组装 R2 的六个槽位','Worker 读取 ABC，写入 XEF 的 KV','将 XEF 作为新叶插回树中']
  };
  const ordinal = n => String.fromCodePoint(0x2460+n-1);
  const actionIds = focus => (Array.isArray(focus)?focus:[focus]).filter(n=>Number.isInteger(n)&&n>0&&n<actions[engine].length);
  const phaseStarts={vllm:[0,1,2,6],sglang:[0,1,2,5]};
  const descriptions = {
    vllm:'R1 缓存 ABCDEF。R2 的 ABCXEF 逐块查表，AB 命中块 7，CX 未命中。返回长度 2，调度器分配块 24、31，worker 读取 AB，写入 CXEF。',
    sglang:'R1 缓存 ABCDEF。R2 的 ABCXEF 匹配压缩树，ABC 命中。调度器取得长度 3 和节点 ID，分配器从该节点取旧槽 40 至 42，为 XEF 分配 70 至 72，前向后插入新叶。'
  };
  let engine='vllm',lastWidth=0,playing=false,timer=0;
  const cursors={vllm:0,sglang:0};
  const prev=root.querySelector('[data-prev]'), next=root.querySelector('[data-next]'), play=root.querySelector('[data-play]');
  const valid = value => Number.isInteger(value) && value>=0 && value<=8;
  function phaseFor(step) {return step>=phaseStarts[engine][3]?3:step>=2?2:step;}
  function el(tag, attrs={}, content, parent=svg) {
    const element = document.createElementNS(ns,tag);
    for (const [k,v] of Object.entries(attrs)) if (v!=null) element.setAttribute(k,v);
    if(content!=null) element.textContent = content;
    parent.append(element);
    return element;
  }
  function phaseClass(on,focus) {
    const step=cursors[engine];
    if(!step)return '';
    if(focus!=null && (Array.isArray(focus)?focus:[focus]).includes(step))return 'kv-current';
    const phase=phaseFor(step);
    return on!=null && on!==0 && !(Array.isArray(on)?on:[on]).includes(phase) ? 'kv-muted-phase' : '';
  }
  const strokes = {call:'var(--kv-line)',data:'var(--kv-line)',return:'var(--kv-line)',hit:'var(--kv-hit)',new:'var(--kv-new)'};
  const fills = {neutral:'var(--muted)',header:'color-mix(in srgb,var(--foreground) 10%,var(--kv-bg))',owner:'color-mix(in srgb,var(--foreground) 5%,var(--kv-bg))',hit:'color-mix(in srgb,var(--kv-hit) 16%,var(--kv-bg))',new:'color-mix(in srgb,var(--kv-new) 18%,var(--kv-bg))'};
  function rect(x,y,w,h,{kind='neutral',phase:on,rx=7,focus}={}) {
    return el('rect',{x,y,width:w,height:h,rx,fill:fills[kind]??fills.neutral,stroke:'var(--border)','stroke-width':1,class:phaseClass(on,focus)});
  }
  function textAt(x,y,label,{align='middle',kind='main',phase:on,focus}={}) {
    return el('text',{x,y,'text-anchor':align,class:'kv-t-'+kind+' '+phaseClass(on,focus)},label);
  }
  function node(x,y,w,h,{title,sub,kind='neutral',phase:on,focus}={}) {
    rect(x,y,w,h,{kind,phase:on,rx:8,focus});
    const mid=y+h/2;
    textAt(x+w/2,mid+(sub?-3:5),title,{phase:on,focus});
    if(sub) textAt(x+w/2,mid+15,sub,{kind:'sub',phase:on,focus});
  }
  function edge(points,{phase:on,kind='data',dashed=false,label,lx,ly,focus}={}) {
    const stroke=strokes[kind]??strokes.data;
    const d=points.map(([x,y],i)=>(i?'L':'M')+x+' '+y).join(' ');
    const group=el('g',{class:phaseClass(on,focus),'data-pk-edge':kind,'data-pk-label':label});
    el('path',{d,fill:'none',stroke,'stroke-width':kind==='hit'||kind==='new'?2.1:1.6,'stroke-dasharray':dashed||kind==='return'?'5 4':null,'stroke-linejoin':'round','stroke-linecap':'round','marker-end':'url(#pk-tip-'+kind+')'},null,group);
    if(label!=null) {
      const ids=actionIds(focus), step=cursors[engine];
      const shown=step?ids.filter(n=>n===step):ids;
      const caption=String(label).replace(/^[①-⑧]\s*/, '');
      const numbered=(shown.length?shown.map(ordinal).join('·')+' ':'')+caption;
      group.dataset.stepIds=ids.join(',');
      el('text',{x:lx,y:ly,'text-anchor':'middle',class:'kv-edge-label'},numbered,group);
    }
    return group;
  }
  function drawVllm(g) {
  const w = g.w;
  const narrow = g.compact;
  const pad = narrow ? 8 : 12;
  const leftW = narrow ? (w - 3 * pad) / 2 : Math.round(w * 0.335);
  const mapX = narrow ? pad : Math.round(w * 0.51);
  const mapW = w - mapX - pad;
  const mapY = narrow ? 234 : 112;
  const mapH = 262;
  const mapBottom = mapY + mapH;
  const r1X = narrow ? 2 * pad + leftW : mapX;
  const r1W = narrow ? leftW : mapW;
  const cLeft = pad + leftW / 2;
  const cR1 = r1X + r1W / 2;
  const grouped = [1, 2, 3];
  const steps = [1, 2, 3, 4, 5, 6, 7, 8];
  const step = g.step ?? ([0, 1, 4, 8][g.phase] || 0);
  const overview = step === 0;
  const reached = n => overview || step >= n;
  const text = (x, y, value, kind, phase, focus, align = 'middle') =>
    g.text(x, y, value, {kind, phase, focus, align});
  const box = (x, y, width, height, kind, phase, focus) =>
    g.rect(x, y, width, height, {kind, phase, focus, rx: 7});
  const line = (points, kind, phase, focus, label, lx, ly) =>
    g.edge(points, {kind, phase, focus, label, lx, ly});
  const card = (x, y, width, height, title, sub, kind, phase, focus) =>
    g.node(x, y, width, height, {title, sub, kind, phase, focus});

  // R1 has already produced reusable KV at the end of action 1.
  box(pad, 7, leftW, 68, 'owner', [2, 3], 2);
  text(cLeft, 27, '分词器 → R2', 'main', [2, 3], 2);
  text(cLeft, 46, reached(2) ? 'AB | CX | EF' : '尚未到达', 'mono', [2, 3], 2);
  text(cLeft, 64, reached(2) ? '[h1, h4, h5]' : '哈希未生成', 'mono', [2, 3], 2);
  card(r1X, 7, r1W, 68, 'R1 prefill 完成', 'AB | CD | EF', 'neutral', 1, 1);

  const callerY = narrow ? 111 : 137;
  const callerH = 76;
  line([[cLeft, 75], [cLeft, callerY]], 'data', 2, 2, reached(2) ? 'R2 入队' : '等待 R2',
    cLeft + 31, narrow ? 98 : 111);
  box(pad, callerY, leftW, callerH, 'owner', [2, 3], [2, 3, 4, 5]);
  text(cLeft, callerY + 23, 'Scheduler.schedule', 'main', 2, [2, 3, 4, 5]);
  text(cLeft, callerY + 45, reached(3) ? 'get_computed_blocks' : 'waiting queue', 'sub', 2, [2, 3, 4, 5]);
  const scheduleStatus = ['R2 · 上限 5 tokens', 'R2 尚未到达', 'R2 已入队',
    '查 h1 · 上限 5 tokens', '查 h4 · 遇缺即停', '收到块 7 · 命中 2'][step] || '已知前缀长 2';
  text(cLeft, callerY + 63, scheduleStatus, 'small', 2, [2, 3, 4, 5]);

  const inspect = [1, 3, 4, 5, 6];
  box(mapX, mapY, mapW, mapH, 'neutral', grouped, inspect);
  text(mapX + mapW / 2, mapY + 22, 'BlockPool · 前缀哈希表', 'main', grouped, inspect);
  const col = [0.23, 0.56, 0.83].map(frac => mapX + frac * mapW);
  ['父哈希 + token', '表键', 'KV 块 ID'].forEach((v, i) =>
    text(col[i], mapY + 45, v, 'small', grouped, inspect));
  const oldRows = [
    ['根 + AB', '(h1,g0)', '7', reached(3) ? 'hit' : 'neutral', grouped, [1, 3, 5]],
    ['h1 + CD', '(h2,g0)', '18', 'neutral', grouped, 1],
    ['h2 + EF', '(h3,g0)', '9', 'neutral', grouped, 1]
  ];
  function drawRow([parent, key, value, kind, phase, focus], y) {
    g.rect(mapX + 6, y, mapW - 12, 24, {kind, phase, focus, rx: 3});
    [parent, key, value].forEach((v, j) =>
      text(col[j], y + 17, v, 'mono', phase, focus));
  }
  text(mapX + 11, mapY + 65, 'R1 已有记录', 'small', grouped, [1, 3], 'start');
  oldRows.forEach((row, i) => drawRow(row, mapY + 72 + i * 28));
  let mapNote;
  if (reached(6)) {
    text(mapX + 11, mapY + 174, 'R2 分配后登记', 'small', 3, 6, 'start');
    drawRow(['h1 + CX', '(h4,g0)', '24', 'new', 3, 6], mapY + 181);
    drawRow(['h4 + EF', '(h5,g0)', '31', 'new', 3, 6], mapY + 209);
    mapNote = reached(8) ? 'EF 的父哈希不同，进入另一块' : '索引已登记，新 KV 等待写入';
  } else if (reached(4)) {
    text(mapX + 11, mapY + 174, 'R2 查找探针', 'small', 2, 4, 'start');
    drawRow(['h1 + CX', '(h4,g0)', '未命中', 'new', 2, 4], mapY + 181);
    drawRow(['h4 + EF', '(h5,g0)', '未探查', 'neutral', 2, 4], mapY + 209);
    mapNote = step === 4 ? '停止查找 · 有效记录仍为 3 条' : '返回命中前缀 · [块 7]，2 tokens';
  } else if (step === 3) {
    text(mapX + mapW / 2, mapY + 192, '第一次探查 · h1 命中块 7', 'main', 2, 3);
    mapNote = '下一次探查 h4';
  } else {
    text(mapX + mapW / 2, mapY + 192, '表中共 3 条记录', 'sub', 1, 1);
    mapNote = step === 1 ? 'R1 的 KV 已就绪' : 'R2 尚未发起探查';
  }
  text(mapX + mapW / 2, mapBottom - 10, mapNote, 'small', grouped, [1, 2, 3, 4, 5, 6]);

  const allocY = narrow ? mapBottom + 51 : 244;
  const allocX = pad;
  const allocW = narrow ? Math.min(228, w * 0.64) : leftW;
  const allocH = 84;
  const cAlloc = allocX + allocW / 2;
  const lookup = overview ? '查 h1、h4' : step === 3 ? '查 h1' : step === 4 ? '查 h4' :
    reached(4) ? '查询结束' : '待查询';
  const returned = overview ? '块 7 · 2 tokens' : reached(5) ? '块 7 · 2 tokens' : '等待返回';
  if (narrow) {
    line([[cR1, 75], [cR1, mapY]], 'data', 1, 1, '先登记，再写 KV', cR1, 151);
    line([[cLeft, callerY + callerH], [cLeft, mapY]], 'call', 2, [3, 4], lookup, cLeft, mapY - 16);
    line([[cAlloc, mapBottom], [cAlloc, allocY]], 'return', 2, 5, returned, cAlloc, allocY - 18);
  } else {
    line([[cR1, 75], [cR1, mapY]], 'data', 1, 1, '先登记，再写 KV', cR1 + 61, 99);
    const gutter = (pad + leftW + mapX) / 2;
    line([[pad + leftW, callerY + 35], [mapX, callerY + 35]], 'call', 2, [3, 4], lookup, gutter, callerY + 24);
    line([[mapX, allocY + 19], [pad + leftW, allocY + 19]], 'return', 2, 5, returned, gutter, allocY + 8);
  }

  box(allocX, allocY, allocW, allocH, 'owner', [2, 3], [5, 6]);
  text(cAlloc, allocY + 23, '调度器分配块位', 'main', [2, 3], [5, 6]);
  text(cAlloc, allocY + 43, reached(6) ? 'allocate_slots(R2, 4, …)' :
    reached(5) ? '已命中 2 · 还需 4 个位置' : '等待命中结果', 'sub', [2, 3], [5, 6]);
  text(cAlloc, allocY + 66, reached(6) ? '复用 7 · 新分配 24、31' : '新块未分配', 'small', 3, 6);
  const reg = overview ? '登记' : reached(6) ? '登记' : '待登记';
  if (narrow) {
    const regX = w - pad - 32;
    line([[allocX + allocW, allocY + 48], [regX, allocY + 48], [regX, mapBottom]], 'new', 3, 6,
      reg, regX - 13, allocY + 33);
  } else {
    const gutter = (pad + leftW + mapX) / 2;
    line([[pad + leftW, allocY + 67], [mapX, allocY + 67]], 'new', 3, 6,
      reached(6) ? reg + ' h4、h5' : reg, gutter, allocY + 57);
  }

  const planY = Math.max(allocY + allocH, mapBottom) + 45;
  const planX = pad, planW = w - 2 * pad;
  line([[cAlloc, allocY + allocH], [cAlloc, planY]], 'data', 3, 7,
    reached(7) ? '取完整块表' : '待组装块表', cAlloc + 42, planY - 12);
  box(planX, planY, planW, 85, 'owner', 3, 7);
  text(w / 2, planY + 23, reached(7) ? 'SchedulerOutput · R2 的块表' : 'SchedulerOutput · 等待下发',
    'main', 3, 7);
  const chips = reached(7) ? ['块 7 · AB', '块 24 · CX', '块 31 · EF'] :
    ['AB · 待下发', 'CX · 待下发', 'EF · 待下发'];
  const chipGap = 5, inset = 7;
  const chipW = (planW - inset * 2 - 2 * chipGap) / 3;
  const centers = chips.map((label, i) => {
    const x = planX + inset + i * (chipW + chipGap);
    const kind = reached(7) ? (i ? 'new' : 'hit') : 'neutral';
    g.rect(x, planY + 35, chipW, 31, {kind, phase: 3, focus: 7, rx: 4});
    text(x + chipW / 2, planY + 55, label, 'mono', 3, 7);
    return x + chipW / 2;
  });
  const workY = planY + 137;
  const workerW = Math.min(planW - 12, 365);
  const workerX = (w - workerW) / 2;
  const dispatch = reached(7) ? 'execute_model · 已算 2 / 调度 4' : '等待调度计划';
  line([[w / 2, planY + 85], [w / 2, workY]], 'call', 3, 7, dispatch, w / 2, workY - 18);
  card(workerX, workY, workerW, 62, 'Worker · attention forward',
    reached(8) ? '位置 [2,3,4,5] → 计算 CXEF' : reached(7) ? '已接收计划 · 等待 forward' : '等待执行',
    'owner', 3, 8);

  const memY = workY + 129;
  const offset = Math.min(workerW * 0.32, 100);
  const west = w / 2 - offset, east = w / 2 + offset;
  const turn = memY - 22;
  line([[centers[0], memY], [centers[0], turn], [west, turn], [west, workY + 62]],
    'hit', 3, 8, reached(8) ? '读取 AB' : '待读取', centers[0], memY - 36);
  line([[east, workY + 62], [east, turn], [centers[1], turn], [centers[1], memY]],
    'new', 3, 8, reached(8) ? '写入 CX' : '待写入', w / 2, memY - 36);
  line([[east, workY + 62], [east, turn], [centers[2], turn], [centers[2], memY]],
    'new', 3, 8, reached(8) ? '写入 EF' : '待写入', centers[2], memY - 36);
  const ids = [7, 24, 31], contents = ['AB 的 KV', 'CX 的 KV', 'EF 的 KV'];
  chips.forEach((_, i) => {
    const x = planX + inset + i * (chipW + chipGap);
    const hasSlot = i === 0 || reached(6);
    const available = i === 0 || reached(8);
    card(x, memY, chipW, 54, hasSlot ? '块 ' + ids[i] : '未分配',
      available ? contents[i] : hasSlot ? 'KV 待写' : '—',
      i === 0 ? 'hit' : reached(6) ? 'new' : 'neutral', 3, i === 0 ? [1, 8] : [6, 8]);
  });
  text(w / 2, memY + 77, 'Worker 持有的设备 KV 池', 'sub', 3, [1, 6, 8]);
  g.end(memY + 89);
}

function drawSglang(g) {
  const w = g.w;
  const small = g.compact;
  const left = 12;
  const right = w - 23;
  const center = (left + right) / 2;
  const routeX = w - 7;
  const step = g.step ?? [0,1,4,8][g.phase];
  const reached = (n) => step === 0 || step >= n;
  const visual = (focus) => {
    const actions = Array.isArray(focus) ? focus : [focus];
    const phase = [...new Set(actions.map(n => n === 1 ? 1 : n <= 4 ? 2 : 3))];
    return {phase, focus};
  };
  const shape = (x, y, width, height, title, sub, kind, focus) =>
    g.node(x, y, width, height, {title, sub, kind, ...visual(focus)});
  const line = (points, focus, kind, dashed = false, label, lx, ly) => {
    if (!(Array.isArray(focus) ? focus : [focus]).some(reached)) {
      return g.el('g', {'aria-hidden':'true'});
    }
    return g.edge(points, {...visual(focus), kind, dashed, label, lx, ly});
  };
  const note = (x, y, label, kind, focus, align = 'middle') =>
    g.text(x, y, label, {kind, ...visual(focus), align});
  const hasSplit = reached(3);
  const hasNewLeaf = reached(8);
  const seedLeftW = small ? (right-left)*.45 : Math.round(w*.37);
  const seedRightX = small ? left+seedLeftW+26 : Math.round(w*.54);
  const seedRightW = right-seedRightX;
  shape(left, 12, seedLeftW, 51, '① R1 先 prefill', 'ABCDEF 生成 KV', 'owner', 1);

  function draw(animate=false) {

  background: currentColor;

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

(() =&gt; {

&lt;script&gt;
(() =&gt; {
  const waitFor = async (test, label) =&gt; {
    const deadline = Date.now() + 5000;
    while (Date.now() &lt; deadline) {
      const result = test();
      if (result) return result;
      await new Promise(resolve =&gt; setTimeout(resolve, 20));
    }
    throw new Error(&#x27;KV 卸载图未到达目标状态：&#x27; + label);
  };
  window.openLessonTarget = async function (action) {
    if (action.mode !== &#x27;offload&#x27; || !Number.isInteger(action.step) || action.step &lt; 0 || action.step &gt; 7) {
      throw new Error(&#x27;无效的 KV 卸载目标&#x27;);
    }
    const root = await waitFor(() =&gt; document.querySelector(&#x27;#km-map&#x27;), &#x27;图初始化&#x27;);
    (await waitFor(() =&gt; root.querySelector(&#x27;#km-all&#x27;), &#x27;全局按钮&#x27;)).click();
    const status = () =&gt; root.querySelector(&#x27;#km-status&#x27;).textContent;
    await waitFor(() =&gt; status().startsWith(&#x27;全局关系&#x27;), &#x27;全局状态&#x27;);
    for (let step = 1; step &lt;= action.step; step++) {
      root.querySelector(&#x27;#km-next&#x27;).click();
      await waitFor(() =&gt; status().startsWith(step + &#x27; / 7&#x27;), &#x27;第 &#x27; + step + &#x27; 步&#x27;);
    }
    return {label:&#x27;KV 卸载 · &#x27; + status(), mode:action.mode, step:action.step};
  };
})();
// Runs in the visualization document, including sandboxed srcdoc frames.
(() =&gt; {
  const pending = new Map();
  let queue = Promise.resolve();
  const ready = document.readyState === &#x27;loading&#x27;
    ? new Promise(resolve =&gt; document.addEventListener(&#x27;DOMContentLoaded&#x27;,resolve,{once:true}))
    : Promise.resolve();
  const pause = () =&gt; document.querySelectorAll(&#x27;button&#x27;).forEach(button =&gt; {
    if (/^(暂停(?:流程|播放|动画)?|停止播放)$/.test(button.textContent.trim())) button.click();
  });
  window.addEventListener(&#x27;lesson-pause-visual&#x27;,pause);
  if (parent === window) return;
  const post = data =&gt; parent.postMessage(data,&#x27;*&#x27;);
  window.addEventListener(&#x27;message&#x27;,async event =&gt; {
    if (event.source !== parent || !event.data || typeof event.data !== &#x27;object&#x27;) return;
    const {type,id,action} = event.data;
    if (type === &#x27;lesson-call-ping&#x27;) {
      await ready; post({type:&#x27;lesson-call-ready&#x27;}); return;
    }
    if (type === &#x27;lesson-call-pause&#x27;) { pause(); return; }
    if (type !== &#x27;lesson-call-open&#x27; || typeof id !== &#x27;string&#x27;) return;
    if (!pending.has(id)) {
      const work = queue.then(() =&gt; ready).then(() =&gt; {
        if (typeof window.openLessonTarget !== &#x27;function&#x27;) throw new Error(&#x27;可视化步骤入口尚未就绪&#x27;);
        return window.openLessonTarget(action);
      });
      pending.set(id,work);
      queue = work.catch(() =&gt; {});
      if (pending.size &gt; 16) pending.delete(pending.keys().next().value);
    }
    try { post({type:&#x27;lesson-call-result&#x27;,id,ok:true,result:await pending.get(id)}); }
    catch (error) { post({type:&#x27;lesson-call-result&#x27;,id,ok:false,error:error.message}); }
  });
  for (const name of [&#x27;click&#x27;,&#x27;change&#x27;]) document.addEventListener(name,event =&gt; {
    if (event.isTrusted &amp;&amp; event.target.closest(&#x27;button,select,input&#x27;)) post({type:&#x27;lesson-call-edited&#x27;});
  },true);
  ready.then(() =&gt; post({type:&#x27;lesson-call-ready&#x27;}));
})();

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) =&gt; {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll(&quot;*&quot;)) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) =&gt; {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host &amp;&amp; !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger &amp;&amp; !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

      );
      next.setAttribute(&quot;aria-label&quot;, root.dataset.nextLabel ?? &quot;Next variant&quot;);

      let active = 0;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });

            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);

      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";

      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true

        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();

      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    };
    const root = make('section',undefined,'code-walkthrough');
    root.id = 'lesson-call-chain';
    root.innerHTML = `<header class="cw-header"><a href="../index.html">← vLLM 学习笔记</a><h1></h1><p>先沿源码调用链定位接口，再进入对应的可视化步骤。</p></header>
      <nav class="cw-nav" aria-label="阅读方式"><button type="button" data-cw-view="chain">01 整体调用链</button><button type="button" data-cw-view="visual">02 可视化执行</button></nav>
      <p class="cw-error" role="alert" hidden></p>
      <section class="cw-chain"><div class="cw-variant"><label>实现与场景 <select aria-label="选择调用链实现"></select></label><p class="cw-scope-text"></p><details class="cw-scope"><summary>源码仓库与固定 commit</summary><div class="cw-repositories"></div></details></div>

      <div class="cw-layout"><section class="cw-tree-panel" aria-label="源码调用树"><div class="cw-tools"><strong></strong><div><button type="button" data-cw-expand>全部展开</button> <button type="button" data-cw-fold>只看主链</button></div></div><div class="cw-tree-scroll"><ol class="cw-tree"></ol></div></section>

      <div class="cw-context" tabindex="-1" hidden></div>`;

      const option = make('option',item.title); option.value = item.id; $('.cw-variant select').append(option);
    }
    function validState(value) {
      const nextVariant = variants.get(value?.variant);
      const node = nextVariant?.nodes.find(item => item.id === value.node);
      if (!node || !['chain','visual'].includes(value.screen)) return null;
      const target = value.target === null ? null : Number(value.target);
      if (target !== null && (!Number.isInteger(target) || target < 0 || target >= node.targets.length)) return null;
      return {variant:nextVariant.id,node:node.id,screen:value.screen,target};
    }
    const state = () => ({variant:variant.id,node:selected,screen,target:targetIndex});
    function parseRoute() {
      const query = new URLSearchParams(location.search);
      if (!query.has('cw-view')) return null;
      return validState({variant:query.get('cw-variant'),node:query.get('cw-node'),screen:query.get('cw-view'),target:query.has('cw-target') ? query.get('cw-target') : null});
    }
    function applyState(next) {
      variant = variants.get(next.variant); selected = next.node; screen = next.screen; targetIndex = next.target;
    }
    try {
      const saved = validState(JSON.parse(localStorage.getItem(storageKey)));
      if (saved) applyState({...saved,screen:'chain'});
    } catch {}
    const requested = parseRoute();
    if (requested) applyState(requested);
    function routeKey() {
      const query = new URLSearchParams(location.search);

    let lastRoute = routeKey();
    function urlFor(next = state(),url = new URL(location.href)) {

      if (next.target === null) url.searchParams.delete('cw-target'); else url.searchParams.set('cw-target',String(next.target));
      return url;
    }
    function remember(method = 'replace') {
      try { localStorage.setItem(storageKey,JSON.stringify(state())); } catch {}
      const url = urlFor();
      if (url.href !== location.href) {
        try { history[method + 'State']({...history.state,lessonCallChain:state()},'',url); } catch {}
      }
      lastRoute = routeKey();
    }
    function resetTree() {
      collapsed = new Set(variant.nodes.filter(node => node.parent !== null).map(node => node.id));
      revealSelected();

    function revealSelected() {
      let node = nodeById(selected);
      while (node?.parent) { collapsed.delete(node.parent); node = nodeById(node.parent); }
    }
    function buildTree() {
      const top = $('.cw-tree'); top.replaceChildren();
      const append = (list,parent) => {
        const children = variant.nodes.filter(node => node.parent === parent);
        children.forEach((node,index) => {
          const item = make('li'), row = make('div',undefined,'cw-row');
          const hasChildren = variant.nodes.some(child => child.parent === node.id);
          const branch = make(hasChildren ? 'button' : 'span',hasChildren ? (collapsed.has(node.id) ? '+' : '−') : (index === children.length - 1 ? '└─' : '├─'),hasChildren ? 'cw-toggle' : 'cw-branch');
          if (hasChildren) {
            branch.type = 'button'; branch.dataset.cwToggle = node.id;
            branch.setAttribute('aria-expanded',!collapsed.has(node.id)); branch.setAttribute('aria-label',(collapsed.has(node.id) ? '展开 ' : '收起 ') + node.title);
          } else branch.setAttribute('aria-hidden','true');
          const button = make('button',undefined,'cw-node'); button.type = 'button'; button.dataset.cwNode = node.id;
          const label = make('span'); label.append(make('code',node.title),make('small','[' + node.kind + '] ' + node.summary));
          button.append(make('span',node.number,'cw-number'),label); row.append(branch,button); item.append(row);
          if (hasChildren) { const nested = make('ol',undefined,'cw-tree'); nested.hidden = collapsed.has(node.id); append(nested,node.id); item.append(nested); }
          list.append(item);
        });
      };
      append(top,null); $('.cw-tools strong').textContent = '调用与返回 · ' + variant.nodes.length + ' 个节点';
    }
    function detail() {
      const node = nodeById(selected);
      root.querySelectorAll('[data-cw-node]').forEach(button => {
        if (button.dataset.cwNode === selected) button.setAttribute('aria-current','true'); else button.removeAttribute('aria-current');
      });
      $('.cw-kicker').textContent = '节点 ' + node.number + ' / ' + node.kind;
      $('#cw-node-title').textContent = node.title; $('.cw-summary').textContent = node.summary;
      $('.cw-data').replaceChildren();
      for (const [label,key] of [['输入从哪来','input'],['内部动作与持久状态','changes'],['输出交给谁','output'],['返回后在哪里继续','resume']]) $('.cw-data').append(make('dt',label),make('dd',node[key]));
      $('.cw-note').hidden = !node.note; $('.cw-note').textContent = node.note || '';
      $('.cw-evidence>div').replaceChildren();
      $('.cw-evidence h3').textContent = variant.provenance === 'teaching' ? '算法教学对照 · 不绑定源码' : '源码依据 · 行号属于所示 commit';
      if (variant.provenance === 'teaching') $('.cw-evidence>div').append(make('p','此分支说明教学算法，不表示 vLLM 内存在同名函数。','cw-guide'));
      for (const evidence of node.evidence) {
        const repo = variant.repositories[evidence.repo];
        const link = make('a',evidence.label + ' · ' + evidence.path + ':' + evidence.line + (evidence.end ? '–' + evidence.end : ''));
        link.href = repo.url + '/blob/' + repo.commit + '/' + evidence.path + '#L' + evidence.line + (evidence.end ? '-L' + evidence.end : '');
        link.target = '_blank'; link.rel = 'noopener noreferrer'; link.title = repo.commit;
        link.append(make('small',(repo.label || evidence.repo) + ' @ ' + repo.commit.slice(0,10)));
        $('.cw-evidence>div').append(link);
      }
      $('.cw-targets>div').replaceChildren();
      node.targets.forEach((target,index) => {
        const button = make('button',target.label + ' →','cw-jump'); button.type = 'button'; button.dataset.cwTarget = index; button.disabled = busy;
        $('.cw-targets>div').append(button);
      });
    }
    function render() {
      const visual = screen === 'visual';
      root.dataset.cwBusy = String(busy);
      root.dataset.cwScreen = screen;
      original.forEach(node => node.classList.toggle('lesson-hidden',!visual));
      $('.cw-header').hidden = visual; $('.cw-chain').hidden = visual; $('.cw-context').hidden = !visual;
      root.querySelectorAll('[data-cw-view]').forEach(button => button.setAttribute('aria-pressed',button.dataset.cwView === screen));
      $('[data-cw-view=chain]').textContent = visual ? '← 返回调用链' : '01 整体调用链';
      $('.cw-variant select').value = variant.id; $('.cw-scope-text').textContent = variant.scope;
      const repos = $('.cw-repositories'); repos.replaceChildren();
      $('.cw-scope summary').textContent = variant.provenance === 'teaching' ? '算法教学对照 · 无源码仓库' : '源码仓库与固定 commit';
      for (const [key,repo] of Object.entries(variant.repositories)) {
        const link = make('a',(repo.label || key) + ' · ' + repo.url.replace('https://github.com/','') + ' @ ' + repo.commit);
        link.href = repo.url + '/tree/' + repo.commit; link.target = '_blank'; link.rel = 'noopener noreferrer'; repos.append(link);
      }
      $('.cw-context').textContent = targetIndex === null
        ? '当前展示原交互流程。从调用链的具体节点跳转，可定位对应模式和步骤。'
        : '来自节点 ' + nodeById(selected).number + ' · ' + nodeById(selected).title + '。可继续使用图中的模式与步进控件。';
      detail();
      if (visual) window.dispatchEvent(new Event('resize'));
    }
    function scrollSelected() {
      const button = root.querySelector('[data-cw-node="' + selected + '"]'), box = $('.cw-tree-scroll');
      const a = button.getBoundingClientRect(), b = box.getBoundingClientRect();
      if (a.top < b.top) box.scrollTop += a.top - b.top - 8;
      else if (a.bottom > b.bottom) box.scrollTop += a.bottom - b.bottom + 8;
    }
    function clearError() { $('.cw-error').hidden = true; $('.cw-error').textContent = ''; }
    function errorMessage(error) { $('.cw-error').textContent = '无法定位该步骤：' + error.message; $('.cw-error').hidden = false; }
    window.addEventListener('message',event => {
      if (!frame || event.source !== frame.contentWindow || !event.data) return;
      if (event.data.type === 'lesson-call-ready') frameReady = true;
      if (event.data.type === 'lesson-call-result') {
        const pending = replies.get(event.data.id);
        if (pending) { replies.delete(event.data.id); clearTimeout(pending.timer); event.data.ok ? pending.resolve(event.data.result) : pending.reject(new Error(event.data.error)); }
      }
      if (event.data.type === 'lesson-call-edited' && !busy && screen === 'visual') markEdited();
    });
    function markEdited() {
      targetIndex = null;
      $('.cw-context').textContent = '图中的模式或步骤已手动调整，当前状态不再绑定调用链节点。返回调用链可重新定位源码对应步骤。';
      remember();
    }
    async function invoke(action) {
      if (!frame) {
        if (typeof window.openLessonTarget !== 'function') throw new Error('当前页面缺少步骤入口');
        const work = nativeQueue.then(() => window.openLessonTarget(action));
        nativeQueue = work.catch(() => {});
        return work;
      }
      const deadline = Date.now() + 5000;
      while (!frameReady && Date.now() < deadline) {
        frame.contentWindow?.postMessage({type:'lesson-call-ping'},'*');
        await new Promise(resolve => setTimeout(resolve,80));
      }
      if (!frameReady) throw new Error('内嵌可视化尚未就绪，请稍后重试');
      const id = topic + ':' + ++requestId;
      return new Promise((resolve,reject) => {
        const timer = setTimeout(() => { replies.delete(id); reject(new Error('步骤定位超时')); },8000);
        replies.set(id,{resolve,reject,timer});
        frame.contentWindow.postMessage({type:'lesson-call-open',id,action},'*');
      });
    }
    async function openTarget(index,method = 'push',scroll = true) {
      const target = nodeById(selected).targets[index];
      if (!target) return;
      const currentPage = location.pathname.split('/').at(-1);
      if (target.action.page && target.action.page !== currentPage) {
        if (!['index.html','comparison.html'].includes(target.action.page)) throw new Error('不支持的页面目标');
        const url = new URL(target.action.page,location.href); url.hash = '';
        location.assign(urlFor({...state(),screen:'visual',target:index},url)); return;
      }
      const job = ++revision; busy = true; screen = 'visual'; targetIndex = index; clearError(); render();
      $('.cw-context').textContent = '正在定位：' + target.label;
      try {
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const result = await invoke(target.action);
        if (job !== revision) return;
        $('.cw-context').textContent = '来自节点 ' + nodeById(selected).number + ' · ' + nodeById(selected).title + ' → ' + (result?.label || target.label);
        if (method) remember(method);
        if (scroll) { $('.cw-context').scrollIntoView({block:'start'}); $('.cw-context').focus({preventScroll:true}); }
      } catch (error) {
        if (job === revision) { screen = 'chain'; render(); errorMessage(error); }
      } finally { if (job === revision) { busy = false; root.dataset.cwBusy = 'false'; detail(); } }
    }
    function pauseVisual() {
      if (frame) frame.contentWindow?.postMessage({type:'lesson-call-pause'},'*');
      else window.dispatchEvent(new Event('lesson-pause-visual'));
    }
    function openChain() {
      revision++; busy = false; screen = 'chain'; clearError();
      pauseVisual();
      revealSelected(); buildTree(); render(); remember('push'); scrollSelected();
      root.scrollIntoView({block:'start'});
    }
    root.addEventListener('click',event => {
      const target = event.target.closest('[data-cw-target]');
      if (target) { openTarget(Number(target.dataset.cwTarget)); return; }
      const layer = event.target.closest('[data-cw-view]');
      if (layer) {
        if (layer.dataset.cwView === 'chain') openChain();
        else if (targetIndex !== null) openTarget(targetIndex);
        else { screen = 'visual'; clearError(); render(); remember('push'); }
        return;
      }
      const toggle = event.target.closest('[data-cw-toggle]');
      if (toggle) {
        const id = toggle.dataset.cwToggle;
        if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
        buildTree(); detail(); root.querySelector('[data-cw-toggle="' + id + '"]').focus({preventScroll:true}); return;
      }
      const button = event.target.closest('[data-cw-node]');
      if (button) {
        selected = button.dataset.cwNode; targetIndex = null; clearError(); detail(); remember('push');
        if (matchMedia('(max-width:760px)').matches) { $('.cw-detail').scrollIntoView({block:'start'}); $('.cw-detail').focus({preventScroll:true}); }
      }
    });
    $('[data-cw-expand]').addEventListener('click',() => { collapsed.clear(); buildTree(); detail(); });
    $('[data-cw-fold]').addEventListener('click',() => { collapsed = new Set(variant.nodes.filter(node => node.parent !== null).map(node => node.id)); buildTree(); detail(); });
    $('.cw-variant select').addEventListener('change',event => {
      variant = variants.get(event.target.value); selected = variant.entry || variant.nodes[0].id; targetIndex = null;
      resetTree(); buildTree(); clearError(); render(); remember('push');
    });
    for (const name of ['click','change']) document.addEventListener(name,event => {
      if (event.isTrusted && !busy && screen === 'visual' && event.target.closest('.lesson-original') && event.target.closest('button,select,input')) markEdited();
    },true);
    window.addEventListener('popstate',() => {
      if (routeKey() === lastRoute) return;
      lastRoute = routeKey(); revision++; busy = false;
      const next = parseRoute() || {variant:fallback.id,node:fallback.entry || fallback.nodes[0].id,screen:'chain',target:null};
      applyState(next); resetTree(); buildTree(); render(); clearError();
      if (screen === 'visual' && targetIndex !== null) openTarget(targetIndex,null,false);
      else if (screen === 'chain') { pauseVisual(); scrollSelected(); }
    });
    resetTree(); buildTree(); render();
    if (screen === 'visual' && targetIndex !== null) openTarget(targetIndex,null,false);
    else if (screen === 'chain') scrollSelected();
    document.documentElement.dataset.callChainReady = 'true';
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',mount,{once:true}); else mount();
})();
</script>

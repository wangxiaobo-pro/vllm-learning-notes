,2]&quot;,&quot;history_RS_output_per_rank&quot;:&quot;[1,1,2]&quot;,&quot;history_RS_LSE_per_rank&quot;:&quot;[1,1]&quot;,&quot;current_KV_per_rank&quot;:&quot;[1,1,2]&quot;,&quot;final_O_per_rank&quot;:&quot;[1,1,2]&quot;},&quot;steps&quot;:[{&quot;n&quot;:1,&quot;operation&quot;:&quot;Own Q heads and historical KV-token shards&quot;,&quot;description&quot;:&quot;rank0 initially has Q head0 and KV for history tokens 0,2; rank1 has Q head1 and KV for tokens 1,3. KV head count stays one; context is sharded by token positions.&quot;},{&quot;n&quot;:2,&quot;operation&quot;:&quot;All-Gather Q along head axis&quot;,&quot;description&quot;:&quot;Each rank obtains both Q heads, shape [1,2,2], to query its own history shard.&quot;},{&quot;n&quot;:3,&quot;operation&quot;:&quot;Local softmax attention&quot;,&quot;description&quot;:&quot;For each Q head calculate local scores QK^T/sqrt(2), local softmax, normalized local O and local natural-log LSE. Local O values cannot be directly averaged or summed.&quot;},{&quot;n&quot;:4,&quot;operation&quot;:&quot;All-Gather LSE and reweight local O&quot;,&quot;description&quot;:&quot;L_hist[h]=logsumexp(L_0[h],L_1[h]); alpha_r[h]=exp(L_r[h]-L_hist[h]); C_r[h]=alpha_r[h]*O_r[h]. This needs gathered LSE, not a full historical-KV gather.&quot;},{&quot;n&quot;:5,&quot;operation&quot;:&quot;Reduce-Scatter SUM along Q-head axis&quot;,&quot;description&quot;:&quot;Mathematically O_hist=C0+C1. One reduce-scatter performs this SUM and returns head0 to rank0, head1 to rank1. The full summed O in JSON is explanatory; do not draw an extra SUM communication followed by another RS reduction. Each rank also selects its matching global LSE head slice.&quot;},{&quot;n&quot;:6,&quot;operation&quot;:&quot;Current-token attention on each local Q head&quot;,&quot;description&quot;:&quot;Current token K=[1,1], V=[2,2] is available to each local Q head through the replicated single KV head. With one key, current O=V and LSE=its score=1. Historical context excludes this token, so it is not double-counted.&quot;},{&quot;n&quot;:7,&quot;operation&quot;:&quot;Merge history and current token states&quot;,&quot;description&quot;:&quot;L_final=logaddexp(L_hist,L_cur); O_final=exp(L_hist-L_final)*O_hist + exp(L_cur-L_final)*O_cur. Each rank merges its own head locally. This merge combines attention states; it is not a KV-buffer concat or a second cross-rank reduction.&quot;},{&quot;n&quot;:8,&quot;operation&quot;:&quot;Verify against full attention&quot;,&quot;description&quot;:&quot;Compare final per-head outputs against one softmax over all five tokens [history0..3,current4]. Verify history-only combine separately against four-token full attention.&quot;}],&quot;formulas&quot;:[&quot;S_r[h,j]=dot(Q[h],K_r[j])/sqrt(2)&quot;,&quot;L_r[h]=log(sum_j exp(S_r[h,j]))&quot;,&quot;O_r[h]=sum_j exp(S_r[h,j]-L_r[h])*V_r[j]&quot;,&quot;L_hist[h]=logsumexp_r(L_r[h])&quot;,&quot;C_r[h]=exp(L_r[h]-L_hist[h])*O_r[h]&quot;,&quot;O_hist[h]=sum_r C_r[h]&quot;,&quot;L_final[h]=logaddexp(L_hist[h],L_cur[h])&quot;,&quot;O_final[h]=exp(L_hist[h]-L_final[h])*O_hist[h]+exp(L_cur[h]-L_final[h])*O_cur[h]&quot;],&quot;full_precision&quot;:{&quot;Q_all_heads&quot;:[[1.4142135623730951,0],[0,1.4142135623730951]],&quot;initial_Q_by_rank&quot;:{&quot;rank0&quot;:[[1.4142135623730951,0]],&quot;rank1&quot;:[[0,1.4142135623730951]]},&quot;Q_after_all_gather_by_rank&quot;:{&quot;rank0&quot;:[[1.4142135623730951,0],[0,1.4142135623730951]],&quot;rank1&quot;:[[1.4142135623730951,0],[0,1.4142135623730951]]},&quot;history_K&quot;:[[1,0],[0,1],[2,0],[0,2]],&quot;history_V&quot;:[[1,0],[0,1],[2,1],[1,2]],&quot;history_shards&quot;:[{&quot;rank&quot;:0,&quot;history_token_indices&quot;:[0,2],&quot;K&quot;:[[1,0],[2,0]],&quot;V&quot;:[[1,0],[2,1]],&quot;scores&quot;:[[1,2],[0,0]],&quot;probabilities&quot;:[[0.2689414213699951,0.7310585786300049],[0.5,0.5]],&quot;O&quot;:[[1.7310585786300048,0.7310585786300049],[1.5,0.5]],&quot;LSE&quot;:[2.313261687518223,0.69314718055 &lt;script&gt;
(() =&gt; {
  const root=document.getElementById('parallelism-flows');
  const $=s=&gt;root.querySelector(s);
  const examples=JSON.parse(document.getElementById('pf-example-data').textContent);
  const {tpdp,eppp,spcp}=examples;
  const base='https://github.com/vllm-project/vllm/blob/295c062db8a48ea73bbd05d1174cb37d24bf86f9/';
  const transpose=a=&gt;a[0].map((_,c)=&gt;a.map(r=&gt;r[c]));
  const mat=(label,value,ready)=&gt;({label,value,ready});
  const node=(id,lane,row,title,tables=[],note='',ready=1)=&gt;({id,lane,row,title,tables,note,ready});
  const edge=(from,to,step,label,type='local',extra={})=&gt;({from,to,step,label,type,...extra});
  const stage=(name,detail)=&gt;({name,detail});
  const source=(label,path)=&gt;({label,url:base+path});
  const paired=(m,from,to,s,label,type='local')=&gt;[0,1].forEach(r=&gt;m.edges.push(edge(from+r,to+r,s,label,type)));
  function exchange(m,from,to,s,label,payload){
    for(let a=0;a&lt;2;a++)for(let b=0;b&lt;2;b++)m.edges.push(edge(from+a,to+b,s,label,a===b?'local':'remote',{group:label,packet:payload||label,cross:a!==b}));
  }
  function common(title,scope,lanes){return {title,scope,lanes,nodes:[],edges:[],steps:[],math:[],boundary:'',sources:[]};}
  const modes={};
  {
    const m=modes.tp=common('TP · 同一批输入，共同算一个网络','TP=2 · 2 tokens × 2 hidden · 两端分担中间特征',['TP rank 0','TP rank 1']);
    m.steps=[stage('同一输入进入两个 TP rank','两端都持有同一个 X；常驻权重已按特征维切分，输入 token 行没有减半。'),stage('第一层投影','X 乘本地 W1 分片，各自产生不同的 2 个中间特征 Z。'),stage('本地 ReLU','将本地负值变为 0；H 保持特征分片，直接交给第二层。'),stage('第二层产生部分和','H 乘对应的 W2 分片。Y₀、Y₁ 都是 2×2，但数值仍是部分贡献。'),stage('All-Reduce 求和并复制结果','Y₀ + Y₁ = [[2,7],[1,2]]；两个 rank 都得到完整结果。交叉边表示远端贡献，竖直边表示本地贡献。'),stage('输出继续流入下一层','完整 Y 在两个 TP rank 上进入后续本地计算。')];
    tpdp.tp.ranks.forEach((r,i)=&gt;{

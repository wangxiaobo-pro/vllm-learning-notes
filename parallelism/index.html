&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

    tp:{title:'TP · 张量并行',scope:'TP=2 · 同一批 4 tokens · 普通两层 MLP · hidden 8，intermediate 16',ranks:['TP rank 0','TP rank 1'],owns:['W1 / W2 的一半','W1 / W2 的另一半'],boundary:'此例为 ColumnParallelLinear → 激活 → RowParallelLinear，关闭 bias；gather_output=False、input_is_parallel=True、reduce_results=True。TP 切权重与特征维，MLP 不管理请求 KV。Attention 的 KV heads 可分片或复制，不能从此 MLP 示例推出其布局。通信图表示逻辑数据流，不指定 NCCL 的 ring/tree 算法。',sources:[['ColumnParallelLinear','vllm/model_executor/layers/linear.py#L603'],['RowParallelLinear 与 All-Reduce','vllm/model_executor/layers/linear.py#L1762']],steps:[

    sp:{title:'SP · 激活的序列并行',scope:'DeepSeek MoE SP · TP=2、PP=1 · 8 tokens · 连续 MoE 层 · 复用 TP ranks',ranks:['TP / SP rank 0','TP / SP rank 1'],owns:['本地 token 0–3','本地 token 4–7'],boundary:'这里的 SP 是 use_sequence_parallel_moe 的激活分片路径，不是 Ulysses。residual 仍保留本地 token 分片；首次进入 SP 时切片并按需 padding。MoE 专家归属与通信由 TP/EP 后端决定，SP 本身不决定历史 KV 的所有权。退出 SP 或模型末尾需要 gather 并移除 padding。',sources:[['DeepSeek 层入口与 All-Gather','vllm/model_executor/models/deepseek_v2.py#L1352'],['Reduce-Scatter 与 MoE','vllm/model_executor/models/deepseek_v2.py#L1395'],['退出 SP','vllm/model_executor/models/deepseek_v2.py#L1550']],steps:[

      local('TP Attention 得到部分和',['A₀ [8,H]','A₁ [8,H]'],['输出投影对全部 tokens 的部分贡献','输出投影对全部 tokens 的部分贡献'],'Attention 输出投影 reduce_results=False，此处尚未做 TP All-Reduce。'),
      comm('求和并重新按 token 分片','Reduce-Scatter · token 轴',['(A₀+A₁) 的 token 0–3 → [4,H]','(A₀+A₁) 的 token 4–7 → [4,H]'],'先合并 TP 的部分贡献，再按 token 轴散布；Reduce-Scatter 包含求和，不能画成普通切片。',[[0,1,'both']]),

    pp:{title:'PP · 流水线并行',scope:'Qwen2 · PP=3、TP=1 · 6 层 · 普通 V1 Runner · 一个 batch 的路径',ranks:['Stage 0','Stage 1','Stage 2'],owns:['嵌入 · L0/1','L2/3','L4/5 · Norm'],boundary:'broadcast_pp_output=False，无辅助 hidden 输出。每个 stage 的 KV 仅属于自己负责的 attention 层，通信发送 hidden/residual。模型 return 只是本地对象返回，Worker 的 isend 才提交跨 rank 发送；异步提交与接收完成是两个时点。本图展示一个 batch 的依赖链，多 batch 可重叠推进，但不会消除单 batch 的前后依赖。',sources:[['Worker 提交接收','vllm/v1/worker/gpu_worker.py#L1277'],['Qwen2 层执行与返回','vllm/model_executor/models/qwen2.py#L409'],['Worker 提交发送','vllm/v1/worker/gpu_worker.py#L1314'],['Runner 非末返回与末 stage logits','vllm/v1/worker/gpu_model_runner.py#L4400']],steps:[

      local('采样与下一轮 Decode',['下一轮 L0/1','下一轮 L2/3','采样 → token'],['下一 token 再经过首段','下一 token 仍依赖首段输出','采样得到新 token，输出回到引擎调度流程'],'采样结果回到引擎调度流程，下一轮仍依次经过 Stage 0→1→2。')

    cp:{title:'CP · 上下文并行（DCP 路径）',scope:'FlashAttention · PCP=1、TP=DCP=2 · ag_rs · 4 Q heads / 1 KV head',ranks:['TP / DCP rank 0','TP / DCP rank 1'],owns:['历史 KV：偶数位置','历史 KV：奇数位置'],boundary:'采用 FlashAttention 的 ag_rs 分支，历史长度 8、当前 token 位置 8、interleave=1。DCP 在此配置复用 TP ranks；并非额外两张卡。PCP 另用于切分 prefill 序列计算，组与 world size 规则不同；另有 a2a 与 MLA 专用路径。本图不把 SP 的 activation 切分等同于 KV 分片，也不把局部 attention 输出直接相加。',sources:[['DCP Attention 主流程','vllm/v1/attention/backends/flash_attn.py#L1595'],['LSE 校正与 Reduce-Scatter','vllm/v1/attention/ops/dcp.py#L438'],['历史长度排除当前 chunk','vllm/v1/attention/backends/flash_attn.py#L884'],['DCP / PCP 建组','vllm/distributed/parallel_state.py#L2216']],steps:[
      local('历史 KV 按位置分摊',['KV 0,2,4,6','KV 1,3,5,7'],['本地保存历史位置 0、2、4、6 的 KV','本地保存历史位置 1、3、5、7 的 KV'],'每端读取自己的历史 KV；组内共同覆盖完整 8-token 历史。'),
      local('计算当前 token 的 Q/K/V',['Q heads 0–1','Q heads 2–3'],['本地 Q heads 0–1，以及 token 8 的临时 K/V','本地 Q heads 2–3，以及 token 8 的临时 K/V'],'token 8 是本轮 Decode 输入；单个 KV head 在 TP 两端复制，因此两端都有当前临时 K/V，历史 KV 仍按位置分片。'),
      comm('汇集 Query heads','All-Gather · head 轴',['Q heads 0–3；历史 KV 仍只有偶数位置','Q heads 0–3；历史 KV 仍只有奇数位置'],'汇集的是 Q，不是完整历史 KV；各 KV 分片都需要覆盖全体 query heads。',[[0,1,'both']]),
      local('读取本地历史 KV 做 attention',['O₀、LSE₀','O₁、LSE₁'],['Q 对 KV 0,2,4,6 → 局部输出与 LSE','Q 对 KV 1,3,5,7 → 局部输出与 LSE'],'每个局部输出用了自己的 softmax 分母，因此还不是完整上下文的结果。'),
      comm('交换 LSE，校正局部输出','All-Gather · LSE',['O₀ × exp(LSE₀−LSE)','O₁ × exp(LSE₁−LSE)'],'全历史 LSE = logsumexp(LSE₀,LSE₁)。用归一化权重校正各局部输出，不能直接平均。',[[0,1,'both']]),
      comm('合并历史贡献，恢复 head 分片','Reduce-Scatter · head 轴',['完整历史输出：heads 0–1','完整历史输出：heads 2–3'],'对已经校正的输出求和，同时按 head 轴散布；仍保留全历史对应的 LSE。',[[0,1,'both']]),
      local('单独计算当前 query chunk',['token 8 attention','token 8 attention'],['原本地 Q × 当前 chunk K/V → Oquery、LSEquery','原本地 Q × 当前 chunk K/V → Oquery、LSEquery'],'普通 Decode 的当前 chunk 只有 token 8；它与前面读取的历史 context 分开计算。'),
      local('合并历史与当前 chunk',['合并注意力状态','合并注意力状态'],['merge_attn_states 后返回 heads 0–1 的最终输出','merge_attn_states 后返回 heads 2–3 的最终输出'],'最后合并 context 与 query 两部分；token 8 的持久 KV 归 R0，下轮成为历史。后续输出投影按 TP 路径继续。')
    ]},
    dp:{title:'DP · 数据并行',scope:'Dense 推理 · DP=2、TP=PP=1 · 内部负载均衡 · A / B 是不同请求',ranks:['入口 / Router','DP Engine 0','DP Engine 1'],owns:['维护请求归属','Scheduler 0 / KV0','Scheduler 1 / KV1'],boundary:'此例是常规 dense 推理。每个 DP EngineCore 有独立请求队列、Scheduler 与 KV 命名空间；DP 仍存在负载和状态协调。MoE+EP 时 EP group 可跨 DP ranks，专家通信会把这些 ranks 连接起来，不能套用“无跨 DP hidden 合并”的 dense 假设。吞吐扩展不代表单请求必然更快。',sources:[['负载选择与请求归属','vllm/v1/engine/core_client.py#L1642'],['ADD 发给选中 EngineCore','vllm/v1/engine/core_client.py#L1582'],['schedule → execute → update','vllm/v1/engine/core.py#L654']],steps:[
      local('两个独立的模型副本',['负载信息','完整模型副本','完整模型副本'],['维护实例负载视图','Scheduler / 请求队列 / KV pool 独立','Scheduler / 请求队列 / KV pool 独立'],'DP 按请求分工；TP=PP=1 的此例中每个副本拥有完整 dense 模型。',[1,2]),
      comm('入口按负载选择 A 的实例','ADD · 请求 A',['记录 A→DP0','接收 A 的 ADD','暂未接收 A'],'负载选择综合等待、运行、在途请求与 KV 压力；示例将 A 分配给 DP0。',[[0,1]]),
      comm('入口为 B 独立选择实例','ADD · 请求 B',['记录 B→DP1','A 仍属于 DP0','接收 B 的 ADD'],'示例将 B 分配给 DP1；它不是必须轮询，更不是把 A 的一半送给另一个副本。',[[0,2]]),
      local('各自 Scheduler 组 batch',['保持请求归属','A：4 tokens','B：6 tokens'],['A→DP0，B→DP1','为 A 分配本地 KV 与调度计划','为 B 分配本地 KV 与调度计划'],'两个 Scheduler 独立推进，各自计划下发给自己的 Worker。',[1,2]),
      local('各自 Worker 完成 Prefill',['等待结果','A [4,8]','B [6,8]'],['等待对应请求的输出','读取模型副本，写 A 的本地 KV','读取模型副本，写 B 的本地 KV'],'常规 dense forward 不跨 DP 合并 hidden；不同请求的结果分别计算。',[1,2]),
      local('各自采样并返回本请求结果',['按请求 ID 分流','A 的首 token','B 的首 token'],['将 A/B 结果分别送回各自客户端','logits → sample → 返回 A 的输出流','logits → sample → 返回 B 的输出流'],'API 输出按请求 ID 回到各自客户端；不会拼成同一请求的生成结果。'),
      local('在原实例持续 Decode',['保持归属','A 继续 DP0','B 继续 DP1'],['请求结束后清理对应路由记录','A 读取 KV0，每轮处理新增 token','B 读取 KV1，每轮处理新增 token'],'同一请求继续使用所属实例的 KV；完成后清理路由记录与本地请求资源。')
    ]}
  };
  const ns='http://www.w3.org/2000/svg';
  const svg=$('#pf-diagram');
  let mode='tp',step=0;
  const validState=s=&gt;{if(s&amp;&amp;s.visual==='vLLM 并行流程'&amp;&amp;data[s.mode]){mode=s.mode;step=Math.min(data[mode].steps.length,Math.max(0,Math.floor(Number(s.step)||0)));}};
  validState(window.openai?.widgetState?.modelContent);
  function save(){window.openai?.setWidgetState?.({modelContent:{visual:'vLLM 并行流程',mode,step,stage:step?data[mode].steps[step-1].name:'全局关系'},privateContent:null})?.catch(()=&gt;{});}
  function el(tag,attrs={},text){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=&gt;n.setAttribute(k,String(v)));if(text!==undefined)n.textContent=text;svg.append(n);return n;}
  function lines(text,max){const result=[];let current='',size=0;for(const c of text){const n=/[\x00-\xff]/.test(c)?6.2:12;if(size+n&gt;max&amp;&amp;current){result.push(current);current='';size=0;}current+=c;size+=n;}if(current)result.push(current);return result;}
  function text(x,y,value,max,cls=''){const n=el('text',{x,y,'text-anchor':'middle',class:cls});lines(value,max).forEach((s,i)=&gt;{const t=document.createElementNS(ns,'tspan');t.setAttribute('x',x);t.setAttribute('dy',i?'17':'0');t.textContent=s;n.append(t);});return n;}
  function badge(x,y,num){el('circle',{cx:x,cy:y,r:10,class:'pf-number','data-number':num});el('text',{x,y:y+4,'text-anchor':'middle'},num);}
  function pipeline(width){const host=$('#pf-pipeline');host.replaceChildren();const show=mode==='pp'&amp;&amp;(step===0||step===8);$('#pf-pipeline-wrap').hidden=!show;if(!show)return;const add=(tag,attrs,label)=&gt;{const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=&gt;n.setAttribute(k,v));if(label!==undefined)n.textContent=label;host.append(n);return n;};const left=58;const cell=(width-left-4)/5;host.setAttribute('viewBox',`0 0 ${width} 152`);host.setAttribute('height','152');for(let t=0;t&lt;5;t++)add('text',{x:left+(t+.5)*cell,y:14,'text-anchor':'middle'},`时隙${t+1}`);for(let r=0;r&lt;3;r++){add('text',{x:2,y:45+r*37},`Stage ${r}`);for(let t=0;t&lt;5;t++){const job=t-r;const active=job&gt;=0&amp;&amp;job&lt;3;add('rect',{x:left+t*cell+2,y:25+r*37,width:cell-4,height:29,rx:3,fill:active?`color-mix(in srgb,var(--viz-series-${job+1}) 22%,var(--background))`:'var(--muted)'});add('text',{x:left+(t+.5)*cell,y:45+r*37,'text-anchor':'middle'},active?['A','B','C'][job]:'—');}}add('text',{x:2,y:150},'A / B / C 为不同 batch；— 为气泡。未计通信。');}
  function draw(animate=false){
    const m=data[mode];const width=Math.max(280,Math.floor(root.getBoundingClientRect().width));const n=m.ranks.length;const margin=10;const laneW=(width-2*margin)/n;const xs=m.ranks.map((_,i)=&gt;margin+laneW*(i+.5));
    pipeline(width);
    svg.replaceChildren();const defs=el('defs');const marker=document.createElementNS(ns,'marker');Object.entries({id:'pf-arrow',viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'}).forEach(([k,v])=&gt;marker.setAttribute(k,v));const tip=document.createElementNS(ns,'path');tip.setAttribute('d','M1 1 L7 4 L1 7');tip.setAttribute('fill','none');tip.setAttribute('stroke','var(--viz-series-1)');marker.append(tip);defs.append(marker);
    const events=step?[{s:m.steps[step-1],i:step-1}]:m.steps.map((s,i)=&gt;({s,i}));
    const rowH=108;const startY=108;const height=startY+events.length*rowH+12;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('height',height);svg.setAttribute('aria-label',`${m.title}：${step?m.steps[step-1].name:'完整编号流程'}。从上到下为逻辑执行顺序，横向箭头为通信，节点内编号为本地动作。`);
    m.ranks.forEach((rank,i)=&gt;{el('rect',{x:margin+i*laneW+3,y:4,width:laneW-6,height:78,rx:6,fill:'var(--muted)',stroke:'var(--border)'});text(xs[i],24,rank,laneW-18,'pf-bold');text(xs[i],55,m.owns[i],laneW-18,'pf-muted');el('line',{x1:xs[i],x2:xs[i],y1:84,y2:height-6,stroke:'var(--border)','stroke-width':1});});
    const moving=[];
    events.forEach(({s,i},row)=&gt;{
      const y=startY+row*rowH;const name=el('text',{x:10,y:y-7,class:'pf-bold'},`${i+1}. ${s.name}`);
      if(s.edges.length){
        const ay=y+49;
        s.edges.forEach(([a,b,dir])=&gt;{
          let x1=a===null?(b===0?width-28:28):xs[a],x2=xs[b];
          const p=el('path',{d:`M${x1} ${ay} L${x2} ${ay}`,class:'pf-flow','marker-end':'url(#pf-arrow)','data-step-arrow':i+1});if(dir==='both')p.setAttribute('marker-start','url(#pf-arrow)');moving.push(p);badge((x1+x2)/2,ay,i+1);
          el('circle',{cx:x1,cy:ay,r:3,fill:'var(--viz-series-1)'});
        });
        text(width/2,y+22,s.label,width-20);
        const tail=mode==='dp'?'入口下发请求 · 不是 GPU collective':s.edges[0][2]==='both'?'逻辑 collective · 两端参与':'中间激活 · 完成接收后消费';text(width/2,y+81,tail,width-20,'pf-muted');
      }else{
        s.labels.forEach((label,j)=&gt;{const active=!s.active||s.active.includes(j);const boxW=laneW-12;el('rect',{x:xs[j]-boxW/2,y:y+16,width:boxW,height:62,rx:5,class:active?'pf-local':'',fill:active?'color-mix(in srgb,var(--viz-series-1) 9%,var(--background))':'var(--background)',stroke:'var(--border)'});if(active)badge(xs[j]-boxW/2+13,y+29,i+1);text(xs[j],y+54,label,boxW-12,active?'':'pf-muted');});
      }
    });

  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;
"></iframe>

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );

   * @param {object} prototype
   * @param {string} property
   */

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {

      apply(postHostMessage, hostPort, [{ type, ...payload }]);

    }

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,

    }

      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

    }

      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });

    });
  };

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

                } else {

        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }

  });

  syncTheme();
})();

,2]&quot;,&quot;history_RS_output_per_rank&quot;:&quot;[1,1,2]&quot;,&quot;history_RS_LSE_per_rank&quot;:&quot;[1,1]&quot;,&quot;current_KV_per_rank&quot;:&quot;[1,1,2]&quot;,&quot;final_O_per_rank&quot;:&quot;[1,1,2]&quot;},&quot;steps&quot;:[{&quot;n&quot;:1,&quot;operation&quot;:&quot;Own Q heads and historical KV-token shards&quot;,&quot;description&quot;:&quot;rank0 initially has Q head0 and KV for history tokens 0,2; rank1 has Q head1 and KV for tokens 1,3. KV head count stays one; context is sharded by token positions.&quot;},{&quot;n&quot;:2,&quot;operation&quot;:&quot;All-Gather Q along head axis&quot;,&quot;description&quot;:&quot;Each rank obtains both Q heads, shape [1,2,2], to query its own history shard.&quot;},{&quot;n&quot;:3,&quot;operation&quot;:&quot;Local softmax attention&quot;,&quot;description&quot;:&quot;For each Q head calculate local scores QK^T/sqrt(2), local softmax, normalized local O and local natural-log LSE. Local O values cannot be directly averaged or summed.&quot;},{&quot;n&quot;:4,&quot;operation&quot;:&quot;All-Gather LSE and reweight local O&quot;,&quot;description&quot;:&quot;L_hist[h]=logsumexp(L_0[h],L_1[h]); alpha_r[h]=exp(L_r[h]-L_hist[h]); C_r[h]=alpha_r[h]*O_r[h]. This needs gathered LSE, not a full historical-KV gather.&quot;},{&quot;n&quot;:5,&quot;operation&quot;:&quot;Reduce-Scatter SUM along Q-head axis&quot;,&quot;description&quot;:&quot;Mathematically O_hist=C0+C1. One reduce-scatter performs this SUM and returns head0 to rank0, head1 to rank1. The full summed O in JSON is explanatory; do not draw an extra SUM communication followed by another RS reduction. Each rank also selects its matching global LSE head slice.&quot;},{&quot;n&quot;:6,&quot;operation&quot;:&quot;Current-token attention on each local Q head&quot;,&quot;description&quot;:&quot;Current token K=[1,1], V=[2,2] is available to each local Q head through the replicated single KV head. With one key, current O=V and LSE=its score=1. Historical context excludes this token, so it is not double-counted.&quot;},{&quot;n&quot;:7,&quot;operation&quot;:&quot;Merge history and current token states&quot;,&quot;description&quot;:&quot;L_final=logaddexp(L_hist,L_cur); O_final=exp(L_hist-L_final)*O_hist + exp(L_cur-L_final)*O_cur. Each rank merges its own head locally. This merge combines attention states; it is not a KV-buffer concat or a second cross-rank reduction.&quot;},{&quot;n&quot;:8,&quot;operation&quot;:&quot;Verify against full attention&quot;,&quot;description&quot;:&quot;Compare final per-head outputs against one softmax over all five tokens [history0..3,current4]. Verify history-only combine separately against four-token full attention.&quot;}],&quot;formulas&quot;:[&quot;S_r[h,j]=dot(Q[h],K_r[j])/sqrt(2)&quot;,&quot;L_r[h]=log(sum_j exp(S_r[h,j]))&quot;,&quot;O_r[h]=sum_j exp(S_r[h,j]-L_r[h])*V_r[j]&quot;,&quot;L_hist[h]=logsumexp_r(L_r[h])&quot;,&quot;C_r[h]=exp(L_r[h]-L_hist[h])*O_r[h]&quot;,&quot;O_hist[h]=sum_r C_r[h]&quot;,&quot;L_final[h]=logaddexp(L_hist[h],L_cur[h])&quot;,&quot;O_final[h]=exp(L_hist[h]-L_final[h])*O_hist[h]+exp(L_cur[h]-L_final[h])*O_cur[h]&quot;],&quot;full_precision&quot;:{&quot;Q_all_heads&quot;:[[1.4142135623730951,0],[0,1.4142135623730951]],&quot;initial_Q_by_rank&quot;:{&quot;rank0&quot;:[[1.4142135623730951,0]],&quot;rank1&quot;:[[0,1.4142135623730951]]},&quot;Q_after_all_gather_by_rank&quot;:{&quot;rank0&quot;:[[1.4142135623730951,0],[0,1.4142135623730951]],&quot;rank1&quot;:[[1.4142135623730951,0],[0,1.4142135623730951]]},&quot;history_K&quot;:[[1,0],[0,1],[2,0],[0,2]],&quot;history_V&quot;:[[1,0],[0,1],[2,1],[1,2]],&quot;history_shards&quot;:[{&quot;rank&quot;:0,&quot;history_token_indices&quot;:[0,2],&quot;K&quot;:[[1,0],[2,0]],&quot;V&quot;:[[1,0],[2,1]],&quot;scores&quot;:[[1,2],[0,0]],&quot;probabilities&quot;:[[0.2689414213699951,0.7310585786300049],[0.5,0.5]],&quot;O&quot;:[[1.7310585786300048,0.7310585786300049],[1.5,0.5]],&quot;LSE&quot;:[2.313261687518223,0.69314718055 &lt;script type=&quot;application/json&quot; id=&quot;pf-training-data&quot;&gt;{&quot;schema_version&quot;:1,&quot;title&quot;:&quot;三 GPU 数据并行训练：本地梯度 → All-Reduce 平均 → 相同更新&quot;,&quot;world_size&quot;:3,&quot;X&quot;:[[3,0],[0,3],[3,3]],&quot;T&quot;:[[2,6],[0,2],[2,8]],&quot;W&quot;:[[1,2],[0,1]],&quot;learning_rate&quot;:0.1,&quot;ranks&quot;:[{&quot;rank&quot;:0,&quot;X&quot;:[[3,0]],&quot;T&quot;:[[2,6]],&quot;W&quot;:[[1,2],[0,1]],&quot;Y&quot;:[[3,6]],&quot;residual&quot;:[[1,0]],&quot;loss&quot;:0.5,&quot;G&quot;:[[3,0],[0,0]],&quot;gradient_after_allreduce&quot;:[[2,1],[1,2]],&quot;Wnext&quot;:[[0.8,1.9],[-0.1,0.8]]},{&quot;rank&quot;:1,&quot;X&quot;:[[0,3]],&quot;T&quot;:[[0,2]],&quot;W&quot;:[[1,2],[0,1]],&quot;Y&quot;:[[0,3]],&quot;residual&quot;:[[0,1]],&quot;loss&quot;:0.5,&quot;G&quot;:[[0,0],[0,3]],&quot;gradient_after_allreduce&quot;:[[2,1],[1,2]],&quot;Wnext&quot;:[[0.8,1.9],[-0.1,0.8]]},{&quot;rank&quot;:2,&quot;X&quot;:[[3,3]],&quot;T&quot;:[[2,8]],&quot;W&quot;:[[1,2],[0,1]],&quot;Y&quot;:[[3,9]],&quot;residual&quot;:[[1,1]],&quot;loss&quot;:1,&quot;G&quot;:[[3,3],[3,3]],&quot;gradient_after_allreduce&quot;:[[2,1],[1,2]],&quot;Wnext&quot;:[[0.8,1.9],[-0.1,0.8]]}],&quot;gradient_sum&quot;:[[6,3],[3,6]],&quot;gradient_mean&quot;:[[2,1],[1,2]],&quot;Wnext&quot;:[[0.8,1.9],[-0.1,0.8]],&quot;losses&quot;:[0.5,0.5,1],&quot;loss_sum&quot;:2,&quot;loss_mean&quot;:0.6666666666666666,&quot;batch_gradient_mean&quot;:[[2,1],[1,2]],&quot;formulas&quot;:{&quot;forward&quot;:&quot;Y_i = X_i @ W&quot;,&quot;loss&quot;:&quot;L_i = 0.5 * sum((Y_i - T_i)^2)&quot;,&quot;local_gradient&quot;:&quot;G_i = X_i.T @ (Y_i - T_i)&quot;,&quot;allreduce&quot;:&quot;G_mean = (G_0 + G_1 + G_2) / 3&quot;,&quot;update&quot;:&quot;W_next = W - 0.1 * G_mean&quot;,&quot;batch_objective&quot;:&quot;L_batch = (L_0 + L_1 + L_2) / 3&quot;,&quot;batch_gradient&quot;:&quot;grad_W L_batch = X.T @ (X @ W - T) / 3&quot;},&quot;steps&quot;:[{&quot;n&quot;:1,&quot;operation&quot;:&quot;按样本行切分输入&quot;,&quot;detail&quot;:&quot;X[3,2] 分为三份 X_i[1,2]，对应目标 T_i 一起分配；W 完整复制。&quot;},{&quot;n&quot;:2,&quot;operation&quot;:&quot;本地 FWD&quot;,&quot;detail&quot;:&quot;每端独立计算 Y_i=X_i W 与局部 loss。&quot;},{&quot;n&quot;:3,&quot;operation&quot;:&quot;本地 BWD&quot;,&quot;detail&quot;:&quot;各自计算完整 2×2 梯度 G_i=X_i.T@(Y_i−T_i)。&quot;},{&quot;n&quot;:4,&quot;operation&quot;:&quot;All-Reduce SUM / 3&quot;,&quot;detail&quot;:&quot;三个梯度逐元素求和并平均，逻辑集合操作不是中心服务器。&quot;},{&quot;n&quot;:5,&quot;operation&quot;:&quot;平均梯度在每端就绪&quot;,&quot;detail&quot;:&quot;每端获得同一完整 G_mean；返回的是梯度而非更新后的权重。&quot;},{&quot;n&quot;:6,&quot;operation&quot;:&quot;本地 SGD 更新&quot;,&quot;detail&quot;:&quot;每端执行 W_next=W−0.1×G_mean，用于下一轮前向。&quot;}],&quot;boundaries&quot;:[&quot;这是通用同步 DP/DDP 训练的算法算例，不是 vLLM 推理路径；无 bias、动量、weight decay、梯度累积或自定义通信 hook。&quot;,&quot;每 rank 恰好一个样本，world_size 固定为 3，因此 rank 梯度平均等于本例全批次平均 loss 的梯度。&quot;,&quot;W 按 [input_feature, output_feature] 存储，Y=XW；常见 torch.nn.Linear.weight 使用转置的 [output_feature, input_feature] 布局。&quot;,&quot;All-Reduce 逻辑节点表示所有 rank 共同参与的 collective，不表示中心服务器、参数服务器或专属 GPU。&quot;,&quot;图中若沿用 push / pull，push 仅表示贡献本地梯度，pull 仅表示归约结果在各 rank 就绪；它们不是 DDP 的实际 push/pull API。&quot;,&quot;默认 DDP 在 backward 中同步并平均梯度；各 rank 的 optimizer 使用相同梯度本地更新。真实实现可按 bucket 将通信与 backward 重叠，本图只展开一个 W 的语义依赖。&quot;,&quot;这里 loss_mean 仅用于验算；演示梯度 All-Reduce 不等于自动同步或平均用户记录的 loss。&quot;,&quot;数值由独立纯 Python 脚本重算验证；未运行三 GPU 分布式训练。&quot;],&quot;sources&quot;:[{&quot;title&quot;:&quot;PyTorch DistributedDataParallel API&quot;,&quot;url&quot;:&quot;https://docs.pytorch.org/docs/2.15/generated/torch.nn.parallel.DistributedDataParallel.html&quot;,&quot;supports&quot;:&quot;跨副本同步梯度；各 rank 本地 optimizer 更新；参数不会在每一步广播。&quot;},{&quot;title&quot;:&quot;PyTorch DDP design note&quot;,&quot;url&quot;:&quot;https://docs.pytorch.org/docs/2.15/notes/ddp.html&quot;,&quot;supports&quot;:&quot;backward 中梯度 bucket allreduce 求平均，完成后各副本使用相同梯度。该设计说明注明实现细节基于 v1.4，本例只采用稳定算法语义。&quot;}],&quot;source_checked_date&quot;:&quot;2026-11-03&quot;}&lt;/script&gt;
&lt;script type=&quot;application/json&quot; id=&quot;pf-combination-data&quot;&gt;{&quot;tpsp&quot;:{&quot;title&quot;:&quot;SP: token shard → All-Gather → real TP causal attention → Reduce-Scatter&quot;,&quot;scope&quot;:&quot;A minimal two-head attention + output projection, not a complete DeepSeek layer. Norm, residual and MLP are omitted. X has four tokens, two hidden columns; each attention head has dimension one. Q=K=V=X by identity projection; causal attention; scale=1/sqrt(1)=1. Wo rows belong to the corresponding head/rank.&quot;,&quot;shapes&quot;:{&quot;X&quot;:&quot;[tokens=4, hidden=2]&quot;,&quot;initial_X_per_rank&quot;:&quot;[2,2]&quot;,&quot;X_after_AG_per_rank&quot;:&quot;[4,2]&quot;,&quot;head_Q_K_V_per_rank&quot;:&quot;[4,1]&quot;,&quot;attention_head_output_per_rank&quot;:&quot;[4,1]&quot;,&quot;Wo_row_per_rank&quot;:&quot;[1,2]&quot;,&quot;partial_output_per_rank&quot;:&quot;[4,2]&quot;,&quot;RS_output_per_rank&quot;:&quot;[2,2]&quot;},&quot;steps&quot;:[{&quot;n&quot;:1,&quot;operation&quot;:&quot;Token sharding&quot;,&quot;description&quot;:&quot;rank0 owns tokens 0,1; rank1 owns tokens 2,3. Each token row retains both hidden columns.&quot;},{&quot;n&quot;:2,&quot;operation&quot;:&quot;All-Gather along token axis&quot;,&quot;description&quot;:&quot;Both ranks receive the full X, [4,2]. This is concatenation, not SUM.&quot;},{&quot;n&quot;:3,&quot;operation&quot;:&quot;Local head projection and causal attention&quot;,&quot;description&quot;:&quot;rank0 computes Q/K/V from column 0 and head0; rank1 uses column 1 and head1. Each head attends to tokens at or before the query token; masked score entries are null and masked probabilities are zero.&quot;},{&quot;n&quot;:4,&quot;operation&quot;:&quot;Local output-projection contribution&quot;,&quot;description&quot;:&quot;A_r = head_output_r @ Wo_row_r. Both A0 and A1 are [4,2] partial sums computed from real attention; they are not fabricated attention outputs.&quot;},{&quot;n&quot;:5,&quot;operati e&quot;:&quot;vllm/distributed/parallel_state.py&quot;,&quot;lines&quot;:[2291,2301],&quot;role&quot;:&quot;MoE EP group covers DP×PCP×TP at a fixed PP stage&quot;},{&quot;file&quot;:&quot;vllm/v1/engine/core.py&quot;,&quot;lines&quot;:[2344,2348],&quot;role&quot;:&quot;idle DP may run dummy batches while peers remain active&quot;},{&quot;file&quot;:&quot;vllm/v1/worker/dp_utils.py&quot;,&quot;lines&quot;:[198,218],&quot;role&quot;:&quot;DP token-count and execution coordination&quot;},{&quot;file&quot;:&quot;vllm/model_executor/layers/fused_moe/config.py&quot;,&quot;lines&quot;:[1170,1176],&quot;role&quot;:&quot;explicit TP1 DP2 EP=True example uses two engines/devices&quot;},{&quot;file&quot;:&quot;vllm/model_executor/layers/fused_moe/config.py&quot;,&quot;lines&quot;:[1219,1230],&quot;role&quot;:&quot;EP ownership of complete experts; MoE tp_size becomes 1&quot;},{&quot;file&quot;:&quot;vllm/model_executor/layers/fused_moe/expert_map_manager.py&quot;,&quot;lines&quot;:[75,78],&quot;role&quot;:&quot;linear placement partitions E0/E1 and E2/E3&quot;}]}},&quot;dptpp&quot;:{&quot;schema_version&quot;:1,&quot;title&quot;:&quot;DP2 + TP2 + PP2: two independent dense inference batches on 8 GPUs&quot;,&quot;config&quot;:{&quot;dp_size&quot;:2,&quot;tp_size&quot;:2,&quot;pp_size&quot;:2,&quot;physical_gpu_count&quot;:8,&quot;world_size_per_dp&quot;:4,&quot;sequence_parallel&quot;:false},&quot;matrix_convention&quot;:&quot;X and hidden=[tokens,features]; W1/W2=[input_feature,output_feature]; stage=ReLU(X@W1)@W2; no bias; no activation after W2.&quot;,&quot;DPinputs&quot;:[{&quot;dp_rank&quot;:0,&quot;request&quot;:&quot;A&quot;,&quot;X&quot;:[[2,1],[-1,1]]},{&quot;dp_rank&quot;:1,&quot;request&quot;:&quot;B&quot;,&quot;X&quot;:[[2,-1]]}],&quot;stages&quot;:[{&quot;pp_stage&quot;:0,&quot;W1&quot;:[[1,-1,2,1],[2,1,-1,-1]],&quot;W2&quot;:[[1,0],[0,1],[-1,2],[1,1]]},{&quot;pp_stage&quot;:1,&quot;W1&quot;:[[1,0,1,-1],[0,1,-1,1]],&quot;W2&quot;:[[1,1],[1,-1],[2,0],[0,2]]}],&quot 0]],&quot;Y&quot;:[[-2,13]],&quot;physical_gpu&quot;:4,&quot;world_local_rank&quot;:0},{&quot;dp_rank&quot;:1,&quot;pp_stage&quot;:0,&quot;tp_rank&quot;:1,&quot;request&quot;:&quot;B&quot;,&quot;intermediate_features&quot;:[2,3],&quot;X&quot;:[[2,-1]],&quot;W1Shard&quot;:[[2,1],[-1,-1]],&quot;W2Shard&quot;:[[-1,2],[1,1]],&quot;Z&quot;:[[5,3]],&quot;H&quot;:[[5,3]],&quot;partialY&quot;:[[-2,13]],&quot;Y&quot;:[[-2,13]],&quot;physical_gpu&quot;:5,&quot;world_local_rank&quot;:1},{&quot;dp_rank&quot;:1,&quot;pp_stage&quot;:1,&quot;tp_rank&quot;:0,&quot;request&quot;:&quot;B&quot;,&quot;intermediate_features&quot;:[0,1],&quot;X&quot;:[[-2,13]],&quot;W1Shard&quot;:[[1,0],[0,1]],&quot;W2Shard&quot;:[[1,1],[1,-1]],&quot;Z&quot;:[[-2,13]],&quot;H&quot;:[[0,13]],&quot;partialY&quot;:[[13,-13]],&quot;Y&quot;:[[13,17]],&quot;physical_gpu&quot;:6,&quot;world_local_rank&quot;:2},{&quot;dp_rank&quot;:1,&quot;pp_stage&quot;:1,&quot;tp_rank&quot;:1,&quot;request&quot;:&quot;B&quot;,&quot;intermediate_features&quot;:[2,3],&quot;X&quot;:[[-2,13]],&quot;W1Shard&quot;:[[1,-1],[-1,1]],&quot;W2Shard&quot;:[[2,0],[0,2]],&quot;Z&quot;:[[-15,15]],&quot;H&quot;:[[0,15]],&quot;partialY&quot;:[[0,30]],&quot;Y&quot;:[[13,17]],&quot;physical_gpu&quot;:7,&quot;world_local_rank&quot;:3}],&quot;stage_results&quot;:[{&quot;dp_rank&quot;:0,&quot;pp_stage&quot;:0,&quot;request&quot;:&quot;A&quot;,&quot;X&quot;:[[2,1],[-1,1]],&quot;Z&quot;:[[4,-1,3,1],[1,2,-3,-2]],&quot;H&quot;:[[4,0,3,1],[1,2,0,0]],&quot;Y&quot;:[[2,7],[1,2]]},{&quot;dp_rank&quot;:0,&quot;pp_stage&quot;:1,&quot;request&quot;:&quot;A&quot;,&quot;X&quot;:[[2,7],[1,2]],&quot;Z&quot;:[[2,7,-5,5],[1,2,-1,1]],&quot;H&quot;:[[2,7,0,5],[1,2,0,1]],&quot;Y&quot;:[[9,5],[3,1]]},{&quot;dp_rank&quot;:1,&quot;pp_stage&quot;:0,&quot;request&quot;:&quot;B&quot;,&quot;X&quot;:[[2,-1]],&quot;Z&quot;:[[0,-3,5,3]],&quot;H&quot;:[[0,0,5,3]],&quot;Y&quot;:[[-2,13]]},{&quot;dp_rank&quot;:1,&quot;pp_stage&quot;:1,&quot;request&quot;:&quot;B&quot;,&quot;X&quot;:[[-2,13]],&quot;Z&quot;:[[-2,13,-15,15]],&quot;H&quot;:[[0,13,0,15]],&quot;Y&quot;:[[13,17]]}],&quot;pp_transfers&quot;:[{&quot;dp_rank&quot;:0,&quot;request&quot;:&quot;A&quot;,&quot;from_pp_stage&quot;:0,&quot;to_pp_stage&quot;:1,&quot;tensor_name&quot;:&quot;hidden_states (teaching tensor)&quot;,&quot;source_replicated_on_tp&quot;:true,&quot;original_shape&quot;:[2,2],&quot;numel&quot;:4,&quot;numel_divisible_by_tp&quot;:true,&quot;full_hidden_before_send&quot;:[[2,7],[1,2]],&quot;rank_transfers&quot;:[{&quot;tp_rank&quot;:0,&quot;send_flat_chunk&quot;:[2,7],&quot;receive_flat_chunk&quot;:[2,7],&quot;source_physical_gpu&quot;:0,&quot;destination_physical_gpu&quot;:2,&quot;source_world_local_rank&quot;:0,&quot;destination_world_local_rank&quot;:2},{&quot;tp_rank&quot;:1,&quot;send_flat_chunk&quot;:[1,2],&quot;receive_flat_chunk&quot;:[1,2],&quot;source_physical_gpu&quot;:1,&quot;destination_physical_gpu&quot;:3,&quot;source_world_local_rank&quot;:1,&quot;destination_world_local_rank&quot;:3}],&quot;destination_tp_all_gather_chunks&quot;:[[2,7],[1,2]],&quot;reconstructed_hidden_per_destination_tp_rank&quot;:[[[2,7],[1,2]],[[2,7],[1,2]]]},{&quot;dp_rank&quot;:1,&quot;request&quot;:&quot;B&quot;,&quot;from_pp_stage&quot;:0,&quot;to_pp_stage&quot;:1,&quot;tensor_name&quot;:&quot;hidden_states (teaching tensor)&quot;,&quot;source_replicated_on_tp&quot;:true,&quot;original_shape&quot;:[1,2],&quot;numel&quot;:2,&quot;numel_divisible_by_tp&quot;:true,&quot;full_hidden_before_send&quot;:[[-2,13]],&quot;rank_transfers&quot;:[{&quot;tp_rank&quot;:0,&quot;send_flat_chunk&quot;:[-2],&quot;receive_flat_chunk&quot;:[-2],&quot;source_physical_gpu&quot;:4,&quot;destination_physical_gpu&quot;:6,&quot;source_world_local_rank&quot;:0,&quot;destination_world_local_rank&quot;:2},{&quot;tp_rank&quot;:1,&quot;send_flat_chunk&quot;:[13],&quot;receive_flat_chunk&quot;:[13],&quot;source_physical_gpu&quot;:5,&quot;destination_physical_gpu&quot;:7,&quot;source_world_local_rank&quot;:1,&quot;destination_world_local_rank&quot;:3}],&quot;destination_tp_all_gather_chunks&quot;:[[-2],[13]],&quot;reconstructed_hidden_per_destination_tp_rank&quot;:[[[-2,13]],[[-2,13]]]}],&quot;reference&quot;:{&quot;A&quot;:{&quot;stage0_hidden&quot;:[[2,7],[1,2]],&quot;stage1_hidden&quot;:[[9,5],[3,1]],&quot;final_hidden&quot;:[[9,5],[3,1]]},&quot;B&quot;:{&quot;stage0_hidden&quot;:[[-2,13]],&quot;stage1_hidden&quot;:[[13,17]],&quot;final_hidden&quot;:[[13,17]]}},&quot;groups&quot;:{&quot;TP_physical_gpu_sets&quot;:[[0,1],[2,3],[4,5],[6,7]],&quot;PP_physical_gpu_sets&quot;:[[0,2],[1,3],[4,6],[5,7]],&quot;per_dp_local_world&quot;:{&quot;world_size&quot;:4,&quot;TP&quot;:[[0,1],[2,3]],&quot;PP&quot;:[[0,2],[1,3]]},&quot;note&quot;:&quot;Dense DP0 and DP1 each use an independent 4-rank distributed world. Physical GPU numbers 0..7 are teaching labels, not one shared 8-rank torch world. No cross-replica dense DP communicator is asserted here.&quot;},&quot;rank_mapping&quot;:&quot;world_local_rank=pp_stage*2+tp_rank inside each independent DP world; physical_gpu=dp_rank*4+world_local_rank is only the teaching physical-device label.&quot;,&quot;steps&quot;:[{&quot;n&quot;:1,&quot;operation&quot;:&quot;DP request routing&quot;,&quot;detail&quot;:&quot;A goes to DP0 (GPUs0..3), B goes to DP1 (GPUs4..7). Each replica has the same complete two-stage model collectively; no dense hidden aggregation across DP replicas.&quot;},{&quot;n&quot;:2,&quot;operation&quot;:&quot;PP stage0 TP MLP&quot;,&quot;detail&quot;:&quot;Both TP ranks have the same stage input. W1 output features and matching W2 input rows are split 0,1 versus 2,3. Compute local Z, ReLU H, and partialY.&quot;},{&quot;n&quot;:3,&quot;operation&quot;:&quot;Stage0 TP All-Reduce SUM&quot;,&quot;detail&quot;:&quot;The two partialY matrices sum to full Y on both source TP ranks. A gives [[2,7],[1,2]]; B gives [[-2,13]].&quot;},{&quot;n&quot;:4,&quot;operation&quot;:&quot;PP send/receive flattened TP slices&quot;,&quot;detail&quot;:&quot;With all_gather_group=TP and numel divisible by TPsize, each source TP rank sends its contiguous half of flattened replicated Y along its PP group. This is not always a token-axis partition.&quot;},{&quot;n&quot;:5,&quot;operation&quot;:&quot;Destination TP All-Gather and reshape&quot;,&quot;detail&quot;:&quot;Each destination TP rank receives its corresponding flattened slice, then the destination TP group all-gathers slices in TP-rank order and restores the original tensor shape.&quot;},{&quot;n&quot;:6,&quot;operation&quot;:&quot;PP stage1 TP MLP&quot;,&quot;detail&quot;:&quot;Use reconstructed Y as stage1 input; split stage1 W1/W2 in the same feature convention, compute local partialY.&quot;},{&quot;n&quot;:7,&quot;operation&quot;:&quot;Stage1 TP All-Reduce SUM&quot;,&quot;detail&quot;:&quot;Each destination TP rank gets its replica final hidden. A=[[9,5],[3,1]]; B=[[13,17]].&quot;},{&quot;n&quot;:8,&quot;operation&quot;:&quot;End of teaching example&quot;,&quot;detail&quot;:&quot;Return final hidden independently for each DP request. No invented logits, sampling, cross-DP hidden merge, or training gradient All-Reduce.&quot;}],&quot;boundaries&quot;:[&quot;The matrices define a teaching dense two-stage MLP, not a real model layer. Source references support communication boundaries, not the teaching model dimensions.&quot;,&quot;TP shards weights/features within each stage; PP partitions the sequential stages; DP replicates this entire TPxPP topology for separate requests.&quot;,&quot;PP payloads show only one replicated dense hidden tensor. Real models may pass additional tensors such as residual, and actual structured metadata is omitted.&quot;,&quot;The flattened slice optimization shown requires numel divisible by TP size and a replicated source tensor. No SP is enabled; do not generalize it to token-sharded source tensors.&quot;,&quot;Request A has [2,2] hidden, so each PP slice happens to be one row. Request B has [1,2] hidden, so each PP slice is one scalar. Both reconstruct the full hidden before stage1 consumes it.&quot;,&quot;PP send submits communication; receiver must wait for receive and subsequent All-Gather completion before consuming the tensor. Diagram order expresses dependencies, not guaranteed global serialization.&quot;,&quot;Dense DP replicas each initialize an independent 4-rank TPxPP world in this source path. There are 8 physical GPUs total, but physical GPU4 has local distributed rank0 in DP1, not rank4 in one 8-rank world. Same (PP,TP) coordinates across replicas do not imply an actual dense DP communication group.&quot;],&quot;sources&quot;:[{&quot;path&quot;:&quot;vllm/v1/worker/gpu_worker.py&quot;,&quot;line&quot;:1281,&quot;url&quot;:&quot;https://github.com/vllm-project/vllm/blob/295c062db8/vllm/v1/worker/gpu_worker.py#L1281&quot;,&quot;meaning&quot;:&quot;receive PP tensors with TP all_gather_group&quot;},{&quot;path&quot;:&quot;vllm/v1/worker/gpu_worker.py&quot;,&quot;line&quot;:1317,&quot;url&quot;:&quot;https://github.com/vllm-project/vllm/blob/295c062db8/vllm/v1/worker/gpu_worker.py#L1317&quot;,&quot;meaning&quot;:&quot;send PP tensors with TP all_gather_group&quot;},{&quot;path&quot;:&quot;vllm/distributed/parallel_state.py&quot;,&quot;line&quot;:1221,&quot;url&quot;:&quot;https://github.com/vllm-project/vllm/blob/295c062db8/vllm/distributed/parallel_state.py#L1221&quot;,&quot;meaning&quot;:&quot;flatten into TP chunks and send own TP rank chunk&quot;},{&quot;path&quot;:&quot;vllm/distributed/parallel_state.py&quot;,&quot;line&quot;:1352,&quot;url&quot;:&quot;https://github.com/vllm-project/vllm/blob/295c062db8/vllm/distributed/parallel_state.py#L1352&quot;,&quot;meaning&quot;:&quot;receiver TP All-Gather and reshape to original shape&quot;},{&quot;path&quot;:&quot;vllm/v1/engine/core.py&quot;,&quot;line&quot;:1463,&quot;url&quot;:&quot;https://github.com/vllm-project/vllm/blob/295c062db8/vllm/v1/engine/core.py#L1463&quot;,&quot;meaning&quot;:&quot;dense model parallel configuration adjusts internal DP to independent worlds&quot;},{&quot;path&quot;:&quot;vllm/config/parallel.py&quot;,&quot;line&quot;:1157,&quot;url&quot;:&quot;https://github.com/vllm-project/vllm/blob/295c062db8/vllm/config/parallel.py#L1157&quot;,&quot;meaning&quot;:&quot;dense DP replica reset of internal DP size/rank&quot;}]}}&lt;/script&gt;

(() =&gt; {
  const root=document.getElementById(&#x27;parallelism-flows&#x27;);
  const $=s=&gt;root.querySelector(s);
  const examples=JSON.parse(document.getElementById(&#x27;pf-example-data&#x27;).textContent);
  const {tpdp,eppp,spcp}=examples;
  const base=&#x27;https://github.com/vllm-project/vllm/blob/295c062db8a48ea73bbd05d1174cb37d24bf86f9/&#x27;;
  const transpose=a=&gt;a[0].map((_,c)=&gt;a.map(r=&gt;r[c]));

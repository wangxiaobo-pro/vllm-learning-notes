&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

    &lt;p class=&quot;text-small&quot; data-numeric=&quot;status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
    &lt;div class=&quot;numeric-flow&quot; data-numeric=&quot;flow&quot;&gt;&lt;/div&gt;
    &lt;p class=&quot;text-small&quot;&gt;Hpre / Hpost 的门控与 F 权重均是本页明确选定的教学参数，数值由 JavaScript 计算。HC 分支只比较无双随机约束的混合效果，不声称复现某个 HC checkpoint。mHC 的 Hres 由 20 轮行列归一化得到；教学 ε=0、γ=1，显示 4 位小数，后续使用未舍入值。&lt;/p&gt;
    &lt;p class=&quot;numeric-sources&quot;&gt;系数来源依据：&lt;a href=&quot;https://github.com/vllm-project/vllm/blob/295c062db8a48ea73bbd05d1174cb37d24bf86f9/vllm/model_executor/kernels/mhc/torch.py#L103-L127&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;当前 H → 归一化投影 → pre/post/Sinkhorn&lt;/a&gt;；&lt;a href=&quot;https://github.com/vllm-project/vllm/blob/295c062db8a48ea73bbd05d1174cb37d24bf86f9/vllm/model_executor/kernels/mhc/torch.py#L135-L147&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;按输入流 i、输出流 j 混合并写回&lt;/a&gt;。此处是同子层生成并消费 Hpre 的常规/V4 示意；&lt;a href=&quot;../model-architecture/index.html#deepseek_v41/mhc&quot;&gt;V4.1 delayed-pre&lt;/a&gt; 消费上一子层传来的 pre，需按其专属图阅读。&lt;/p&gt;
  &lt;/section&gt;
  &lt;div class=&quot;panels&quot;&gt;
    &lt;section class=&quot;panel&quot; data-model=&quot;resnet&quot;&gt;
      &lt;div class=&quot;panel-head&quot;&gt;&lt;h3&gt;普通残差 Decoder&lt;/h3&gt;&lt;span class=&quot;text-small&quot;&gt;单流 · Attention / FFN 各一次相加&lt;/span&gt;&lt;/div&gt;
      &lt;svg class=&quot;scene&quot; role=&quot;img&quot; aria-label=&quot;三个 Pre-Norm Decoder 层，每层的 Attention 和 FFN 前分别归一化，输出分别与各自输入相加。&quot;&gt;&lt;/svg&gt;
    &lt;/section&gt;
    &lt;section class=&quot;panel&quot; data-model=&quot;hc&quot;&gt;
      &lt;div class=&quot;panel-head&quot;&gt;&lt;h3&gt;HC&lt;/h3&gt;&lt;span class=&quot;text-small&quot;&gt;双流 · 残差混合无双随机约束&lt;/span&gt;&lt;/div&gt;
      &lt;svg class=&quot;scene&quot; role=&quot;img&quot; aria-label=&quot;HC 三个 Decoder 层。Attention 和 FFN 各自执行聚合、归一化、计算和写回，并与混合后的双流残差相加。&quot;&gt;&lt;/svg&gt;
    &lt;/section&gt;
    &lt;section class=&quot;panel&quot; data-model=&quot;mhc&quot;&gt;
      &lt;div class=&quot;panel-head&quot;&gt;&lt;h3&gt;mHC&lt;/h3&gt;&lt;span class=&quot;text-small&quot;&gt;双流 · 残差混合受双随机约束&lt;/span&gt;&lt;/div&gt;
      &lt;svg class=&quot;scene&quot; role=&quot;img&quot; aria-label=&quot;mHC 三个 Decoder 层，与 HC 的计算位置相同，每个子层的残差混合矩阵非负且行列和为一。初始两条流由同一 embedding 复制得到。&quot;&gt;&lt;/svg&gt;
    &lt;/section&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;residual-comparison&#x27;);
  const numeric=key=&gt;root.querySelector(&#x27;[data-numeric=&quot;&#x27;+key+&#x27;&quot;]&#x27;);
  let numericStep=-1,numericSteps=[];
  const numericFormat=value=&gt;Number(value.toFixed(4)).toString();
  const numericVector=values=&gt;&#x27;[&#x27;+values.map(numericFormat).join(&#x27;, &#x27;)+&#x27;]&#x27;;
  const numericMatrix=values=&gt;&#x27;[&#x27;+values.map(numericVector).join(&#x27;, &#x27;)+&#x27;]&#x27;;
  const rms=values=&gt;Math.sqrt(values.reduce((sum,value)=&gt;sum+value*value,0)/values.length);
  const sigmoid=value=&gt;1/(1+Math.exp(-value));
  function calculateNumeric(){
    const H=Number(numeric(&#x27;input&#x27;).value)===0?[[2,0],[0,2]]:[[1,3],[2,0]],flat=H.flat(),z=flat.map(value=&gt;value/rms(flat));
    const preLogits=[.2*(z[0]-z[3]),.1*(z[1]-z[2])],postLogits=[.1*z[0],-.1*z[3]],pre=preLogits.map(sigmoid),post=postLogits.map(value=&gt;2*sigmoid(value));
    const a=.4*z[0],b=.4*z[3],logits=[[a,0],[0,b]],mhc=numeric(&#x27;mode&#x27;).value===&#x27;mhc&#x27;;
    let mix=mhc?logits.map(row=&gt;row.map(Math.exp)):[[1.2+.1*a,-.1],[.3,.9+.1*b]];
    if(mhc)for(let iteration=0;iteration&lt;20;iteration++){
      mix=mix.map(row=&gt;{const sum=row[0]+row[1];return row.map(value=&gt;value/sum);});
      const sums=[mix[0][0]+mix[1][0],mix[0][1]+mix[1][1]];mix=mix.map(row=&gt;row.map((value,j)=&gt;value/sums[j]));
    }
    const u=[0,1].map(d=&gt;pre.reduce((sum,value,i)=&gt;sum+value*H[i][d],0)),normalized=u.map(value=&gt;value/rms(u));
    const y=[normalized[0]+2*normalized[1],normalized[0]-normalized[1]];
    const residual=[0,1].map(j=&gt;[0,1].map(d=&gt;H.reduce((sum,row,i)=&gt;sum+mix[i][j]*row[d],0)));
    const write=post.map(value=&gt;y.map(channel=&gt;value*channel)),next=residual.map((row,j)=&gt;row.map((value,d)=&gt;value+write[j][d]));
    const rows=mix.map(row=&gt;row[0]+row[1]),columns=[0,1].map(j=&gt;mix[0][j]+mix[1][j]);
    numericSteps=[
      {title:&#x27;① 读取当前 residual 与参数&#x27;,value:&#x27;H = &#x27;+numericMatrix(H)+&#x27;；形状 [streams=2, hidden=2]\n固定门控投影见下一步；子层 W_F = [[1,1],[2,−1]]&#x27;,note:&#x27;H 来自上一子层；参数来自模型加载。本例是中间状态，不是初始化复制。&#x27;,edge:&#x27;当前 H + 已加载参数 → 系数生成&#x27;},
      {title:&#x27;② 从当前 H 生成三组系数&#x27;,value:&#x27;z = flatten(H) / RMS(flatten(H)) = &#x27;+numericVector(z)+&#x27;\npre_logits = [0.2(z₀−z₃), 0.1(z₁−z₂)] = &#x27;+numericVector(preLogits)+&#x27;\nHpre = sigmoid(pre_logits) = &#x27;+numericVector(pre)+&#x27;\npost_logits = [0.1z₀, −0.1z₃] = &#x27;+numericVector(postLogits)+&#x27;\nHpost = 2 sigmoid(post_logits) = &#x27;+numericVector(post)+&#x27;\n&#x27;+(mhc?&#x27;Hres = Sinkhorn(exp([[0.4z₀,0],[0,0.4z₃]]))&#x27;:&#x27;Hres = [[1.2+0.04z₀,−0.1],[0.3,0.9+0.04z₃]]&#x27;)+&#x27; = &#x27;+numericMatrix(mix)+&#x27;\nHres 行和 &#x27;+numericVector(rows)+&#x27;；列和 &#x27;+numericVector(columns),note:&#x27;三组系数是当前 H 的函数；Hpre/Hpost 不要求行列和为 1。&#x27;+(mhc?&#x27;这里仅 Hres 施加双随机约束。&#x27;:&#x27;当前 Hres 没有双随机约束，可含负项。&#x27;),edge:&#x27;Hpre + 原 H → 聚合；Hres/Hpost 留给写回&#x27;},
      {title:&#x27;③ 聚合两路并归一化&#x27;,value:&#x27;u = Hpre₁ x¹ + Hpre₂ x² = &#x27;+numericVector(u)+&#x27;\nRMSNorm(u) = u / RMS(u) = &#x27;+numericVector(normalized),note:&#x27;聚合成一个 hidden 向量；原 H 仍沿残差旁路保留。&#x27;,edge:&#x27;单路 normalized u → 同一个子层 F&#x27;},
      {title:&#x27;④ 只执行一次 F&#x27;,value:&#x27;y = normalized(u) × W_F\ny = [n₀ + 2n₁, n₀ − n₁] = &#x27;+numericVector(y),note:&#x27;为方便手算，用固定线性 F 代替 Attention/FFN 内部计算；两条 residual 不代表执行两次 F。&#x27;,edge:&#x27;单路输出 y + Hpost → 两路写入量&#x27;},
      {title:&#x27;⑤ 分别计算 residual 混合与写入量&#x27;,value:&#x27;Rⱼ = Σᵢ Hres[i,j] × xⁱ；R = &#x27;+numericMatrix(residual)+&#x27;\nBⱼ = Hpostⱼ × y；B = &#x27;+numericMatrix(write),note:&#x27;行 i 是输入流，列 j 是输出流。Hres 混合旧 residual；Hpost 把同一个 y 按系数写到两路。&#x27;,edge:&#x27;R 与 B 的同位置同通道 → 相加&#x27;},
      {title:&#x27;⑥ 相加并交给下一子层&#x27;,value:&#x27;Hnew = R + B = &#x27;+numericMatrix(next),note:&#x27;下一 Attention/FFN 子层读取这两路新 residual，用自己的独立参数重新生成系数。&#x27;,edge:&#x27;&#x27;}
    ];
    numeric(&#x27;flow&#x27;).replaceChildren();
    numericSteps.forEach((step,i)=&gt;{const article=document.createElement(&#x27;div&#x27;);article.className=&#x27;numeric-step&#x27;;article.dataset.numericStep=i;const title=document.createElement(&#x27;strong&#x27;),values=document.createElement(&#x27;code&#x27;),note=document.createElement(&#x27;small&#x27;);title.textContent=step.title;values.textContent=step.value;note.textContent=step.note;article.append(title,values,note);numeric(&#x27;flow&#x27;).append(article);if(step.edge){const arrow=document.createElement(&#x27;p&#x27;);arrow.className=&#x27;numeric-arrow&#x27;;arrow.textContent=&#x27;↓ &#x27;+step.edge;numeric(&#x27;flow&#x27;).append(arrow);}});
    root.numericExample={H,z,pre,post,mix,u,normalized,y,residual,write,next};
    updateNumeric();
  }
  function updateNumeric(){numeric(&#x27;status&#x27;).textContent=numericStep&lt;0?&#x27;全局关系 · 六步沿同一个 token 的两路 residual 计算&#x27;:numericSteps[numericStep].title;numeric(&#x27;prev&#x27;).disabled=numericStep&lt;0;numeric(&#x27;next&#x27;).disabled=numericStep===numericSteps.length-1;root.querySelectorAll(&#x27;[data-numeric-step]&#x27;).forEach(node=&gt;node.classList.toggle(&#x27;is-current&#x27;,Number(node.dataset.numericStep)===numericStep));}
  [&#x27;mode&#x27;,&#x27;input&#x27;].forEach(key=&gt;numeric(key).addEventListener(&#x27;change&#x27;,()=&gt;{numericStep=-1;calculateNumeric();}));
  numeric(&#x27;all&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{numericStep=-1;updateNumeric();});numeric(&#x27;prev&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{numericStep--;updateNumeric();});numeric(&#x27;next&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{numericStep++;updateNumeric();root.querySelector(&#x27;[data-numeric-step=&quot;&#x27;+numericStep+&#x27;&quot;]&#x27;).scrollIntoView({block:&#x27;nearest&#x27;});});
  calculateNumeric();
  const NS = &#x27;http://www.w3.org/2000/svg&#x27;;
  const validFocus = new Set([&#x27;all&#x27;,&#x27;conv&#x27;,&#x27;residual&#x27;,&#x27;add&#x27;]);
  const labels = {
    all:&#x27;全部路径 · 每层先 Attention 后 FFN，各自完成一次残差更新。&#x27;,
    conv:&#x27;计算分支 · 聚合后先 RMSNorm，再执行一次 Attention 或 FFN，最后写回。&#x27;,
    residual:&#x27;残差通路 · 普通 Decoder 直接传递；HC / mHC 在每个子层混合多条流。&#x27;,
    add:&#x27;相加位置 · Attention 后更新一次残差，FFN 后再更新一次残差。&#x27;
  };
  function setFocus(value, save) {
    const focus = validFocus.has(value) ? value : &#x27;all&#x27;;
    root.dataset.focus=focus;
    root.querySelectorAll(&#x27;button[data-focus]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;,String(button.dataset.focus===focus)));
    root.querySelector(&#x27;.status&#x27;).textContent=labels[focus];
    if(save &amp;&amp; window.openai?.setWidgetState) {
      window.openai.setWidgetState({modelContent:{comparison:&#x27;普通残差 Decoder / HC / mHC&#x27;,blocks:3,sublayersPerBlock:2,streams:2,focus},privateContent:null}).catch(()=&gt;{});
    }
  }
  root.querySelectorAll(&#x27;button[data-focus]&#x27;).forEach(button=&gt;button.addEventListener(&#x27;click&#x27;,()=&gt;setFocus(button.dataset.focus,true)));
  setFocus(window.openai?.widgetState?.modelContent?.focus || &#x27;residual&#x27;,false);
  window.addEventListener(&#x27;openai:set_globals&#x27;,event=&gt;{
    const state=event.detail?.globals?.widgetState;
    if(state) setFocus(state.modelContent?.focus,false);
  });
  function el(tag, attrs, parent) {
    const node=document.createElementNS(NS,tag);
    Object.entries(attrs||{}).forEach(([key,value])=&gt;node.setAttribute(key,String(value)));
    if(parent) parent.appendChild(node);
    return node;
  }
  function text(parent,x,y,value,small=false,anchor=&#x27;middle&#x27;,strong=false) {
    const node=el(&#x27;text&#x27;,{x,y,&#x27;text-anchor&#x27;:anchor,&#x27;dominant-baseline&#x27;:&#x27;middle&#x27;,class:(small?&#x27;small &#x27;:&#x27;&#x27;)+(strong?&#x27;strong&#x27;:&#x27;&#x27;)},parent);
    node.textContent=value;
    return node;
  }
  function group(svg,kind) { return el(&#x27;g&#x27;,{&#x27;data-kind&#x27;:kind},svg); }
  function draw(svg,kind) {
    const w=Math.round(svg.getBoundingClientRect().width);
    if(w&lt;200) return;
    const H=1950;
    svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${w} ${H}`);
    svg.setAttribute(&#x27;height&#x27;,H);
    svg.replaceChildren();
    const title=el(&#x27;title&#x27;,{},svg); title.textContent=`${kind===&#x27;resnet&#x27;?&#x27;普通残差 Decoder&#x27;:kind===&#x27;hc&#x27;?&#x27;HC&#x27;:&#x27;mHC&#x27;}：3 层 Decoder、6 个子层`;
    const desc=el(&#x27;desc&#x27;,{},svg); desc.textContent=&#x27;展示 decoder-only 模型的 Pre-Norm 结构。每层 Attention 和 FFN 分别进行残差更新。HC 和 mHC 在每个子层各自聚合、计算、写回，参数独立。x 是层输入输出，y 是 Attention 后的中间状态；上标是残差流编号。相交线仅在实心圆处连接。省略模型末尾的归一化、流聚合和输出头。&#x27;;
    const defs=el(&#x27;defs&#x27;,{},svg);
    [&#x27;conv&#x27;,&#x27;residual&#x27;,&#x27;add&#x27;,&#x27;neutral&#x27;].forEach((signal,index)=&gt;{
      const marker=el(&#x27;marker&#x27;,{id:`${kind}-${signal}-arrow`,viewBox:&#x27;0 0 10 10&#x27;,refX:8,refY:5,markerWidth:7,markerHeight:7,orient:&#x27;auto&#x27;,markerUnits:&#x27;userSpaceOnUse&#x27;},defs);
      el(&#x27;path&#x27;,{d:&#x27;M1 1L8 5L1 9&#x27;,fill:&#x27;none&#x27;,stroke:index&lt;3?`var(--viz-series-${index+1})`:&#x27;var(--muted-foreground)&#x27;,&#x27;stroke-width&#x27;:1.4,&#x27;stroke-linecap&#x27;:&#x27;round&#x27;,&#x27;stroke-linejoin&#x27;:&#x27;round&#x27;},marker);
    });
    function path(parent,d,signal,arrow=true,bridge=false) {
      if(bridge) el(&#x27;path&#x27;,{d,class:&#x27;crossing&#x27;},parent);
      return el(&#x27;path&#x27;,{d,class:&#x27;wire&#x27;,...(arrow?{&#x27;marker-end&#x27;:`url(#${kind}-${signal}-arrow)`}:{})},parent);
    }
    function box(parent,x,y,bw,bh,lines,small=false) {
      el(&#x27;rect&#x27;,{x,y,width:bw,height:bh,rx:5,class:&#x27;op&#x27;},parent);
      const gap=18;
      lines.forEach((line,index)=&gt;text(parent,x+bw/2,y+bh/2+(index-(lines.length-1)/2)*gap,line,small));
    }
    function state(x,y,label) {
      el(&#x27;rect&#x27;,{x:x-29,y:y-13,width:58,height:26,rx:5,class:&#x27;state&#x27;},svg);
      text(svg,x,y,label);
    }
    function plus(x,y,parent) {
      el(&#x27;circle&#x27;,{cx:x,cy:y,r:13,class:&#x27;plus&#x27;},parent);
      text(parent,x,y,&#x27;+&#x27;,false,&#x27;middle&#x27;,true);
    }
    const a=Math.round(w*.12), b=Math.round(w*.34), mid=Math.round((a+b)/2);
    const fl=Math.round(w*.55), fw=w-fl-8, fc=fl+fw/2;
    const mleft=8, mw=Math.round(w*.46)-8;
    const res=group(svg,&#x27;residual&#x27;);
    const conv=group(svg,&#x27;conv&#x27;);
    const add=group(svg,&#x27;add&#x27;);
    const neutr=group(svg,&#x27;neutral&#x27;);
    box(neutr,8,4,mw,28,[&#x27;Embedding&#x27;],true);
    if(kind===&#x27;resnet&#x27;) {
      path(res,`M${mid} 32 V87`,&#x27;residual&#x27;);
      text(svg,fl,52,&#x27;输入 x₀&#x27;,true,&#x27;start&#x27;);
    } else {
      path(res,`M${mid} 32 V53 H${a} V87`,&#x27;residual&#x27;);
      path(res,`M${mid} 53 H${b} V87`,&#x27;residual&#x27;);
      el(&#x27;circle&#x27;,{cx:mid,cy:53,r:3,class:&#x27;junction&#x27;},res);
      text(svg,fl,46,&#x27;复制同一输入&#x27;,true,&#x27;start&#x27;);
      text(svg,fl,66,&#x27;两条流初值相同&#x27;,true,&#x27;start&#x27;);
    }
    for(let block=0;block&lt;6;block++) {
      const y=100+block*300;
      const layer=Math.floor(block/2)+1;
      const attention=block%2===0;
      text(svg,fl,y,attention?`Decoder ${layer}`:&#x27;FFN 子层&#x27;,false,&#x27;start&#x27;,true);
      if(attention) el(&#x27;path&#x27;,{d:`M${w-3} ${y+18} V${y+575}`,class:&#x27;structure&#x27;},svg);
      if(kind===&#x27;resnet&#x27;) {
        path(res,`M${mid} ${y+13} V${y+215}`,&#x27;residual&#x27;);
        text(res,mid+12,y+136,&#x27;恒等&#x27;,true,&#x27;start&#x27;);
        text(res,mid+12,y+154,&#x27;旁路&#x27;,true,&#x27;start&#x27;);
        path(conv,`M${mid} ${y+48} H${fc} V${y+86}`,&#x27;conv&#x27;,true,true);
        el(&#x27;circle&#x27;,{cx:mid,cy:y+48,r:3,class:&#x27;junction&#x27;},conv);
      } else {
        path(res,`M${a} ${y+13} V${y+84}`,&#x27;residual&#x27;);
        path(res,`M${b} ${y+13} V${y+84}`,&#x27;residual&#x27;);
        path(res,`M${a} ${y+180} V${y+241}`,&#x27;residual&#x27;);
        path(res,`M${b} ${y+180} V${y+215}`,&#x27;residual&#x27;);
        box(res,mleft,y+84,mw,96,[]);
        text(res,mleft+mw/2,y+99,&#x27;残差混合 Hres&#x27;,true,&#x27;middle&#x27;,true);
        const vals=kind===&#x27;mhc&#x27; ? [[&#x27;0.8&#x27;,&#x27;0.2&#x27;,&#x27;0.2&#x27;,&#x27;0.8&#x27;],[&#x27;0.6&#x27;,&#x27;0.4&#x27;,&#x27;0.4&#x27;,&#x27;0.6&#x27;],[&#x27;0.7&#x27;,&#x27;0.3&#x27;,&#x27;0.3&#x27;,&#x27;0.7&#x27;]][block%3] : [&#x27;a&#x27;,&#x27;b&#x27;,&#x27;c&#x27;,&#x27;d&#x27;];
        const matLeft=mleft+mw/2-41, matTop=y+111;
        el(&#x27;path&#x27;,{d:`M${matLeft+4} ${matTop} H${matLeft} V${matTop+44} H${matLeft+4} M${matLeft+78} ${matTop} H${matLeft+82} V${matTop+44} H${matLeft+78}`,class:&#x27;structure&#x27;},res);
        vals.forEach((value,index)=&gt;text(res,matLeft+20+(index%2)*42,matTop+11+Math.floor(index/2)*24,value,true));
        text(res,mleft+mw/2,y+168,kind===&#x27;mhc&#x27;?&#x27;非负 · 行列和为 1&#x27;:&#x27;无双随机约束&#x27;,true);
        path(conv,`M${a} ${y+23} H${fl+fw*.27} V${y+44}`,&#x27;conv&#x27;,true,true);

        typeof prompt !== "string" ||

  const srcdoc = frame.dataset.srcdoc;

  globalThis.addEventListener("resize", () => {

    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {

    channel.port1.postMessage({ type: "measure" });

  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );

  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );

    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;

        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&

    }

/* Web recipes are the default, including on renderers without inline style queries. */
@supports (border-radius: if(style(--corner-shape: round): 1px; else: 2px)) {

&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;

  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {

    }

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }

      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {

          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };

    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;

        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,

      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);

        new TypeError(&quot;Visualization state does not support image attachments&quot;),

      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );

      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},

      widgetState: state,
      statePersistence,

    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),

  };

    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }

        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

  &lt;div class=&quot;cb-key text-small&quot;&gt;&lt;span&gt;&lt;i class=&quot;cb-swatch&quot;&gt;&lt;/i&gt;P：处理提示词&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;cb-swatch decode&quot;&gt;&lt;/i&gt;D：处理上一个输出&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;cb-swatch waiting&quot;&gt;&lt;/i&gt;等：已到达，等待准入&lt;/span&gt;&lt;span&gt;✓ 本轮结束&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;cb-matrix tabular-nums&quot; role=&quot;table&quot; aria-label=&quot;四个请求在四轮中的输入和输出&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;cb-comparison&quot; hidden&gt;&lt;/div&gt;
  &lt;div class=&quot;cb-comparison-note text-small cb-sub&quot; hidden&gt;各侧 R2 前 C 到达、R3 前 D 到达。两侧轮次独立计数，列宽和播放节奏不代表真实耗时；连续侧完成后不再执行额外轮次。&lt;/div&gt;
  &lt;div class=&quot;cb-differences&quot; hidden&gt;
    &lt;table class=&quot;table table-sm text-small&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;比较&lt;/th&gt;&lt;th&gt;静态批处理&lt;/th&gt;&lt;th&gt;连续批处理&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
      &lt;tr&gt;&lt;td&gt;新请求加入&lt;/td&gt;&lt;td&gt;当前整批结束后&lt;/td&gt;&lt;td&gt;每轮边界，预算允许时&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;短请求结束&lt;/td&gt;&lt;td&gt;本批空位不补&lt;/td&gt;&lt;td&gt;释放资源，下轮可补入&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;本例完成轮数&lt;/td&gt;&lt;td&gt;6 轮&lt;/td&gt;&lt;td&gt;4 轮&lt;/td&gt;&lt;/tr&gt;
      &lt;tr&gt;&lt;td&gt;C / D 首输出&lt;/td&gt;&lt;td&gt;R4 / R4&lt;/td&gt;&lt;td&gt;R2 / R3&lt;/td&gt;&lt;/tr&gt;
    &lt;/tbody&gt;&lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;text-small cb-sub&quot;&gt;P / D 后的数字 = 本轮输入 token 数；箭头后 = 新采样 token。&lt;/div&gt;
  &lt;div class=&quot;cb-scope text-small cb-sub&quot;&gt;教学设定：最多 6 个输入 token / 轮、3 个请求；KV 充足。两侧均处理 18 个有效输入 token、生成 10 个 token。&lt;/div&gt;
  &lt;details&gt;
    &lt;summary&gt;实现依据与示例边界&lt;/summary&gt;
    &lt;div class=&quot;cb-source-list text-small&quot;&gt;
      &lt;a href=&quot;https://github.com/vllm-project/vllm/blob/v0.11.0/vllm/v1/engine/core.py#L250-L267&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;v0.11.0 · EngineCore.step&lt;/a&gt;
      &lt;a href=&quot;https://github.com/vllm-project/vllm/blob/v0.11.0/vllm/v1/core/sched/scheduler.py#L164-L201&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Scheduler.schedule&lt;/a&gt;
      &lt;a href=&quot;https://github.com/vllm-project/vllm/blob/v0.11.0/vllm/v1/core/sched/scheduler.py#L837-L893&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;结果更新与结束&lt;/a&gt;
      &lt;a href=&quot;https://docs.vllm.ai/en/v0.11.0/configuration/optimization.html#chunked-prefill&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Chunked prefill&lt;/a&gt;
    &lt;/div&gt;
    &lt;ul class=&quot;text-small cb-sub&quot;&gt;
      &lt;li&gt;静态侧为算法教学模型：AB 开批后锁定成员，不等满 3 个请求；整批结束后再开 CD。完成行释放 KV，空位不补。未统计 padding 或已结束行的无效计算。&lt;/li&gt;
      &lt;li&gt;静态侧也可逐 token 输出；准入规则与是否流式输出是两回事。这里不把静态批处理画成 vLLM V1 的实现分支。&lt;/li&gt;
      &lt;li&gt;到达时机按各侧轮次设置，用于解释调度机制，不是同一真实时间到达流的性能测试。4 轮对 6 轮不等于具体加速比。&lt;/li&gt;
      &lt;li&gt;V1 同步主路径；FCFS、普通文本生成、全注意力；无前缀复用、抢占、推测解码或流水线并行。&lt;/li&gt;
      &lt;li&gt;A / C 生成 3 个 token，B / D 生成 2 个 token 后停止；无提前 EOS。输入及输出均为教学符号。&lt;/li&gt;
      &lt;li&gt;开启 chunked prefill；本例提示词都能放入剩余预算，没有实际切块。P / D 是教学标签，V1 按待计算 token 统一调度。&lt;/li&gt;
      &lt;li&gt;KV 数表示已有 KV 的 token 数；实际显存按块分配。刚采样的 token 在下一轮作为输入时才写入自己的 KV。&lt;/li&gt;
      &lt;li&gt;图中的计划箭头传递调度元数据；GPU 使用本地 KV，没有在每轮传输整个 KV cache。名额与 KV 不足时，新请求仍需等待。&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/details&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root=document.getElementById(&#x27;cb-flow-v1&#x27;);
  const svg=root.querySelector(&#x27;.cb-diagram&#x27;);
  const matrix=root.querySelector(&#x27;.cb-matrix&#x27;);
  const status=root.querySelector(&#x27;.cb-status&#x27;);
  const detail=root.querySelector(&#x27;.cb-detail&#x27;);
  const stepList=root.querySelector(&#x27;.cb-steps&#x27;);
  const viewSelect=root.querySelector(&#x27;#cb-view&#x27;);
  const comparison=root.querySelector(&#x27;.cb-comparison&#x27;);
  const buttons=Object.fromEntries([...root.querySelectorAll(&#x27;[data-action]&#x27;)].map(b=&gt;[b.dataset.action,b]));
  const requests=[{id:&#x27;A&#x27;,prompt:4,goal:3,arrival:0},{id:&#x27;B&#x27;,prompt:2,goal:2,arrival:0},{id:&#x27;C&#x27;,prompt:4,goal:3,arrival:1},{id:&#x27;D&#x27;,prompt:2,goal:2,arrival:2}];
  const continuousRounds=[
    {arrivals:[&#x27;A&#x27;,&#x27;B&#x27;],before:[],after:[&#x27;A&#x27;,&#x27;B&#x27;],keepKV:6,priorKV:0,modelKV:6,items:[{id:&#x27;A&#x27;,type:&#x27;P&#x27;,n:4,out:&#x27;a₁&#x27;,input:&#x27;p₁…p₄&#x27;,done:false},{id:&#x27;B&#x27;,type:&#x27;P&#x27;,n:2,out:&#x27;b₁&#x27;,input:&#x27;p₁…p₂&#x27;,done:false}]},
    {arrivals:[&#x27;C&#x27;],before:[&#x27;A&#x27;,&#x27;B&#x27;],after:[&#x27;A&#x27;,&#x27;C&#x27;],keepKV:9,priorKV:6,modelKV:12,items:[{id:&#x27;A&#x27;,type:&#x27;D&#x27;,n:1,out:&#x27;a₂&#x27;,input:&#x27;a₁&#x27;,done:false},{id:&#x27;B&#x27;,type:&#x27;D&#x27;,n:1,out:&#x27;b₂&#x27;,input:&#x27;b₁&#x27;,done:true},{id:&#x27;C&#x27;,type:&#x27;P&#x27;,n:4,out:&#x27;c₁&#x27;,input:&#x27;p₁…p₄&#x27;,done:false}]},
    {arrivals:[&#x27;D&#x27;],before:[&#x27;A&#x27;,&#x27;C&#x27;],after:[&#x27;C&#x27;,&#x27;D&#x27;],keepKV:7,priorKV:9,modelKV:13,items:[{id:&#x27;A&#x27;,type:&#x27;D&#x27;,n:1,out:&#x27;a₃&#x27;,input:&#x27;a₂&#x27;,done:true},{id:&#x27;C&#x27;,type:&#x27;D&#x27;,n:1,out:&#x27;c₂&#x27;,input:&#x27;c₁&#x27;,done:false},{id:&#x27;D&#x27;,type:&#x27;P&#x27;,n:2,out:&#x27;d₁&#x27;,input:&#x27;p₁…p₂&#x27;,done:false}]},
    {arrivals:[],before:[&#x27;C&#x27;,&#x27;D&#x27;],after:[],keepKV:0,priorKV:7,modelKV:9,items:[{id:&#x27;C&#x27;,type:&#x27;D&#x27;,n:1,out:&#x27;c₃&#x27;,input:&#x27;c₂&#x27;,done:true},{id:&#x27;D&#x27;,type:&#x27;D&#x27;,n:1,out:&#x27;d₂&#x27;,input:&#x27;d₁&#x27;,done:true}]}
  ];
  const pick=(round,id)=&gt;continuousRounds[round].items.find(item=&gt;item.id===id);
  const staticRounds=[
    {arrivals:[&#x27;A&#x27;,&#x27;B&#x27;],waiting:[],members:[&#x27;A&#x27;,&#x27;B&#x27;],after:[&#x27;A&#x27;,&#x27;B&#x27;],priorKV:0,modelKV:6,keepKV:6,items:[pick(0,&#x27;A&#x27;),pick(0,&#x27;B&#x27;)]},
    {arrivals:[&#x27;C&#x27;],waiting:[&#x27;C&#x27;],members:[&#x27;A&#x27;,&#x27;B&#x27;],after:[&#x27;A&#x27;],priorKV:6,modelKV:8,keepKV:5,items:[pick(1,&#x27;A&#x27;),pick(1,&#x27;B&#x27;)]},
    {arrivals:[&#x27;D&#x27;],waiting:[&#x27;C&#x27;,&#x27;D&#x27;],members:[&#x27;A&#x27;,&#x27;B&#x27;],after:[],priorKV:5,modelKV:6,keepKV:0,items:[pick(2,&#x27;A&#x27;)]},
    {arrivals:[],waiting:[],members:[&#x27;C&#x27;,&#x27;D&#x27;],after:[&#x27;C&#x27;,&#x27;D&#x27;],priorKV:0,modelKV:6,keepKV:6,items:[pick(1,&#x27;C&#x27;),pick(2,&#x27;D&#x27;)]},
    {arrivals:[],waiting:[],members:[&#x27;C&#x27;,&#x27;D&#x27;],after:[&#x27;C&#x27;],priorKV:6,modelKV:8,keepKV:5,items:[pick(2,&#x27;C&#x27;),pick(3,&#x27;D&#x27;)]},
    {arrivals:[],waiting:[],members:[&#x27;C&#x27;,&#x27;D&#x27;],after:[],priorKV:5,modelKV:6,keepKV:0,items:[pick(3,&#x27;C&#x27;)]}
  ];
  const datasets={continuous:continuousRounds,static:staticRounds};
  const labels={continuous:&#x27;连续批处理&#x27;,static:&#x27;静态批处理&#x27;,compare:&#x27;并排对比&#x27;};
  const phases=[
    {title:&#x27;入队与调度&#x27;,brief:&#x27;Scheduler 选择请求、分配 KV → 形成每请求的 token 预算。&#x27;},
    {title:&#x27;执行与采样&#x27;,brief:&#x27;Worker 读取计划 → GPU 前向、写 KV，并采样下一个 token。&#x27;},
    {title:&#x27;回传与更新&#x27;,brief:&#x27;Scheduler 消费 token ID → 判停、移出已完成请求、释放 KV。&#x27;},
    {title:&#x27;输出与下一轮&#x27;,brief:&#x27;前端返回新 token；存活请求保留 → 下一轮重新组批。&#x27;}
  ];
  const names=a=&gt;a.length?a.join(&#x27;、&#x27;):&#x27;无&#x27;;
  let mode=&#x27;compare&#x27;,current=-1,timer=null;
  const length=()=&gt;mode===&#x27;continuous&#x27;?16:24;
  const readState=s=&gt;{
    const v=s?.modelContent?.batchComparison,old=s?.modelContent?.continuousBatching;
    if(v?.version===2&amp;&amp;Object.hasOwn(labels,v.view)&amp;&amp;Number.isInteger(v.step)&amp;&amp;v.step&gt;=-1&amp;&amp;v.step&lt;(v.view===&#x27;continuous&#x27;?16:24)){mode=v.view;current=v.step;}
    else if(old?.version===1&amp;&amp;Number.isInteger(old.step)&amp;&amp;old.step&gt;=-1&amp;&amp;old.step&lt;16){mode=old.step&lt;0?&#x27;compare&#x27;:&#x27;continuous&#x27;;current=old.step;}
  };
  readState(window.openai?.widgetState);
  function save(){if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{batchComparison:{version:2,view:mode,step:current,round:current&lt;0?null:Math.floor(current/4)+1,phase:current&lt;0?null:current%4+1}},privateContent:null})).catch(()=&gt;{});}
  function stop(){if(timer){clearInterval(timer);timer=null;}buttons.play.textContent=current===length()-1?&#x27;重播&#x27;:&#x27;播放&#x27;;}
  const escape=s=&gt;String(s).replaceAll(&#x27;&amp;&#x27;,&#x27;&amp;amp;&#x27;).replaceAll(&#x27;&lt;&#x27;,&#x27;&amp;lt;&#x27;).replaceAll(&#x27;&gt;&#x27;,&#x27;&amp;gt;&#x27;).replaceAll(&#x27;&quot;&#x27;,&#x27;&amp;quot;&#x27;);
  function state(view=mode){
    if(current&lt;0)return{ri:-1,pi:-1,r:null};
    const ri=Math.floor(current/4),pi=current%4;return{ri,pi,r:datasets[view===&#x27;static&#x27;?&#x27;static&#x27;:&#x27;continuous&#x27;][ri]??null};
  }
  function drawDiagram(){
    if(mode===&#x27;compare&#x27;)return;
    const {ri,pi,r}=state();
    svg.setAttribute(&#x27;aria-label&#x27;,`${labels[mode]}的等待队列、调度器、GPU 和流式输出流程`);
    const w=Math.max(250,Math.round(svg.getBoundingClientRect().width));
    const narrow=w&lt;550, gap=40;
    let pos,h;
    if(narrow){const nw=Math.min(240,w-72),x=(w-nw)/2;h=460;pos={queue:{x,y:8,w:nw,h:76},scheduler:{x,y:124,w:nw,h:86},gpu:{x,y:260,w:nw,h:86},client:{x,y:384,w:nw,h:68}};}
    else {const side=(w-2*gap)*.27,center=w-2*side-2*gap;h=280;pos={queue:{x:0,y:18,w:side,h:92},scheduler:{x:side+gap,y:18,w:center,h:106},client:{x:w-side,y:18,w:side,h:92},gpu:{x:side+gap,y:194,w:center,h:80}};}
    const q=pos.queue,s=pos.scheduler,g=pos.gpu,c=pos.client;
    const cx=n=&gt;n.x+n.w/2,cy=n=&gt;n.y+n.h/2;
    let edges;
    if(narrow){edges=[
      {n:1,d:`M ${cx(q)} ${q.y+q.h} V ${s.y}`,x:cx(q),y:104},
      {n:2,d:`M ${cx(s)+42} ${s.y+s.h} V ${g.y}`,x:cx(s)+42,y:235},
      {n:3,d:`M ${cx(g)-42} ${g.y} V ${s.y+s.h}`,x:cx(s)-42,y:235},
      {n:4,d:`M ${s.x+s.w} ${cy(s)} H ${w-14} V ${cy(c)} H ${c.x+c.w}`,x:w-14,y:365}
    ];}else{edges=[
      {n:1,d:`M ${q.x+q.w} ${cy(q)} H ${s.x}`,x:q.x+q.w+gap/2,y:cy(q)},
      {n:2,d:`M ${cx(s)+42} ${s.y+s.h} V ${g.y}`,x:cx(s)+42,y:159},
      {n:3,d:`M ${cx(g)-42} ${g.y} V ${s.y+s.h}`,x:cx(g)-42,y:159},
      {n:4,d:`M ${s.x+s.w} ${cy(c)} H ${c.x}`,x:s.x+s.w+gap/2,y:cy(c)}
    ];}
    let queueLines=[&#x27;等待新请求&#x27;,&#x27;到达后进入 waiting&#x27;];
    let schedulerLines=mode===&#x27;static&#x27;?[&#x27;CPU · 调度器&#x27;,&#x27;锁定成员，整批结束再开批&#x27;,&#x27;KV 分配、结束与释放&#x27;]:[&#x27;CPU · Scheduler&#x27;,&#x27;每轮重新组批 / token 预算&#x27;,&#x27;KV 分配、结束与释放&#x27;];
    let gpuLines=[&#x27;GPU · Worker&#x27;,&#x27;输入 token → 新 token&#x27;,&#x27;KV 保留在设备侧&#x27;];
    let clientLines=[&#x27;前端 / 客户端&#x27;,&#x27;逐 token 接收结果&#x27;];
    if(r){
      queueLines=[&#x27;新到请求&#x27;,names(r.arrivals),!r.arrivals.length?&#x27;本轮无新请求&#x27;:pi===0?&#x27;本轮调度边界接纳&#x27;:&#x27;已进入本轮计划&#x27;];
      if(mode===&#x27;static&#x27;){
        const ended=pi&gt;=2&amp;&amp;r.after.length===0;
        queueLines=r.waiting.length?[&#x27;等待队列&#x27;,names(r.waiting),ended?&#x27;本批已结束，下轮准入&#x27;:&#x27;本批未结束，暂不准入&#x27;]:[&#x27;等待队列&#x27;,&#x27;无等待请求&#x27;,ended?&#x27;所有请求已完成&#x27;:ri===0?&#x27;A、B 已开批&#x27;:ri===3?&#x27;C、D 已开批&#x27;:&#x27;本批继续执行&#x27;];
      }
      const running=pi&gt;=2?r.after:r.items.map(i=&gt;i.id);
      const kv=pi===0?r.priorKV:pi===1?r.modelKV:r.keepKV;
      schedulerLines=[mode===&#x27;static&#x27;?`固定批：${names(r.members)}`:&#x27;CPU · Scheduler&#x27;,`存活：${names(running)}`,`已计算 KV：${kv} token`];
      gpuLines=[&#x27;GPU · Worker&#x27;,r.items.map(i=&gt;i.id+&#x27;:&#x27;+i.type+i.n).join(&#x27;  &#x27;),pi===0?&#x27;计划就绪，等待执行&#x27;:pi===1?&#x27;前向完成 / 新 token 采样&#x27;:&#x27;本轮计算已完成&#x27;];
      clientLines=[&#x27;前端 / 客户端&#x27;,pi&lt;3?&#x27;等待本轮结果&#x27;:r.items.map(i=&gt;i.out).join(&#x27;、&#x27;),pi===3&amp;&amp;ri===datasets[mode].length-1?&#x27;所有请求结束&#x27;:&#x27;&#x27;];
    }
    const active=pi&lt;0?[]:pi===0?[&#x27;queue&#x27;,&#x27;scheduler&#x27;]:pi===1?[&#x27;scheduler&#x27;,&#x27;gpu&#x27;]:pi===2?[&#x27;gpu&#x27;,&#x27;scheduler&#x27;]:[&#x27;scheduler&#x27;,&#x27;client&#x27;];
    let out=`&lt;title&gt;${labels[mode]}：${current&lt;0?&#x27;全局关系&#x27;:`第 ${ri+1} 轮，${phases[pi].title}`}&lt;/title&gt;&lt;desc&gt;① 检查等待队列并调度；② 调度计划传给 Worker 执行；③ token ID 回传调度器并更新状态；④ 向客户端输出，然后进入下一轮。静态侧只在整批结束后准入新请求。&lt;/desc&gt;&lt;defs&gt;&lt;marker id=&quot;cb-arrow&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; refX=&quot;6&quot; refY=&quot;3.5&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M 0 0 L 7 3.5 L 0 7 Z&quot; fill=&quot;var(--muted-foreground)&quot;/&gt;&lt;/marker&gt;&lt;marker id=&quot;cb-arrow-active&quot; markerWidth=&quot;7&quot; markerHeight=&quot;7&quot; refX=&quot;6&quot; refY=&quot;3.5&quot; orient=&quot;auto&quot;&gt;&lt;path d=&quot;M 0 0 L 7 3.5 L 0 7 Z&quot; fill=&quot;var(--viz-series-1)&quot;/&gt;&lt;/marker&gt;&lt;/defs&gt;`;
    const blocked=mode===&#x27;static&#x27;&amp;&amp;r?.waiting.length&gt;0;
    edges.forEach(e=&gt;{const on=pi===e.n-1&amp;&amp;!(e.n===1&amp;&amp;blocked);out+=`&lt;path class=&quot;cb-edge ${on?&#x27;active&#x27;:&#x27;&#x27;}&quot; d=&quot;${e.d}&quot; ${e.n===1&amp;&amp;blocked?&#x27;stroke-dasharray=&quot;3 3&quot;&#x27;:`marker-end=&quot;url(#cb-arrow${on?&#x27;-active&#x27;:&#x27;&#x27;})&quot;`}/&gt;`;});
    const content={queue:queueLines,scheduler:schedulerLines,gpu:gpuLines,client:clientLines};
    for(const [key,n] of Object.entries(pos)){
      out+=`&lt;rect class=&quot;cb-node ${active.includes(key)?&#x27;active&#x27;:&#x27;&#x27;}&quot; x=&quot;${n.x}&quot; y=&quot;${n.y}&quot; width=&quot;${n.w}&quot; height=&quot;${n.h}&quot; rx=&quot;5&quot;/&gt;`;
      const lines=content[key].filter(Boolean),start=cy(n)-(lines.length-1)*10;
      lines.forEach((line,i)=&gt;out+=`&lt;text class=&quot;${i===0?&#x27;cb-node-title&#x27;:&#x27;cb-node-sub text-small&#x27;}&quot; x=&quot;${cx(n)}&quot; y=&quot;${start+i*20}&quot; text-anchor=&quot;middle&quot; dominant-baseline=&quot;middle&quot;&gt;${escape(line)}&lt;/text&gt;`);
    }
    edges.forEach(e=&gt;{if(pi&gt;=0&amp;&amp;pi!==e.n-1)return;out+=`&lt;circle class=&quot;cb-edge-label&quot; cx=&quot;${e.x}&quot; cy=&quot;${e.y}&quot; r=&quot;11&quot;/&gt;&lt;text x=&quot;${e.x}&quot; y=&quot;${e.y}&quot; text-anchor=&quot;middle&quot; dominant-baseline=&quot;central&quot;&gt;${e.n}&lt;/text&gt;`;
      const label=[blocked?&#x27;等待&#x27;:&#x27;准入&#x27;,&#x27;计划&#x27;,&#x27;token ID&#x27;,&#x27;输出&#x27;][e.n-1];
      const horizontal=!narrow&amp;&amp;(e.n===1||e.n===4);
      const left=e.n===3||(narrow&amp;&amp;e.n===4);
      out+=`&lt;text class=&quot;text-small cb-node-sub&quot; x=&quot;${horizontal?e.x:e.x+(left?-16:16)}&quot; y=&quot;${horizontal?e.y+25:e.y}&quot; text-anchor=&quot;${horizontal?&#x27;middle&#x27;:left?&#x27;end&#x27;:&#x27;start&#x27;}&quot; dominant-baseline=&quot;middle&quot;&gt;${label}&lt;/text&gt;`;
    });
    svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${w} ${h}`);svg.style.height=h+&#x27;px&#x27;;svg.innerHTML=out;
  }
  function renderMatrix(target,view,compare=false){
    const {ri,pi}=state(view),rounds=datasets[view],count=compare?6:rounds.length;
    target.style.setProperty(&#x27;--rounds&#x27;,count);
    target.setAttribute(&#x27;aria-label&#x27;,`${labels[view]}，${rounds.length}轮，四个请求的有效输入与输出`);
    const rowStart=&#x27;&lt;div role=&quot;row&quot; style=&quot;display:contents&quot;&gt;&#x27;;
    let out=rowStart+&#x27;&lt;div role=&quot;columnheader&quot; class=&quot;cb-rowhead text-small cb-sub&quot;&gt;请求&lt;br&gt;入→出&lt;/div&gt;&#x27;;
    for(let i=0;i&lt;count;i++)out+=`&lt;div role=&quot;columnheader&quot; class=&quot;cb-colhead ${ri===i&amp;&amp;i&lt;rounds.length?&#x27;cb-current&#x27;:&#x27;&#x27;}&quot;&gt;R${i+1}&lt;/div&gt;`;
    out+=&#x27;&lt;/div&gt;&#x27;;
    requests.forEach(req=&gt;{
      out+=rowStart+`&lt;div role=&quot;rowheader&quot; class=&quot;cb-rowhead&quot;&gt;&lt;strong&gt;${req.id}&lt;/strong&gt;&lt;small class=&quot;text-small cb-sub&quot;&gt;${req.prompt}→${req.goal}&lt;/small&gt;&lt;/div&gt;`;
      const first=rounds.findIndex(r=&gt;r.items.some(v=&gt;v.id===req.id));
      for(let i=0;i&lt;count;i++){
        const r=rounds[i],item=r?.items.find(v=&gt;v.id===req.id),future=ri&gt;=0&amp;&amp;i&gt;ri;
        const isExecuted=current&lt;0||i&lt;ri||(i===ri&amp;&amp;pi&gt;=1),isUpdated=current&lt;0||i&lt;ri||(i===ri&amp;&amp;pi&gt;=2);
        const cls=`${future?&#x27;cb-future &#x27;:&#x27;&#x27;}${ri===i&amp;&amp;r?&#x27;cb-current &#x27;:&#x27;&#x27;}`;
        if(item){
          const output=future?&#x27;待调度&#x27;:isExecuted?`→${item.out}`:&#x27;待计算&#x27;,done=item.done&amp;&amp;isUpdated;
          out+=`&lt;div role=&quot;cell&quot; data-request=&quot;${req.id}&quot; data-round=&quot;${i+1}&quot; class=&quot;cb-cell ${item.type===&#x27;P&#x27;?&#x27;prefill&#x27;:&#x27;decode&#x27;} ${cls}&quot; aria-label=&quot;${req.id}，R${i+1}，${item.type===&#x27;P&#x27;?&#x27;Prefill&#x27;:&#x27;Decode&#x27;}输入${item.n}个token，${future?&#x27;后续预览，尚未执行&#x27;:isExecuted?&#x27;采样&#x27;+item.out:&#x27;待执行&#x27;}${done?&#x27;，完成&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span&gt;${item.type}${item.n}${done?&#x27; ✓&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;span class=&quot;text-small&quot;&gt;${output}&lt;/span&gt;&lt;/div&gt;`;
        }else{
          const waiting=!!r&amp;&amp;i&gt;=req.arrival&amp;&amp;i&lt;first,vacant=view===&#x27;static&#x27;&amp;&amp;r?.members.includes(req.id)&amp;&amp;i&gt;first;
          const label=!r?&#x27;—&#x27;:i&lt;req.arrival?&#x27;未到达&#x27;:waiting?&#x27;等&#x27;:vacant?&#x27;空位&#x27;:&#x27;已结束&#x27;;
          out+=`&lt;div role=&quot;cell&quot; data-request=&quot;${req.id}&quot; data-round=&quot;${i+1}&quot; class=&quot;cb-cell empty text-small ${waiting?&#x27;waiting &#x27;:&#x27;&#x27;}${vacant?&#x27;vacant &#x27;:&#x27;&#x27;}${cls}&quot; aria-label=&quot;${req.id}，R${i+1}，${!r?&#x27;本侧已完成，无额外调度&#x27;:waiting?&#x27;已到达，等待当前固定批结束&#x27;:vacant?&#x27;请求已结束，空位不补&#x27;:label}&quot;&gt;&lt;span&gt;${label}&lt;/span&gt;${vacant?&#x27;&lt;span&gt;不补&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;`;
        }
      }
      out+=&#x27;&lt;/div&gt;&#x27;;
    });
    out+=rowStart+&#x27;&lt;div class=&quot;cb-total text-small cb-sub&quot; role=&quot;rowheader&quot;&gt;有效&lt;br&gt;输入&lt;/div&gt;&#x27;;
    for(let i=0;i&lt;count;i++)out+=`&lt;div role=&quot;cell&quot; class=&quot;cb-total text-small ${ri===i&amp;&amp;i&lt;rounds.length?&#x27;cb-current&#x27;:&#x27;&#x27;}&quot;&gt;${rounds[i]?rounds[i].items.reduce((s,v)=&gt;s+v.n,0)+&#x27;/6&#x27;:&#x27;—&#x27;}&lt;/div&gt;`;
    target.innerHTML=out+&#x27;&lt;/div&gt;&#x27;;
  }
  function selectedDetail(view=mode){
    const {ri,pi,r}=state(view);if(!r)return current&lt;0?&#x27;&#x27;:`本侧示例已在 R${datasets[view].length} 完成；没有额外调度。`;
    const used=r.items.reduce((s,i)=&gt;s+i.n,0),finished=r.items.filter(i=&gt;i.done).map(i=&gt;i.id);
    if(pi===0){
      if(view===&#x27;static&#x27;)return `① 固定批 ${names(r.members)}；${r.waiting.length?names(r.waiting)+&#x27; 等待整批结束&#x27;:&#x27;无请求排队&#x27;}。本轮有效输入 ${used}/6。`;
      return `① ${r.arrivals.length?names(r.arrivals)+&#x27; 入队&#x27;:&#x27;无新请求&#x27;}；调度 ${names(r.items.map(i=&gt;i.id))}，输入 ${used}/6，名额 ${r.items.length}/3。`;
    }
    if(pi===1)return &#x27;② &#x27;+r.items.map(i=&gt;`${i.id}：${i.input} → ${i.out}`).join(&#x27;；&#x27;)+&#x27;。&#x27;;
    if(pi===2)return `③ ${finished.length?names(finished)+&#x27; 完成并释放 KV；&#x27;:&#x27;无请求结束；&#x27;}存活 ${names(r.after)}，保留 ${r.keepKV} 个 token 的 KV。`;
    const prefix=`④ 返回 ${r.items.map(i=&gt;i.out).join(&#x27;、&#x27;)}；`;
    if(ri===datasets[view].length-1)return prefix+&#x27;所有请求完成。&#x27;;
    if(view===&#x27;static&#x27;)return prefix+(r.after.length===0?&#x27;本批全部完成，下轮才开 C、D 批。&#x27;:r.waiting.length?&#x27;本批尚未结束，等待请求继续排队。&#x27;:&#x27;固定成员批继续，结束行不补新请求。&#x27;);
    return prefix+(ri===1?&#x27;B 退出，下一轮 D 加入，A 继续执行。&#x27;:ri===0?&#x27;下一轮 C 加入现有的 A、B。&#x27;:&#x27;下一轮仅 C、D 继续。&#x27;);
  }
  function renderComparison(){
    comparison.innerHTML=[&#x27;static&#x27;,&#x27;continuous&#x27;].map(view=&gt;`&lt;section data-view=&quot;${view}&quot; aria-label=&quot;${labels[view]}&quot;&gt;&lt;h3&gt;${labels[view]} · ${datasets[view].length} 轮&lt;/h3&gt;&lt;div class=&quot;text-small cb-sub&quot;&gt;${view===&#x27;static&#x27;?&#x27;① 锁定批 → ② 执行 → ③ 完成行不补 → ④ 整批结束再开批&#x27;:&#x27;① 每轮组批 → ② 执行 → ③ 完成即退出 → ④ 下轮可接新请求&#x27;}&lt;/div&gt;&lt;div class=&quot;cb-panel-detail&quot;&gt;${current&lt;0?(view===&#x27;static&#x27;?&#x27;AB：R1–R3；CD：R4–R6。C、D 等待 AB 整批结束。&#x27;:&#x27;C 在 R2 加入；B 完成后，D 在 R3 加入，A 继续。&#x27;):selectedDetail(view)}&lt;/div&gt;&lt;div class=&quot;cb-matrix tabular-nums&quot; role=&quot;table&quot;&gt;&lt;/div&gt;&lt;/section&gt;`).join(&#x27;&#x27;);
    for(const section of comparison.querySelectorAll(&#x27;section&#x27;))renderMatrix(section.querySelector(&#x27;.cb-matrix&#x27;),section.dataset.view,true);
  }
  function render(){
    const {ri,pi}=state(),isCompare=mode===&#x27;compare&#x27;;viewSelect.value=mode;
    buttons.overview.setAttribute(&#x27;aria-pressed&#x27;,String(current&lt;0));
    buttons.prev.disabled=current&lt;=0;buttons.next.disabled=current===length()-1;
    if(!timer)buttons.play.textContent=current===length()-1?&#x27;重播&#x27;:&#x27;播放&#x27;;
    status.textContent=current&lt;0?(isCompare?&#x27;同样 18 个有效输入、10 个输出；对比准入与排队。&#x27;:&#x27;① 调度 → ② 执行 → ③ 更新 → ④ 输出；每轮重复&#x27;):`${labels[mode]} · R${ri+1} / ${length()/4} · ${pi+1} / 4 ${phases[pi].title}`;
    svg.hidden=isCompare;svg.style.display=isCompare?&#x27;none&#x27;:&#x27;block&#x27;;stepList.hidden=isCompare||current&gt;=0;detail.hidden=isCompare||current&lt;0;
    matrix.hidden=isCompare;comparison.hidden=!isCompare;
    root.querySelector(&#x27;.cb-comparison-note&#x27;).hidden=!isCompare;root.querySelector(&#x27;.cb-differences&#x27;).hidden=!isCompare;
    stepList.innerHTML=phases.map((p,i)=&gt;{const brief=mode===&#x27;static&#x27;&amp;&amp;i===0?&#x27;调度器在开批时锁定成员 → 批内循环期间新请求留在队列。&#x27;:mode===&#x27;static&#x27;&amp;&amp;i===3?&#x27;返回新 token → 本批未完则继续；全部完成才开下一批。&#x27;:p.brief;return `&lt;li&gt;&lt;span class=&quot;cb-step-title&quot;&gt;${i+1} · ${p.title}&lt;/span&gt;&lt;div class=&quot;text-small cb-sub&quot;&gt;${brief}&lt;/div&gt;&lt;/li&gt;`;}).join(&#x27;&#x27;);
    detail.textContent=isCompare?&#x27;&#x27;:selectedDetail();
    if(isCompare)renderComparison();else{drawDiagram();renderMatrix(matrix,mode);}
  }
  viewSelect.addEventListener(&#x27;change&#x27;,()=&gt;{stop();mode=viewSelect.value;current=Math.min(current,length()-1);render();save();});
  buttons.overview.addEventListener(&#x27;click&#x27;,()=&gt;{stop();current=-1;render();save();});
  buttons.prev.addEventListener(&#x27;click&#x27;,()=&gt;{stop();current=Math.max(0,current-1);render();save();});
  buttons.next.addEventListener(&#x27;click&#x27;,()=&gt;{stop();current=Math.min(length()-1,current+1);render();save();});
  buttons.play.addEventListener(&#x27;click&#x27;,()=&gt;{
    if(timer){stop();return;}
    if(current&lt;0||current===length()-1)current=0;
    render();save();buttons.play.textContent=&#x27;暂停&#x27;;
    timer=setInterval(()=&gt;{if(current&gt;=length()-1){stop();return;}current++;render();save();if(current===length()-1)stop();},1800);
  });
  window.addEventListener(&#x27;openai:set_globals&#x27;,event=&gt;{if(event.detail?.globals?.widgetState!==undefined){const before=mode+&#x27;:&#x27;+current;readState(event.detail.globals.widgetState);if(before!==mode+&#x27;:&#x27;+current){stop();render();}}});
  new ResizeObserver(drawDiagram).observe(svg);
  render();
})();

// 插入含 #cb-flow-v1 的真实可视化 document，位于现有脚本之后。
window.openLessonTarget = async function(action) {
  const root = document.getElementById(&#x27;cb-flow-v1&#x27;);
  const mode = action?.mode, step = Number(action?.step);
  const limit = mode === &#x27;continuous&#x27; ? 16 : mode === &#x27;static&#x27; ? 24 : 0;
  if (!root || !Number.isInteger(step) || step &lt; 1 || step &gt; limit) throw new Error(&#x27;批处理跳转参数无效&#x27;);
  const waitFor = async (test) =&gt; {
    const deadline = Date.now() + 4000;
    let stable = 0;
    while (Date.now() &lt; deadline) {
      if (test()) { if (++stable &gt;= 2) return; } else stable = 0;
      await new Promise(resolve =&gt; setTimeout(resolve, 20));
    }
    throw new Error(&#x27;可视化未到达请求的模式与步骤&#x27;);
  };
  const select = root.querySelector(&#x27;#cb-view&#x27;);
  select.value = mode;
  select.dispatchEvent(new Event(&#x27;change&#x27;, {bubbles:true}));
  root.querySelector(&#x27;[data-action=&quot;overview&quot;]&#x27;).click();
  const next = root.querySelector(&#x27;[data-action=&quot;next&quot;]&#x27;);
  for (let i=0; i&lt;step; i++) {
    if (next.disabled) throw new Error(&#x27;尚未到目标步骤，下一步已禁用&#x27;);
    next.click();
  }
  const round = Math.floor((step-1)/4)+1, phase = (step-1)%4+1;
  const expected = &#x27;R&#x27; + round + &#x27; / &#x27; + limit/4 + &#x27; · &#x27; + phase + &#x27; / 4&#x27;;
  const status = root.querySelector(&#x27;.cb-status&#x27;);
  await waitFor(() =&gt; select.value === mode &amp;&amp; status.textContent.includes(expected) &amp;&amp; !root.querySelector(&#x27;.cb-detail&#x27;).hidden);
  return {label:status.textContent.trim()};
};
// Runs in the visualization document, including sandboxed srcdoc frames.
(() =&gt; {
  const pending = new Map();
  let queue = Promise.resolve();
  const ready = document.readyState === &#x27;loading&#x27;
    ? new Promise(resolve =&gt; document.addEventListener(&#x27;DOMContentLoaded&#x27;,resolve,{once:true}))
    : Promise.resolve();
  const pause = () =&gt; document.querySelectorAll(&#x27;button&#x27;).forEach(button =&gt; {
    if (/^(暂停(?:流程|播放|动画)?|停止播放)$/.test(button.textContent.trim())) button.click();
  });
  window.addEventListener(&#x27;lesson-pause-visual&#x27;,pause);
  if (parent === window) return;
  const post = data =&gt; parent.postMessage(data,&#x27;*&#x27;);
  window.addEventListener(&#x27;message&#x27;,async event =&gt; {
    if (event.source !== parent || !event.data || typeof event.data !== &#x27;object&#x27;) return;
    const {type,id,action} = event.data;
    if (type === &#x27;lesson-call-ping&#x27;) {
      await ready; post({type:&#x27;lesson-call-ready&#x27;}); return;
    }
    if (type === &#x27;lesson-call-pause&#x27;) { pause(); return; }
    if (type !== &#x27;lesson-call-open&#x27; || typeof id !== &#x27;string&#x27;) return;
    if (!pending.has(id)) {
      const work = queue.then(() =&gt; ready).then(() =&gt; {
        if (typeof window.openLessonTarget !== &#x27;function&#x27;) throw new Error(&#x27;可视化步骤入口尚未就绪&#x27;);
        return window.openLessonTarget(action);
      });
      pending.set(id,work);
      queue = work.catch(() =&gt; {});
      if (pending.size &gt; 16) pending.delete(pending.keys().next().value);
    }
    try { post({type:&#x27;lesson-call-result&#x27;,id,ok:true,result:await pending.get(id)}); }
    catch (error) { post({type:&#x27;lesson-call-result&#x27;,id,ok:false,error:error.message}); }
  });
  for (const name of [&#x27;click&#x27;,&#x27;change&#x27;]) document.addEventListener(name,event =&gt; {
    if (event.isTrusted &amp;&amp; event.target.closest(&#x27;button,select,input&#x27;)) post({type:&#x27;lesson-call-edited&#x27;});
  },true);
  ready.then(() =&gt; post({type:&#x27;lesson-call-ready&#x27;}));
})();

<script>
/* Common entry: verified call tree -> existing visualization, preserving native DOM. */
(() => {
  function mount() {
    const dataElement = document.getElementById('lesson-call-chain-data');

    let collapsed = new Set(), busy = false, revision = 0, frameReady = false, requestId = 0;
    const replies = new Map();
    let nativeQueue = Promise.resolve();
    const nodeById = id => variant.nodes.find(node => node.id === id);
    const make = (tag,text,className) => {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    };
    const root = make('section',undefined,'code-walkthrough');
    root.id = 'lesson-call-chain';
    root.innerHTML = `<header class="cw-header"><a href="../index.html">← vLLM 学习笔记</a><h1></h1><p>先沿源码调用链定位接口，再进入对应的可视化步骤。</p></header>
      <nav class="cw-nav" aria-label="阅读方式"><button type="button" data-cw-view="chain">01 整体调用链</button><button type="button" data-cw-view="visual">02 可视化执行</button></nav>
      <p class="cw-error" role="alert" hidden></p>
      <section class="cw-chain"><div class="cw-variant"><label>实现与场景 <select aria-label="选择调用链实现"></select></label><p class="cw-scope-text"></p><details class="cw-scope"><summary>源码仓库与固定 commit</summary><div class="cw-repositories"></div></details></div>
      <p class="cw-guide">默认展开三层，点 ＋ 继续跟入子调用。父子缩进表示调用或明确标记的控制块；异步提交与消费分别说明。点名称查看数据变化，沿详情中的调用路径返回上层。</p>
      <div class="cw-layout"><section class="cw-tree-panel" aria-label="源码调用树"><div class="cw-tools"><strong></strong><div><button type="button" data-cw-depth>展开三层</button> <button type="button" data-cw-expand>全部展开</button> <button type="button" data-cw-fold>只看主链</button></div></div><div class="cw-tree-scroll"><ol class="cw-tree"></ol></div></section>
      <article class="cw-detail" tabindex="-1" aria-labelledby="cw-node-title"><nav class="cw-path" aria-label="当前调用路径"></nav><div class="cw-kicker"></div><h2 id="cw-node-title"></h2><p class="cw-summary"></p><dl class="cw-data"></dl><p class="cw-note" hidden></p>
      <section class="cw-evidence"><h3>源码依据 · 行号属于所示 commit</h3><div></div></section><section class="cw-targets"><h3>进入可视化执行</h3><p>按下列入口定位现有图中的对应步骤。</p><div></div></section></article></div></section>
      <div class="cw-context" tabindex="-1" hidden></div>`;
    document.body.insertBefore(root,original[0] || dataElement);
    const $ = selector => root.querySelector(selector);
    $('.cw-header h1').textContent = data.title;
    for (const item of data.variants) {
      const option = make('option',item.title); option.value = item.id; $('.cw-variant select').append(option);
    }
    function validState(value) {
      const nextVariant = variants.get(value?.variant);
      const node = nextVariant?.nodes.find(item => item.id === value.node);
      if (!node || !['chain','visual'].includes(value.screen)) return null;
      const target = value.target === null ? null : Number(value.target);
      if (target !== null && (!Number.isInteger(target) || target < 0 || target >= node.targets.length)) return null;
      return {variant:nextVariant.id,node:node.id,screen:value.screen,target};
    }
    const state = () => ({variant:variant.id,node:selected,screen,target:targetIndex});
    function parseRoute() {
      const query = new URLSearchParams(location.search);
      if (!query.has('cw-view')) return null;
      return validState({variant:query.get('cw-variant'),node:query.get('cw-node'),screen:query.get('cw-view'),target:query.has('cw-target') ? query.get('cw-target') : null});
    }
    function applyState(next) {
      variant = variants.get(next.variant); selected = next.node; screen = next.screen; targetIndex = next.target;
    }
    try {
      const saved = validState(JSON.parse(localStorage.getItem(storageKey)));
      if (saved) applyState({...saved,screen:'chain'});
    } catch {}
    const requested = parseRoute();
    if (requested) applyState(requested);
    function routeKey() {
      const query = new URLSearchParams(location.search);
      return ['cw-view','cw-variant','cw-node','cw-target'].map(key => query.get(key)).join('|');

      if (next.target === null) url.searchParams.delete('cw-target'); else url.searchParams.set('cw-target',String(next.target));
      return url;
    }
    function remember(method = 'replace') {
      try { localStorage.setItem(storageKey,JSON.stringify(state())); } catch {}

      if (url.href !== location.href) {
        try { history[method + 'State']({...history.state,lessonCallChain:state()},'',url); } catch {}
      }
      lastRoute = routeKey();
    }
    function depthOf(node) {
      let depth = 1;
      while (node.parent !== null) { node = nodeById(node.parent); depth++; }
      return depth;
    }
    function resetTree() {
      collapsed = new Set(variant.nodes.filter(node => depthOf(node) >= 3).map(node => node.id));
      revealSelected();

    function revealSelected() {
      let node = nodeById(selected);
      while (node?.parent) { collapsed.delete(node.parent); node = nodeById(node.parent); }
    }
    function buildTree() {
      const top = $('.cw-tree'); top.replaceChildren();
      const append = (list,parent) => {
        const children = variant.nodes.filter(node => node.parent === parent);
        children.forEach((node,index) => {
          const item = make('li'), row = make('div',undefined,'cw-row');
          const hasChildren = variant.nodes.some(child => child.parent === node.id);

          if (hasChildren) {
            branch.type = 'button'; branch.dataset.cwToggle = node.id;
            branch.setAttribute('aria-expanded',!collapsed.has(node.id)); branch.setAttribute('aria-label',(collapsed.has(node.id) ? '展开 ' : '收起 ') + node.title);
          } else branch.setAttribute('aria-hidden','true');
          const button = make('button',undefined,'cw-node'); button.type = 'button'; button.dataset.cwNode = node.id;
          const childCount = variant.nodes.filter(child => child.parent === node.id).length;
          const label = make('span'); label.append(make('code',node.title),make('small','[' + node.kind + '] ' + node.summary + (childCount ? ' · ' + childCount + ' 个子节点' : '')));
          button.append(make('span',node.number,'cw-number'),label); row.append(branch,button); item.append(row);
          if (hasChildren) { const nested = make('ol',undefined,'cw-tree'); nested.hidden = collapsed.has(node.id); append(nested,node.id); item.append(nested); }
          list.append(item);
        });
      };
      append(top,null); $('.cw-tools strong').textContent = '调用与返回 · ' + variant.nodes.length + ' 节点 / ' + Math.max(...variant.nodes.map(depthOf)) + ' 层';
    }
    function detail() {
      const node = nodeById(selected);
      const ancestors = [];

      const path = $('.cw-path'); path.replaceChildren(make('span','调用路径'));

        if (index) path.append(make('span','›'));

        if (part.tagName === 'BUTTON') { part.type = 'button'; part.dataset.cwAncestor = item.id; }

        if (button.dataset.cwNode === selected) button.setAttribute('aria-current','true'); else button.removeAttribute('aria-current');
      });
      $('.cw-kicker').textContent = '节点 ' + node.number + ' / ' + node.kind;

      $('.cw-note').hidden = !node.note; $('.cw-note').textContent = node.note || '';

      if (variant.provenance === 'teaching') $('.cw-evidence>div').append(make('p','此分支说明教学算法，不表示 vLLM 内存在同名函数。','cw-guide'));
      for (const evidence of node.evidence) {
        const repo = variant.repositories[evidence.repo];
        const link = make('a',evidence.label + ' · ' + evidence.path + ':' + evidence.line + (evidence.end ? '–' + evidence.end : ''));
        link.href = repo.url + '/blob/' + repo.commit + '/' + evidence.path + '#L' + evidence.line + (evidence.end ? '-L' + evidence.end : '');

      $('.cw-targets>div').replaceChildren();
      node.targets.forEach((target,index) => {
        const button = make('button',target.label + ' →','cw-jump'); button.type = 'button'; button.dataset.cwTarget = index; button.disabled = busy;
        $('.cw-targets>div').append(button);
      });
    }
    function render() {
      const visual = screen === 'visual';
      root.dataset.cwBusy = String(busy);
      root.dataset.cwScreen = screen;
      original.forEach(node => node.classList.toggle('lesson-hidden',!visual));
      $('.cw-header').hidden = visual; $('.cw-chain').hidden = visual; $('.cw-context').hidden = !visual;
      root.querySelectorAll('[data-cw-view]').forEach(button => button.setAttribute('aria-pressed',button.dataset.cwView === screen));
      $('[data-cw-view=chain]').textContent = visual ? '← 返回调用链' : '01 整体调用链';
      $('.cw-variant select').value = variant.id; $('.cw-scope-text').textContent = variant.scope;
      const repos = $('.cw-repositories'); repos.replaceChildren();
      $('.cw-scope summary').textContent = variant.provenance === 'teaching' ? '算法教学对照 · 无源码仓库' : '源码仓库与固定 commit';
      for (const [key,repo] of Object.entries(variant.repositories)) {
        const link = make('a',(repo.label || key) + ' · ' + repo.url.replace('https://github.com/','') + ' @ ' + repo.commit);
        link.href = repo.url + '/tree/' + repo.commit; link.target = '_blank'; link.rel = 'noopener noreferrer'; repos.append(link);
      }
      $('.cw-context').textContent = targetIndex === null
        ? '当前展示原交互流程。从调用链的具体节点跳转，可定位对应模式和步骤。'
        : '来自节点 ' + nodeById(selected).number + ' · ' + nodeById(selected).title + '。可继续使用图中的模式与步进控件。';
      detail();
      if (visual) window.dispatchEvent(new Event('resize'));
    }
    function scrollSelected() {
      const button = root.querySelector('[data-cw-node="' + selected + '"]'), box = $('.cw-tree-scroll');
      const a = button.getBoundingClientRect(), b = box.getBoundingClientRect();
      if (a.top < b.top) box.scrollTop += a.top - b.top - 8;
      else if (a.bottom > b.bottom) box.scrollTop += a.bottom - b.bottom + 8;
    }
    function clearError() { $('.cw-error').hidden = true; $('.cw-error').textContent = ''; }
    function errorMessage(error) { $('.cw-error').textContent = '无法定位该步骤：' + error.message; $('.cw-error').hidden = false; }
    window.addEventListener('message',event => {
      if (!frame || event.source !== frame.contentWindow || !event.data) return;
      if (event.data.type === 'lesson-call-ready') frameReady = true;
      if (event.data.type === 'lesson-call-result') {
        const pending = replies.get(event.data.id);
        if (pending) { replies.delete(event.data.id); clearTimeout(pending.timer); event.data.ok ? pending.resolve(event.data.result) : pending.reject(new Error(event.data.error)); }
      }
      if (event.data.type === 'lesson-call-edited' && !busy && screen === 'visual') markEdited();
    });
    function markEdited() {
      targetIndex = null;
      $('.cw-context').textContent = '图中的模式或步骤已手动调整，当前状态不再绑定调用链节点。返回调用链可重新定位源码对应步骤。';
      remember();
    }
    async function invoke(action) {
      if (!frame) {
        if (typeof window.openLessonTarget !== 'function') throw new Error('当前页面缺少步骤入口');
        const work = nativeQueue.then(() => window.openLessonTarget(action));
        nativeQueue = work.catch(() => {});
        return work;
      }
      const deadline = Date.now() + 5000;
      while (!frameReady && Date.now() < deadline) {
        frame.contentWindow?.postMessage({type:'lesson-call-ping'},'*');
        await new Promise(resolve => setTimeout(resolve,80));
      }
      if (!frameReady) throw new Error('内嵌可视化尚未就绪，请稍后重试');
      const id = topic + ':' + ++requestId;
      return new Promise((resolve,reject) => {
        const timer = setTimeout(() => { replies.delete(id); reject(new Error('步骤定位超时')); },8000);
        replies.set(id,{resolve,reject,timer});
        frame.contentWindow.postMessage({type:'lesson-call-open',id,action},'*');
      });
    }
    async function openTarget(index,method = 'push',scroll = true) {
      const target = nodeById(selected).targets[index];
      if (!target) return;
      const currentPage = location.pathname.split('/').at(-1);
      if (target.action.page && target.action.page !== currentPage) {
        if (!['index.html','comparison.html'].includes(target.action.page)) throw new Error('不支持的页面目标');
        const url = new URL(target.action.page,location.href); url.hash = '';
        location.assign(urlFor({...state(),screen:'visual',target:index},url)); return;
      }
      const job = ++revision; busy = true; screen = 'visual'; targetIndex = index; clearError(); render();
      $('.cw-context').textContent = '正在定位：' + target.label;
      try {
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const result = await invoke(target.action);
        if (job !== revision) return;
        $('.cw-context').textContent = '来自节点 ' + nodeById(selected).number + ' · ' + nodeById(selected).title + ' → ' + (result?.label || target.label);
        if (method) remember(method);
        if (scroll) { $('.cw-context').scrollIntoView({block:'start'}); $('.cw-context').focus({preventScroll:true}); }
      } catch (error) {
        if (job === revision) { screen = 'chain'; render(); errorMessage(error); }
      } finally { if (job === revision) { busy = false; root.dataset.cwBusy = 'false'; detail(); } }
    }
    function pauseVisual() {
      if (frame) frame.contentWindow?.postMessage({type:'lesson-call-pause'},'*');
      else window.dispatchEvent(new Event('lesson-pause-visual'));
    }
    function openChain() {
      revision++; busy = false; screen = 'chain'; clearError();
      pauseVisual();
      revealSelected(); buildTree(); render(); remember('push'); scrollSelected();
      root.scrollIntoView({block:'start'});
    }
    root.addEventListener('click',event => {
      const target = event.target.closest('[data-cw-target]');
      if (target) { openTarget(Number(target.dataset.cwTarget)); return; }
      const layer = event.target.closest('[data-cw-view]');
      if (layer) {
        if (layer.dataset.cwView === 'chain') openChain();
        else if (targetIndex !== null) openTarget(targetIndex);
        else { screen = 'visual'; clearError(); render(); remember('push'); }
        return;
      }
      const toggle = event.target.closest('[data-cw-toggle]');
      if (toggle) {
        const id = toggle.dataset.cwToggle;
        if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
        buildTree(); detail(); root.querySelector('[data-cw-toggle="' + id + '"]').focus({preventScroll:true}); return;
      }
      const button = event.target.closest('[data-cw-node],[data-cw-ancestor]');
      if (button) {
        selected = button.dataset.cwNode || button.dataset.cwAncestor; targetIndex = null; clearError();
        if (button.dataset.cwAncestor) { revealSelected(); buildTree(); }
        detail(); remember('push');
        if (button.dataset.cwAncestor) scrollSelected();
        if (matchMedia('(max-width:760px)').matches) { $('.cw-detail').scrollIntoView({block:'start'}); $('.cw-detail').focus({preventScroll:true}); }
      }
    });
    $('[data-cw-expand]').addEventListener('click',() => { collapsed.clear(); buildTree(); detail(); });
    $('[data-cw-depth]').addEventListener('click',() => { resetTree(); buildTree(); detail(); });
    $('[data-cw-fold]').addEventListener('click',() => { collapsed = new Set(variant.nodes.filter(node => node.parent !== null).map(node => node.id)); buildTree(); detail(); });
    $('.cw-variant select').addEventListener('change',event => {
      variant = variants.get(event.target.value); selected = variant.entry || variant.nodes[0].id; targetIndex = null;
      resetTree(); buildTree(); clearError(); render(); remember('push');
    });
    for (const name of ['click','change']) document.addEventListener(name,event => {
      if (event.isTrusted && !busy && screen === 'visual' && event.target.closest('.lesson-original') && event.target.closest('button,select,input')) markEdited();
    },true);
    window.addEventListener('popstate',() => {
      if (routeKey() === lastRoute) return;
      lastRoute = routeKey(); revision++; busy = false;
      const next = parseRoute() || {variant:fallback.id,node:fallback.entry || fallback.nodes[0].id,screen:'chain',target:null};
      applyState(next); resetTree(); buildTree(); render(); clearError();
      if (screen === 'visual' && targetIndex !== null) openTarget(targetIndex,null,false);
      else if (screen === 'chain') { pauseVisual(); scrollSelected(); }
    });
    resetTree(); buildTree(); render();
    if (screen === 'visual' && targetIndex !== null) openTarget(targetIndex,null,false);
    else if (screen === 'chain') scrollSelected();
    document.documentElement.dataset.callChainReady = 'true';
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',mount,{once:true}); else mount();
})();
</script>

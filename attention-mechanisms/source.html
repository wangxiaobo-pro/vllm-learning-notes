<section id="attn-complete-plates" lang="zh-CN">
  <style>
    #attn-complete-plates{display:grid;gap:calc(var(--font-size-base)*.6);min-width:0;overflow-wrap:anywhere}
    #attn-complete-plates .choose{display:flex;align-items:center;flex-wrap:wrap;gap:.35em 1em}
    #attn-complete-plates .choose label{flex:1 1 14em;min-width:0}
    #attn-complete-plates .param{display:flex;align-items:center;flex-wrap:wrap;gap:.25em .7em}
    #attn-complete-plates .param input{flex:1 1 9em;min-width:0}
    #attn-complete-plates [hidden]{display:none!important}
    #attn-complete-plates .diagram-host{min-width:0}
    #attn-complete-plates .plate-svg{display:block;width:100%;font-family:inherit}
    #attn-complete-plates .refs{display:flex;flex-wrap:wrap;gap:.25em .8em}
    #attn-complete-plates .mode-intro{display:grid;gap:calc(var(--font-size-base)*.4)}
    #attn-complete-plates .mode-notes{display:grid;gap:calc(var(--font-size-base)*.4);margin:0}
    #attn-complete-plates .mode-note{display:grid;grid-template-columns:6em minmax(0,1fr);gap:calc(var(--font-size-base)*.5)}
    #attn-complete-plates .mode-note dt{font-weight:500}
    #attn-complete-plates .mode-note dd{margin:0;min-width:0}
    @media(max-width:480px){#attn-complete-plates .mode-note{grid-template-columns:minmax(0,1fr);gap:calc(var(--font-size-base)*.2)}}
  </style>
  <div class="choose"><h2>注意力演算</h2><label class="form-label"><span class="sr-only">选择注意力机制</span><select data-p="model" class="form-select"></select></label></div>
  <div data-p="param" class="param" hidden><label for="attention-parameter" data-p="paramname" class="form-label"></label><input id="attention-parameter" class="form-range" type="range" min="0" step="1" data-p="slider"></div>
  <div data-p="modes" class="viz-controls" role="group" aria-label="CSA2 计算模式" hidden>
    <button type="button" class="btn" data-mode="0" aria-pressed="true">Full · 新建</button>
    <button type="button" class="btn" data-mode="1" aria-pressed="false">Reindex · 重选</button>
    <button type="button" class="btn" data-mode="2" aria-pressed="false">Reuse · 沿用</button>
  </div>
  <div data-p="mode-intro" class="mode-intro" hidden>
    <p class="text-small">CSA2 通过共享缓存和索引结果，减少长上下文中的重复工作。以下以 Decoder 为例，三种角色预先分配到不同层；每层仍计算自己的主 Q、局部窗口和输出。</p>
    <dl class="mode-notes">
      <div class="mode-note"><dt>解决什么问题</dt><dd data-p="mode-problem"></dd></div>
      <div class="mode-note"><dt>计算流程</dt><dd data-p="mode-description"></dd></div>
      <div class="mode-note"><dt>计算取舍</dt><dd data-p="mode-cost"></dd></div>
    </dl>
  </div>
  <div class="viz-controls" role="group" aria-label="计算回放">
    <button type="button" class="btn btn-primary" data-p="next">执行下一步</button>
    <button type="button" class="btn" data-p="play" aria-pressed="false">自动执行</button>
    <button type="button" class="btn" data-p="prev">上一步</button>
    <button type="button" class="btn btn-ghost" data-p="reset">重置</button>
  </div>
  <div role="status" aria-live="polite" aria-atomic="true"><strong data-p="step"></strong><span class="sr-only" data-p="result"></span></div>
  <div data-p="host" class="diagram-host"></div>
  <div class="refs text-small" data-p="refs"></div>
</section>
<script>
(()=>{
  const root=document.getElementById('attn-complete-plates'),el=k=>root.querySelector('[data-p="'+k+'"]');
  const modelSelect=el('model'),host=el('host'),slider=el('slider');
  const scenes={},runSteps={};
   const colors={ink:'var(--foreground)',dim:'var(--muted-foreground)',line:'var(--border)',paper:'var(--background)',soft:'var(--muted)',none:'none'};
 for(let i=1;i<=6;i++){colors['s'+i]='var(--viz-series-'+i+')';colors['soft'+i]='color-mix(in srgb,var(--viz-series-'+i+') 18%,var(--background))';}
 const ns='http://www.w3.org/2000/svg',S=(tag,attrs={},txt)=>{const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))if(v!=null)n.setAttribute(k,v);if(txt!==undefined)n.textContent=txt;return n;};
 const palette=k=>colors[k]||k;
 function painter(svg,w){
   const put=(tag,props,style={},text)=>{
     const attrs={...props};
     for(const [key,value] of Object.entries(style)){
       if(key==='fill'||key==='stroke')attrs[key]=palette(value);
       if(key==='sw')attrs['stroke-width']=value;
       if(key==='rx'||key==='opacity')attrs[key]=value;
       if(key==='dash')attrs['stroke-dasharray']=value;
     }
     const n=S(tag,attrs,text);svg.append(n);return n;
   };
   return {w,text:(x,y,str,o={})=>put('text',{x,y,fill:palette(o.tone||'ink'),'font-size':o.size||14,'font-weight':o.weight||400,'text-anchor':o.anchor||'start'},{},str),
    rect:(x,y,width,height,o={})=>put('rect',{x,y,width,height,rx:0},{fill:'none',stroke:'none',...o}),
    line:(x1,y1,x2,y2,o={})=>put('line',{x1,y1,x2,y2},{stroke:'line',sw:1,...o}),
    path:(d,o={})=>put('path',{d},{fill:'none',stroke:'line',sw:1,...o}),
    circle:(cx,cy,r,o={})=>put('circle',{cx,cy,r},{fill:'none',stroke:'none',...o})
   };
 }

  (() => {
  const b=[2,0,1,1,0,0,1,0], v=[0,4,3,1,8,2,10,6], sub='₀₁₂₃₄₅₆₇₈₉';
  function fraction(n,d) {
    const gcd=(a,b)=>b?gcd(b,a%b):a, g=gcd(Math.abs(n),d);
    return d/g===1?String(n/g):n/g+'/'+(d/g);
  }
  function sparse(id,param) {
    const f=Number(param), block=id==='block', t=block?8-f:f+1, q='q'+sub[t];
    const group=Math.floor((t-1)/2), chosen=group?'A、'+'ABCD'[group]:'A';
    const ids=block
      ? v.map((_,i)=>i+1).filter(j=>j<=t&&(j<=2||Math.floor((j-1)/2)===group))
      : v.map((_,i)=>i+1).filter(j=>j<=t&&(j>=t-2||(id==='streaming'&&j<=2)));
    const weights=ids.map(j=>2**b[j-1]);
    const den=weights.reduce((sum,w)=>sum+w,0);
    const num=weights.reduce((sum,w,i)=>sum+w*v[ids[i]-1],0);
    const z=fraction(num,den), values=ids.map(j=>v[j-1]);
    const selected='{'+ids.join(', ')+'}';
    const selection=block?'查询块 '+'ABCD'[group]+' 取键块 '+chosen+'，再应用因果约束'
      :id==='swa'?'窗口宽 3，包含当前 token'
      :'固定前两个已出现的位置，与近期三个位置取并集';
    const row={
      label:block?'选块并应用因果掩码':'确定本拍的可见位置',
      match:block?'列是键 k':/^(?:上一拍|开始前)/,
      value:selection+'。'+q+' 可以读取 '+selected+'。'
    };
    const softmax={
      label:'按可见键归一化',
      match:block?/^q[₁₂₃₄₅₆₇₈] 读取键块/:'当前权重 α',
      value:'所选位置的 exp(qₜ kⱼ / √1) 为 ['+weights.join(', ')+']，除以总和 '+den+'，得到权重 ['+weights.map(a=>fraction(a,den)).join(', ')+']。'
    };
    if(block){
      row.until='斜线格';row.wide={min:560,x:2,endX:330};
      softmax.until='头输出 z';softmax.wide={min:560,x:330,right:1};
    }
    return [
      {label:'读取上层表示',match:'上层输入 h',value:'当前 t'+sub[t]+' 的 hₜ=(1,'+b[t-1]+','+v[t-1]+')。各位置使用自己的 bⱼ 和 vⱼ。'},
      {label:'投影查询、键和值',match:'投影给出 q=1',value:q+'=1，kⱼ=bⱼ ln 2，Vⱼ=vⱼ；当前 kₜ='+['0','ln 2','2 ln 2'][b[t-1]]+'，Vₜ='+v[t-1]+'。'},
      row,softmax,
      {label:'混合可见的 V',match:block?'先读 ':'将柱高乘各自的 V',value:'V=['+values.join(', ')+']；zₜ=('+weights.map((a,i)=>a+'×'+values[i]).join(' + ')+')/'+den+'='+z+'。'},
      {label:'输出投影和残差',match:'头读出为 zₜ',value:'zₜ(1,0,−1)=('+z+', 0, '+fraction(-num,den)+')。加回 hₜ 后得到 ('+fraction(den+num,den)+', '+b[t-1]+', '+fraction(v[t-1]*den-num,den)+')。'}
    ];
  }
  Object.assign(runSteps, {
    base:()=>[
      {label:'读取词向量',match:'①',value:'猫 x₁=(1,0)，跑 x₂=(1,1)，跟踪第二个位置。'},
      {label:'投影 Q、K、V',match:'②',value:'q₂=1；两个键为 0、ln 3；两个值分别为 (2,0)、(0,4)。'},
      {label:'点积并做 softmax',match:'③',value:'可见位置 {1,2}。点积分数 [0,ln 3] → 指数 [1,3] → 权重 [¼,¾]。'},
      {label:'按权重缩短两根向量',match:'沿两条加权箭头',value:'¼×(2,0)=(0.5,0)，¾×(0,4)=(0,3)。'},
      {label:'两向量相加',match:'④',value:'头输出 o₂=(0.5,0)+(0,3)=(0.5,3)。'},
      {label:'输出投影和残差',match:'⑤',value:'(0.5,3) Wₒ=(3.5,−2.5)，加回 x₂=(1,1) 得到 (4.5,−1.5)。'}
    ],
    swa:f=>sparse('swa',f),streaming:f=>sparse('streaming',f),block:f=>sparse('block',f)
  });
})();

(()=>{
  const H=['h₀','h₁','h₂','h₃'],T=['t₁','t₂','t₃','t₄'];
  const q=['a','−a','2a','−2a'],qn=[1,-1,2,-2];
  const kv={
    A:{k:[0,0,1,1],v:[0,2,3,1]},B:{k:[0,0,-1,-1],v:[0,2,4,2]},
    C:{k:[0,0,1,1],v:[0,4,6,2]},D:{k:[0,0,-1,-1],v:[0,2,2,0]}
  };
  const cases={
    mha:{map:'ABCD',out:['5/3','7/3','18/5','1'],y:'[94/15,74/15]'},
    mqa:{map:'AAAA',out:['5/3','4/3','9/5','6/5'],y:'[14/3,29/15]'},
    gqa:{map:'AABB',out:['5/3','4/3','7/5','13/5'],y:'[17/3,2/15]'}
  };
  const pidx=p=>Math.max(0,Math.min(3,Number(p)||0));
  const ls=n=>({'-2':'−2a','-1':'−a','0':'0','1':'a','2':'2a'})[n];
  const vec=a=>'['+a.join(',')+']';
  const topLeft={min:570,left:0,right:.49},topRight={min:570,left:.49,right:1};
  const input={label:'读取隐藏向量',match:'上层输入 X',until:'x₄ 经 W_Q',value:'四个位置各有两个输入特征。当前查询位置 t₄ 的隐藏向量为 (1,1)，它可读取 t₁ 至 t₄。'};
  const project={label:'投影出 Q 与 KV',match:'x₄ 经 W_Q',value:'令 a=ln 2。x₄ 经查询投影得到 [a,−a,2a,−2a]；组 A 的四个键为 [0,0,1,1]，值为 [0,2,3,1]。'};
  function head(mode,param){
    const f=pidx(param),spec=cases[mode],g=spec.map[f],{k,v}=kv[g],s=k.map(key=>key*qn[f]);
    const floor=Math.min(...s),nums=s.map(value=>2**(value-floor)),den=nums.reduce((a,b)=>a+b);
    const numerator=nums.map((n,i)=>n+'×'+v[i]).join('+');
    return [input,project,
      {label:'接入对应 KV 头',match:'① 查询头选择 KV',until:'本层为每个 token 保存',wide:topLeft,
        value:'四条线分别接到 '+spec.map.split('').join('、')+'。本次高亮 '+H[f]+'，它用查询 '+q[f]+' 读取组 '+g+'。'},
      {label:'用查询逐位置打分',match:'② '+H[f]+' 从 KV '+g+' 取值',until:'q·K',wide:topRight,
        value:'键 K='+vec(k)+'。以 '+q[f]+' 逐项相乘并除以 √1，得到分数 '+vec(s.map(ls))+'。'},
      {label:'沿位置做 softmax',match:'softmax 权重',until:'权重 × V',wide:topRight,
        value:'对这一行四项取指数、按行和归一化，'+H[f]+' 的权重为 '+vec(nums)+'/'+den+'。'},
      {label:'加权读取 V',match:'权重 × V',wide:topRight,
        value:'组 '+g+' 的 V='+vec(v)+'。'+H[f]+' = ('+numerator+')/'+den+' = '+spec.out[f]+'。'},
      {label:'拼接并做输出投影',match:'四头拼接 → 输出投影',
        value:'四个头并行得到 '+vec(spec.out)+'。依次拼接后乘 Wᴼ，t₄ 的 attention 分支输出为 '+spec.y+'。'}
    ];
  }
  function paged(param=3){
    const j=pidx(param),b=Math.floor(j/2),page=[7,2][b],off=j%2,slot=2*page+off;
    return [input,project,
      {label:'定位逻辑块',match:'① 请求的逻辑位置',until:'块表 [7, 2]',
        value:'本次追踪 '+T[j]+' 的 KV。零基位置 j='+j+'，每块 2 个 token，逻辑块号 floor('+j+'/2)='+b+'，块内偏移 '+off+'。'},
      {label:'查块表',match:'块表 [7, 2]',until:'② 物理块',
        value:'table['+b+']='+page+'。查询仍来自 t₄，访问的 KV 位于物理块 '+page+'。'},
      {label:'读取物理槽',match:'② 物理块',until:/^(?:物理)?块 [27] × 2 \+ 偏移/,
        value:'展平槽号 = '+page+'×2+'+off+'='+slot+'。头 h₀ 在此槽读到 K='+kv.A.k[j]+'、V='+kv.A.v[j]+'。'},
      {label:'对四个位置统一归一化',match:'③ h₀ 汇总四个位置',until:'分子相加',
        value:'逻辑顺序访问槽 [14,15,4,5]。h₀ 的指数权重是 [1,1,2,2]，输出 (1×0+1×2+2×3+2×1)/6=5/3。'},
      {label:'拼接并做输出投影',match:'四头拼接 → 输出投影',
        value:'另三个头读出 7/3、18/5、1。四头拼接再乘 Wᴼ，t₄ 的 attention 分支输出为 [94/15,74/15]。'}
    ];
  }
  function flash(){
    return [
      {label:'从 X 投影头 h₀',match:'输入 · 头 h₀',until:'V = [0, 2, 3, 1]',wide:{min:585,x:278,right:1},
        value:'输入 x=(u,w)。头 h₀ 的 q=a·u、k=u、v=w，a=ln 2。第 4 行用 q₄=a，从 K=[0,0,1,1]、V=[0,2,3,1] 读数。'},
      {label:'定位因果矩阵的第 4 行',match:/^①\s*把分数矩阵/,until:'Ⅰ、Ⅱ 为 Q 块',wide:{min:585,left:0,endX:276},
        value:'矩阵按 2×2 分块。q₄ 位于下排 Q 块，四个位置均可见，分数依次为 [0,0,a,a]。先处理左边的块 A。'},
      {label:'块 A 进入片上工作区',match:'时刻 1 · 载入 A',until:'z=0+2=2',
        value:'A 的 K=[0,0]、V=[0,2]。分数 [0,0]，移去最大值 m=0 后指数为 [1,1]，得 ℓ=2、z=2。'},
      {label:'保留 A 的三个统计量',match:'带到 B',until:'A 的逐位置分数',
        value:'把 A 的 m=0、ℓ=2、z=2 传给下一块。下一块可以覆盖片上的临时分数缓冲。'},
      {label:'换入块 B',match:'时刻 2 · 换入 B',until:'z=3+1=4',
        value:'B 的 K=[1,1]、V=[3,1]。分数 [a,a]，移去本块最大值 a 后指数为 [1,1]，得 ℓ块=2、z块=4。'},
      {label:'换基准并合并',match:'对齐最大值，合并统计量',until:'h₀ 输出',
        value:'新最大值 a，A 的旧统计都乘 exp(0−a)=½。ℓ′=½×2+2=3，z′=½×2+4=5，h₀=z′/ℓ′=5/3。'},
      {label:'拼接各头再投影',match:/^③\s*各头独立完成/,
        value:'同理得到另外三头 [7/3,18/5,1]。拼接四头并乘 Wᴼ，t₄ 的 attention 分支输出是 [94/15,74/15]。'}
    ];
  }
  Object.assign(runSteps,{
    mha:param=>head('mha',param),mqa:param=>head('mqa',param),gqa:param=>head('gqa',param),paged,flash
  });
})();

Object.assign(runSteps, {
  ssm: () => [
    {label:'从输入算写入值和保留率',value:'x₁=(0,1)、x₂=(1,7/4) → u=(1,7/4)，r=(½,¼)',match:'上层隐藏向量驱动 SSM'},
    {label:'沿时间递推状态',value:'s₀=0 → s₁=½×0+1=1 → s₂=¼×1+7/4=2',match:'r₁=½，u₁=1'},
    {label:'把两个读出交给注意力层',value:'y₁=1，y₂=2 → h′₁=(1,1)，h′₂=(1,2)',match:'读出状态，传给下一注意力层'},
    {label:'投影成 Q、K、V',value:'q₂=1，K=[0,ln 2]，V=[1,2]',match:'分别投影 h′₁、h′₂'},
    {label:'对合法位置打分并归一化',value:'s=[0,ln 2] → exp(s)=[1,2] → 权重 [⅓,⅔]',match:'q₂ 取回两个位置的 V'},
    {label:'用权重混合两个 V',value:'z₂=⅓×1+⅔×2=5/3',match:'⅓ × V₁'},
    {label:'投影回两维',value:'y′₂=(5/3)×(0,3)=(0,5)',match:'输出投影和残差'},
    {label:'加回注意力层输入',value:'h′₂+y′₂=(1,2)+(0,5)=(1,7)，交给后续子层',match:'加回 attention 输入'}
  ],
  kda: () => [
    {label:'确定矩阵形状和读写顺序',value:'每头状态为 2×1；先衰减、按 k 修正，再用 q 读更新后的状态',match:'每个头维护 S'},
    {label:'读取两个隐藏向量',value:'x₁=(4,3,10)，x₂=(1,0,5)',match:'隐藏向量产生 q、k、v 和门'},
    {label:'投影并归一化 q、k',value:'q₁=q₂=(0.8,0.6)，k₁=(0.8,0.6)，k₂=(1,0)，v₁=10，v₂=5',match:'设 x=(a,b,c)'},
    {label:'由门投影算保留率与写入量',value:'g=(0,ln 3) → α=(½,¼)；Wβ=0 → β=½',match:'逐通道门 α'},
    {label:'t₁ 写入并读出',value:'S₀=(0,0)ᵀ，δ₁=10 → S₁=(4,3)ᵀ → o₁=5',match:'t₁ 写入空的 2×1 记忆'},
    {label:'t₂ 逐行衰减旧状态',value:'D₂=diag(½,¼) S₁=(2,0.75)ᵀ',match:'t₂ 衰减两行，再纠正预测误差'},
    {label:'以 k₂ 预测并求误差',value:'D₂ᵀk₂=2，δ₂=v₂−2=3',match:'预测 D₂ᵀk₂'},
    {label:'沿 key 方向写回误差',value:'βk₂δ₂ᵀ=(1.5,0)ᵀ → S₂=(3.5,0.75)ᵀ',match:'外积写回 S₂'},
    {label:'以 q₂ 读取两行',value:'o₂=S₂ᵀq₂=0.8×3.5+0.6×0.75=3.25',match:'用 q₂ 读，再映射回隐藏空间'},
    {label:'归一化并应用输出门',value:'RMSNorm(3.25)=1，输出门 σ(0)=½，乘门后为 ½',match:'RMSNorm 增益'},
    {label:'做输出投影',value:'y₂=½×(2,0,−2)=(1,0,−1)',match:'y₂=½×Wₒ'},
    {label:'加回本层输入',value:'x₂+y₂=(1,0,5)+(1,0,−1)=(2,0,4)，交给后续子层',match:'加回本层输入 x₂'}
  ]
});

Object.assign(runSteps, {
  mla: () => [
    {label:'压缩内容', match:'压缩内容 ·', value:'3 行隐藏向量乘图中的降维矩阵，得到每个位置共享的 c₁=(1,0)、c₂=(0,2)、c₃=(1,1)。'},
    {label:'旋转位置键', match:'另投影位置键', value:'三份位置键都从 (1,0) 出发，按 0°、90°、180° 旋转，分别得到 (1,0)、(0,1)、(−1,0)。'},

  function diagram(svg,w,n) {

      hp.text(15.5,y,String(i+1),{size:12,anchor:'middle'});

    },
    move:(i,node,dx,dy,opts)=>transform(i,node,t=>'translate('+dx*(1-t)+' '+dy*(1-t)+')',opts),
    turn:(i,node,cx,cy,a,opts)=>transform(i,node,t=>'rotate('+a*(1-t)+' '+cx+' '+cy+')',opts),

    },
    change:(i,cb,opts)=>register(i,cb,opts),
    onSelect:fn=>{onSelect=fn;},
    lens:(i,from,to)=>{lensBands[i]=[from,to];},
    finish:h=>{height=h;},
    apply(i,t){if(i>=0)for(const f of layers[i].frames)f(t);},

        copy=S('use',{href:'#attention-art'});const crop=S('g',{'clip-path':'url(#live-crop)'});crop.append(copy);lens.append(crop);
        const p=painter(lens,w);
        divider=p.line(5,0,w-5,0,{stroke:'line'});
        divider.setAttribute('data-live-divider','');
        overviewLabel=p.text(6,0,'全流程 · 点图中步骤可重播',{size:12,tone:'dim'});
        svg.append(lens);
      }
      opened=i>=0&&enable;
      let pad=0;
      if(opened){
        const from=lensBands[i]?.[0]??Math.max(0,layers[i].title.y-16);
        const to=lensBands[i]?.[1]??(layers[i+1]?layers[i+1].title.y-19:height);
        const detailHeight=Math.max(20,to-from+2);
        cut.setAttribute('height',detailHeight);
        copy.setAttribute('transform','translate(0 '+(-from)+')');
        divider.setAttribute('y1',detailHeight+5);divider.setAttribute('y2',detailHeight+5);
        overviewLabel.setAttribute('y',detailHeight+24);
        pad=detailHeight+36;
      }
      lens.setAttribute('display',opened?'inline':'none');
      whole.setAttribute('transform','translate(0 '+pad+')');
      svg.setAttribute('viewBox','0 0 '+w+' '+(height+pad));svg.style.height=(height+pad)+'px';
    },
    activate(fn){body.addEventListener('click',e=>{
      const part=e.target.closest('[data-part]');if(part)fn(Number(part.dataset.part));
    });},
    ready(){
      layers.forEach((l,i)=>{
        if(!l.title||!l.frames.length)throw new Error('缺少执行阶段 '+(i+1));
        l.layer.setAttribute('data-motions',l.frames.length);
        for(const f of l.frames)f(1);
      });
      return height;
    }
  };
  return d;
}

      problem:'各层的查询需求不同，一直沿用旧位置可能错过本层需要的信息。Reindex 保留共享缓存，用自己的索引 Q 重新选择位置。',
      description:'接收主 KV、索引 K、候选池 → 本层新索引 Q → 候选内重选 Top-K → 本层主 Q + 局部 KV → 注意力输出。',
      cost:'省去重建共享缓存，保留本层重选能力。候选池限定搜索范围；Top-K 决定实际读取位置，并传给 Reuse。'},
    {name:'Reuse',
      problem:'相邻层若选中的位置相近，反复索引和 Top-K 会重复工作。Reuse 沿用最近一次选择，进一步减少索引开销。',
      description:'接收主 KV + 最近 Full / Reindex 的 Top-K → 读取这些位置 → 本层主 Q + 局部 KV → 新注意力权重 → 输出。',
      cost:'省去索引 Q、索引打分和 Top-K；仍重新计算本层注意力与输出，因此输出会随本层输入变化。'}
  ];
  const DURATION=1800,HOLD=550;
  let id='csa2',param=0,steps=[],index=-1,art=null,svg=null,auto=false,paused=false,elapsed=0,raf=0,last=0,detail=false,width=0;
  function displayControls(){
    const end=index===steps.length-1,s=steps[index];
    el('next').disabled=end;el('prev').disabled=index<0;el('reset').disabled=index<0;
    el('play').textContent=auto?'暂停':paused?'继续执行':end?'重新自动执行':'自动执行';
    el('play').setAttribute('aria-pressed',String(auto));
    el('step').textContent=s?'第 '+(index+1)+' / '+steps.length+' 步　'+s.label:'教学算例 · 全 '+steps.length+' 步';
    el('result').textContent=s?'。'+s.value:'。点击执行下一步，或点图中某一步重播。';
  }
  function persist(){
    window.openai?.setWidgetState?.({modelContent:{mechanism:id,...(id==='csa2'?{csa2Mode:modes[param].name}:{})},privateContent:{platesVersion:4,param,stepIndex:index}})?.catch?.(()=>{});
  }
  function frameAt(t){
    if(!art)return;
    art.apply(index,t);svg.dataset.phase=String(t);
  }
  function cancelTick(){cancelAnimationFrame(raf);raf=0;last=0;}
  function tick(now){
    raf=0;
    if(!last)last=now;
    elapsed+=Math.max(0,now-last);last=now;
    frameAt(reduce.matches?1:Math.min(1,elapsed/DURATION));
    if(auto&&elapsed>=DURATION+HOLD){
      if(index<steps.length-1){selectStep(index+1,true,true);return;}
      auto=false;displayControls();persist();
    }
    if(auto||(!paused&&elapsed<DURATION))raf=requestAnimationFrame(tick);else last=0;
  }
  function startTick(){if(!raf&&!paused&&(auto||(!reduce.matches&&elapsed<DURATION)))raf=requestAnimationFrame(tick);}
  function selectStep(i,animate,save){
    cancelTick();
    if(index>=0)art?.apply(index,1);
    index=Math.max(-1,Math.min(steps.length-1,i));paused=false;
    elapsed=index>=0&&animate&&(auto||!reduce.matches)?0:DURATION;
    art?.focus(index);art?.inspect(index,detail);
    frameAt(index<0||!animate||reduce.matches?1:0);
    displayControls();if(index>=0)startTick();if(save)persist();
  }
  function manual(i,fromDiagram=false){
    auto=false;
    if(!fromDiagram)detail=i>=0;
    selectStep(i,true,true);
  }
  el('next').onclick=()=>manual(index+1);el('prev').onclick=()=>manual(index-1);el('reset').onclick=()=>manual(-1);
  el('play').onclick=()=>{
    if(auto){auto=false;paused=true;cancelTick();displayControls();persist();return;}
    auto=true;detail=true;
    if(paused){paused=false;art.inspect(index,true);displayControls();startTick();return;}
    if(index<0||index===steps.length-1){selectStep(0,true,true);return;}
    if(elapsed>=DURATION){selectStep(index+1,true,true);return;}
    art.inspect(index,true);displayControls();startTick();
  };
  function draw(){
    const w=host.clientWidth;if(!w)return;
    width=w;svg=S('svg',{class:'plate-svg',role:'img'});
    svg.prepend(S('title',{},modelSelect.selectedOptions[0].textContent+(id==='csa2'?' · '+modes[param].name:'')),S('desc',{},steps.map(s=>s.label+'。'+s.value).join(' ')));
    host.replaceChildren(svg);art=diagram(svg,w,steps.length);scenes[id](art,param);art.ready();
    art.focus(index);art.inspect(index,detail);frameAt(index<0||reduce.matches?1:Math.min(1,elapsed/DURATION));
    art.activate(i=>manual(i,true));
  }
  function choose(name,n,idx=-1,save=true){
    if(!Object.hasOwn(scenes,name))return;
    cancelTick();auto=false;paused=false;detail=false;elapsed=DURATION;
    id=name;const params=parameters[id];
    const count=id==='csa2'?modes.length:params?.length||1;
    param=Math.max(0,Math.min(count-1,Number.isInteger(n)?n:(defaults[id]||0)));
    steps=runSteps[id](param);index=Math.min(steps.length-1,Math.max(-1,idx));
    modelSelect.value=id;el('param').hidden=!params;
    if(params){slider.max=params.length-1;slider.value=param;slider.setAttribute('aria-valuetext',params[param]);el('paramname').textContent=params[param];}
    el('modes').hidden=id!=='csa2';el('mode-intro').hidden=id!=='csa2';
    if(id==='csa2'){
      root.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(Number(button.dataset.mode)===param)));
      el('mode-description').textContent=modes[param].description;
      el('mode-problem').textContent=modes[param].problem;
      el('mode-cost').textContent=modes[param].cost;
    }
    const sources=el('refs');sources.replaceChildren();
    for(const [label,url] of refs[id]){const a=document.createElement('a');a.href=url;a.textContent=label;a.target='_blank';a.rel='noopener noreferrer';sources.append(a);}
    displayControls();draw();if(save)persist();
  }
  function restore(state){
    const name=state?.modelContent?.mechanism,p=state?.privateContent;
    if(!Object.hasOwn(scenes,name))return;
    const savedMode=modes.findIndex(m=>m.name===state?.modelContent?.csa2Mode);
    const value=name==='csa2'&&p?.platesVersion!==4?0:name==='csa2'&&savedMode>=0?savedMode:Number.isInteger(p?.param)?p.param:defaults[name]||0;
    const n=Math.max(0,Math.min((name==='csa2'?modes.length:parameters[name]?.length||1)-1,value));
    const compatible=[2,3,4].includes(p?.platesVersion)&&(name!=='csa2'||p?.platesVersion===4);
    const i=compatible&&Number.isInteger(p.stepIndex)?Math.max(-1,Math.min(runSteps[name](n).length-1,p.stepIndex)):-1;
    if(id!==name||param!==n)choose(name,n,i,false);
    else if(index!==i){auto=false;detail=false;selectStep(i,false,false);}
  }
  modelSelect.addEventListener('change',()=>choose(modelSelect.value));
  slider.addEventListener('input',()=>choose(id,Number(slider.value)));
  root.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>choose('csa2',Number(button.dataset.mode))));
  choose(id,param,-1,false);restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  new ResizeObserver(()=>{if(host.clientWidth!==width)draw();}).observe(host);
  reduce.addEventListener('change',()=>{if(reduce.matches){elapsed=DURATION;frameAt(1);}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelTick();}else if(index>=0)startTick();});
  window.addEventListener('pagehide',()=>{cancelTick();auto=false;});
})();
</script>

}

  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);

  border-color: #fff;
  background: #fff;
}

.form-switch .form-check-input:checked {
  background: var(--blue);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
  outline: none;
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  flex: 1;
  margin: 0;
  padding: 0;
  border: 0;
  accent-color: var(--primary);
  height: calc(12px + 2 * var(--control-spacing, 12px));
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  outline: none;
  border-radius: var(--radius-full);
  color: var(--foreground);
  background: transparent;
}

.form-range::-webkit-slider-runnable-track {
  background: var(--form-range-track, var(--border));
  height: 2px;
  border-radius: var(--radius-full);
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  margin-top: -9px;
  border-color: transparent;
  background: currentColor;
  box-shadow: var(--shadow-sm);
}

.form-range:focus-visible::-webkit-slider-runnable-track {
  outline: 2px auto Highlight;
  outline-color: -webkit-focus-ring-color;
}

.form-range::-moz-range-track {
  background: var(--form-range-track, var(--border));
  height: 2px;
  border-radius: var(--radius-full);
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  border-color: transparent;
  background: currentColor;
  box-shadow: var(--shadow-sm);
}

.form-range:focus-visible::-moz-range-thumb {

}

.form-range:disabled {

.btn:not(.btn-primary, .viz-tile):is(

.viz-carousel-controls :is(button, summary):focus-visible {

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

    &lt;ol data-list&gt;&lt;/ol&gt;
    &lt;p&gt;本例设置 &lt;code&gt;offload_backend=&quot;prefetch&quot;&lt;/code&gt;、每 2 层选末 1 层、预取步长 2，跟踪一个同名、同规格的 ND 参数。卸载层序列为 L1、L3、L5、L7。L1 用完 A 后，按这个序列向后两项，目标是 L5。&lt;/p&gt;
    &lt;p&gt;&lt;code&gt;wait_prefetch&lt;/code&gt; 使计算流等本层拷贝完成。&lt;code&gt;start_prefetch&lt;/code&gt; 让拷贝流等待旧层读完才覆盖槽。图中“填入”表示对应拷贝完成后的值，两种流可以并行执行。CPU 保留全部四份权重。&lt;/p&gt;
    &lt;p&gt;加载完成后，基类绑定静态槽并提交首批预取。Ascend 检查格式、按需重绑 NZ 槽，再提交首批预取。图中将两次初始化预取合并为第 ③ 步。&lt;/p&gt;
    &lt;div class=&quot;wf-links text-small&quot;&gt;
      &lt;a target=&quot;_blank&quot; rel=&quot;noreferrer&quot; href=&quot;https://github.com/vllm-project/vllm-ascend/blob/94e3e25f836d79b5ee5c1aed257999ee61d10875/vllm_ascend/model_executor/offloader/base.py#L11-L28&quot;&gt;Ascend 后端&lt;/a&gt;
      &lt;a target=&quot;_blank&quot; rel=&quot;noreferrer&quot; href=&quot;https://github.com/vllm-project/vllm/blob/295c062db8a48ea73bbd05d1174cb37d24bf86f9/vllm/model_executor/offloader/prefetch.py#L647-L677&quot;&gt;CPU 参数存储&lt;/a&gt;
      &lt;a target=&quot;_blank&quot; rel=&quot;noreferrer&quot; href=&quot;https://github.com/vllm-project/vllm-ascend/blob/94e3e25f836d79b5ee5c1aed257999ee61d10875/vllm_ascend/model_executor/offloader/prefetch.py#L173-L190&quot;&gt;首批预取&lt;/a&gt;
      &lt;a target=&quot;_blank&quot; rel=&quot;noreferrer&quot; href=&quot;https://github.com/vllm-project/vllm/blob/295c062db8a48ea73bbd05d1174cb37d24bf86f9/vllm/model_executor/offloader/prefetch.py#L231-L265&quot;&gt;层的输入与输出&lt;/a&gt;
      &lt;a target=&quot;_blank&quot; rel=&quot;noreferrer&quot; href=&quot;https://github.com/vllm-project/vllm/blob/295c062db8a48ea73bbd05d1174cb37d24bf86f9/vllm/model_executor/offloader/prefetch.py#L529-L569&quot;&gt;H2D 与事件&lt;/a&gt;
    &lt;/div&gt;
  &lt;/details&gt;
&lt;/section&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;weights-flow&quot;);
  const get = selector =&gt; root.querySelector(selector);
  const svg = get(&quot;.wf-diagram&quot;);
  const colors = {copy:&quot;var(--viz-series-2)&quot;,weight:&quot;var(--viz-series-3)&quot;,hidden:&quot;var(--viz-series-1)&quot;,muted:&quot;var(--muted-foreground)&quot;};
  const base = [1,2];
  const layers = [
    {id:1, w:[[2,0],[0,1]], slot:&quot;A&quot;, fill:[3,9], read:4},
    {id:3, w:[[1,0],[0,2]], slot:&quot;B&quot;, fill:[3,11], read:6},
    {id:5, w:[[3,0],[0,1]], slot:&quot;A&quot;, fill:[5], read:8},
    {id:7, w:[[1,0],[0,3]], slot:&quot;B&quot;, fill:[7], read:10}
  ];
  const layer = id =&gt; layers.find(item=&gt;item.id===id);
  let h = base;
  for (const item of layers) {
    item.input = h;
    h = item.w[0].map((_,j)=&gt;h.reduce((v,a,i)=&gt;v+a*item.w[i][j],0));
    item.output = h;
  }
  const vec = v =&gt; &quot;[&quot;+v.join(&quot;, &quot;)+&quot;]&quot;;
  const numbers = [&quot;&quot;,&quot;①&quot;,&quot;②&quot;,&quot;③&quot;,&quot;④&quot;,&quot;⑤&quot;,&quot;⑥&quot;,&quot;⑦&quot;,&quot;⑧&quot;,&quot;⑨&quot;,&quot;⑩&quot;,&quot;⑪&quot;];
  const stages = [
    &quot;沿橙线找权重来源，沿绿线找读槽的层，沿蓝线追踪同一个 token 的 hidden。&quot;,
    &quot;建模时将选中的参数转存 CPU。权重加载、后处理完成后，CPU 保留四份权重。&quot;,
    &quot;NPU 分配两个静态槽。L1 和 L5 的参数绑定 A，L3 和 L7 的参数绑定 B。&quot;,
    &quot;拷贝流将 W1 填入 A、W3 填入 B。上游 L0 给 L1 的激活是 [1, 2]。&quot;,
    &quot;L1 从 A 读 W1，将上游的 [1, 2] 变成 [2, 2]，交给 L2。&quot;,
    &quot;L1 用完 A 后，CPU 的 W5 可以覆盖 A。L2 将 [2, 2] 传给 L3。&quot;,
    &quot;L3 从 B 读 W3，将 [2, 2] 变成 [2, 4]，交给 L4。&quot;,
    &quot;L3 用完 B 后，CPU 的 W7 可以覆盖 B。L4 将 [2, 4] 传给 L5。&quot;,
    &quot;L5 等 W5 到位后从 A 读取，将 [2, 4] 变成 [6, 4]，交给 L6。&quot;,
    &quot;L5 用完 A 后，拷贝流为下轮填入 W1。L6 将 [6, 4] 传给 L7。&quot;,
    &quot;L7 从 B 读 W7，将 [6, 4] 变成 [6, 12]，这个 hidden 成为后续模型算子的输入。&quot;,
    &quot;L7 用完 B 后，拷贝流为下轮填入 W3。A、B 又分别装有 W1、W3。&quot;
  ];
  let step = 0, timer = null, widthUsed = 0;
  const isActive = ids =&gt; step===0 || ids.includes(step);
  const exists = first =&gt; step===0 || step&gt;=first;
  const ns = &quot;http://www.w3.org/2000/svg&quot;;
  function add(tag, attrs, parent=svg, content) {
    const node = document.createElementNS(ns,tag);
    for(const [k,v] of Object.entries(attrs)) node.setAttribute(k,String(v));
    if(content!==undefined) node.textContent=content;
    parent.append(node);
    return node;
  }
  function txt(x,y,value,cls=&quot;&quot;,anchor=&quot;middle&quot;) {
    return add(&quot;text&quot;,{x,y,class:cls,&quot;text-anchor&quot;:anchor,&quot;dominant-baseline&quot;:&quot;middle&quot;},svg,value);
  }
  function box(x,y,w,height,type,ids) {
    const on = isActive(ids);
    add(&quot;rect&quot;,{x,y,width:w,height,rx:6,fill:&quot;var(--background)&quot;,stroke:on?colors[type]:&quot;var(--border)&quot;,&quot;stroke-width&quot;:on?1.6:1});
    if(step &amp;&amp; on) add(&quot;rect&quot;,{x,y,width:w,height,rx:6,fill:colors[type],&quot;fill-opacity&quot;:.08});
  }
  function owner(x,y,w,height,title) {
    add(&quot;rect&quot;,{x,y,width:w,height,rx:9,fill:&quot;none&quot;,stroke:&quot;var(--muted-foreground)&quot;,&quot;stroke-opacity&quot;:.7,&quot;stroke-width&quot;:1.2,&quot;stroke-dasharray&quot;:&quot;6 5&quot;});
    txt(x+w/2,y+16,title,&quot;label&quot;);
  }
  function badge(x,y,ids,type) {
    const label = step &amp;&amp; ids.includes(step) ? String(step) : ids.join(&quot;·&quot;);
    const w = Math.max(18,label.length*7+7);
    add(&quot;rect&quot;,{x:x-w/2,y:y-9,width:w,height:18,rx:9,fill:&quot;var(--background)&quot;,stroke:isActive(ids)?colors[type]:&quot;var(--border)&quot;});
    txt(x,y+.7,label,&quot;text-small&quot;);
  }
  const reduceMotion = window.matchMedia(&quot;(prefers-reduced-motion: reduce)&quot;);
  function edge(points,type,ids,animate) {
    const on = isActive(ids), col = on?type:&quot;idle&quot;;
    const d = points.map(([x,y],i)=&gt;(i?&quot;L&quot;:&quot;M&quot;)+x+&quot; &quot;+y).join(&quot; &quot;);
    add(&quot;path&quot;,{d,fill:&quot;none&quot;,stroke:on?colors[type]:&quot;var(--border)&quot;,&quot;stroke-width&quot;:on?1.7:1.1,
      &quot;stroke-linejoin&quot;:&quot;round&quot;,&quot;marker-end&quot;:&quot;url(#wf-arrow-&quot;+col+&quot;)&quot;});
    if(step &amp;&amp; on &amp;&amp; animate &amp;&amp; !reduceMotion.matches) {
      const p = add(&quot;circle&quot;,{r:3.2,fill:colors[type],&quot;pointer-events&quot;:&quot;none&quot;});
      const motion=add(&quot;animateMotion&quot;,{path:d,dur:&quot;.72s&quot;,begin:&quot;indefinite&quot;,repeatCount:1},p);
      motion.addEventListener(&quot;endEvent&quot;,()=&gt;p.remove(),{once:true});
      motion.beginElement();
    }
  }
  function matrix(x,y,rows,quiet) {
    const ink=quiet?&quot;var(--border)&quot;:&quot;var(--muted-foreground)&quot;;
    add(&quot;path&quot;,{d:&quot;M&quot;+(x-14)+&quot; &quot;+(y-8)+&quot;h-4v35h4 M&quot;+(x+14)+&quot; &quot;+(y-8)+&quot;h4v35h-4&quot;,fill:&quot;none&quot;,stroke:ink});
    rows.forEach((row,i)=&gt;row.forEach((v,j)=&gt;txt(x-7+14*j,y+18*i,v,&quot;mono text-small&quot;)));
  }
  function slotContent(s) {
    if(!step) return s===&quot;A&quot; ? &quot;轮用 W1、W5&quot; : &quot;轮用 W3、W7&quot;;
    if(step&lt;2) return &quot;·&quot;;
    if(step===2) return &quot;待填充&quot;;
    const latest=layers.filter(l=&gt;l.slot===s).flatMap(l=&gt;l.fill.map(i=&gt;[i,l.id])).filter(([i])=&gt;i&lt;=step).sort((a,b)=&gt;b[0]-a[0])[0];
    return &quot;当前装有 W&quot;+latest[1];
  }
  function renderGraph(width,animate=false) {
    widthUsed=width;
    svg.replaceChildren();
    const compact=width&lt;540, mid=width/2;
    const center=[width*.25,width*.75];
    const nodeWidth=Math.min(214, width*.5-(compact?52:74));
    const slotWidth=Math.min(212,width*.5-(compact?32:64));
    const side=(i)=&gt;center[i]-nodeWidth/2;
    const sx=(i)=&gt;center[i]-slotWidth/2;
    const rail=[12,width-12];
    const cardPad=10, cardGap=6, cpuW=(width-2*cardPad-3*cardGap)/4;
    const cpuOrder=[1,5,3,7];
    const yslot=255, top=398, bottom=536, ch=83;
    svg.setAttribute(&quot;viewBox&quot;,&quot;0 0 &quot;+width+&quot; 721&quot;); svg.setAttribute(&quot;height&quot;,721);
    add(&quot;title&quot;,{id:&quot;wf-title&quot;},svg,&quot;CPU 权重、NPU 静态槽及模型层的输入输出&quot;);
    add(&quot;desc&quot;,{id:&quot;wf-desc&quot;},svg,&quot;CPU 保存四个二乘二权重。W1、W5 进入槽 A，W3、W7 进入槽 B。四个层按 L1、L3、L5、L7 顺序从所属槽读权重，依次把 hidden 从 [1,2] 变成 [2,2]、[2,4]、[6,4]、[6,12]。&quot;);
    const defs=add(&quot;defs&quot;,{});
    for(const [key,col] of Object.entries({...colors,idle:&quot;var(--border)&quot;})) {
      const m=add(&quot;marker&quot;,{id:&quot;wf-arrow-&quot;+key,markerWidth:8,markerHeight:8,refX:7.3,refY:4,orient:&quot;auto&quot;,markerUnits:&quot;userSpaceOnUse&quot;},defs);
      add(&quot;path&quot;,{d:&quot;M0 0 L8 4 L0 8 L2.5 4 Z&quot;,fill:col},m);
    }
    owner(2,66,width-4,108,&quot;CPU 内存 · 加载后的权重&quot;);
    owner(2,222,width-4,495,compact?&quot;NPU 设备&quot;:&quot;NPU · 单个 worker&quot;);
    box(mid-97,1,194,32,&quot;copy&quot;,[1]);
    txt(mid,18,&quot;建模时选中的 NPU 参数&quot;,&quot;label&quot;);
    edge([[mid,33],[mid,65]],&quot;copy&quot;,[1],animate);
    badge(mid,49,[1],&quot;copy&quot;);
    txt(mid+16,50,&quot;转存 CPU&quot;,&quot;text-small&quot;,&quot;start&quot;);
    cpuOrder.forEach((id,i)=&gt;{
      const l=layer(id), x=cardPad+i*(cpuW+cardGap), cx=x+cpuW/2;
      const col=i&lt;2?0:1, port=center[col]+(i%2?13:-13);
      edge([[cx,164],[cx,197],[port,197],[port,yslot-1]],&quot;copy&quot;,l.fill,animate);
      badge(cx,181,l.fill,&quot;copy&quot;);
      box(x,95,cpuW,69,&quot;weight&quot;,[1,...l.fill]);
      txt(cx,110,&quot;W&quot;+id,&quot;label&quot;); matrix(cx,133,l.w,false);
    });
    txt(mid,207,&quot;H2D 预取&quot;,&quot;text-small&quot;);
    for(let i=0;i&lt;2;i++) {
      const s=i?&quot;B&quot;:&quot;A&quot;, targets=layers.filter(l=&gt;l.slot===s);
      const activeSlots=[2,...targets.flatMap(l=&gt;[l.read,...l.fill])];
      const origin=sx(i)+(i?slotWidth:0), nodeEdge=side(i)+(i?nodeWidth:0);
      const y0=yslot+25;
      const junctionX=rail[i];
      // One physical slot fans out to its two readers. Each branch is active at its own read.
      edge([[origin,y0],[junctionX,y0],[junctionX,top+ch/2],[nodeEdge,top+ch/2]],&quot;weight&quot;,[targets[0].read],animate);
      edge([[origin,y0],[junctionX,y0],[junctionX,bottom+ch/2],[nodeEdge,bottom+ch/2]],&quot;weight&quot;,[targets[1].read],animate);
      if(step===targets[0].read) edge([[origin,y0],[junctionX,y0],[junctionX,top+ch/2],[nodeEdge,top+ch/2]],&quot;weight&quot;,[targets[0].read],false);
      box(sx(i),yslot,slotWidth,54,&quot;weight&quot;,activeSlots);
      txt(center[i],yslot+15,&quot;静态槽 &quot;+s,&quot;label&quot;);
      txt(center[i],yslot+37,slotContent(s),&quot;text-small&quot;);
      badge(sx(i)+8,yslot,[2],&quot;weight&quot;);
    }
    const gateW=Math.min(nodeWidth,160);
    box(center[0]-gateW/2,330,gateW,46,&quot;hidden&quot;,[3,4]);
    txt(center[0],344,&quot;上游 L0 输出&quot;,&quot;label&quot;);
    txt(center[0],364,exists(3)?vec(base):&quot;·&quot;,&quot;mono&quot;);
    edge([[center[0],376],[center[0],top-1]],&quot;hidden&quot;,[4],animate);
    const sendToNext=(y,ids,label)=&gt;{
      edge([[side(0)+nodeWidth,y],[side(1)-1,y]],&quot;hidden&quot;,ids,animate);
      txt(mid,y-20,label,&quot;text-small&quot;);
      badge(mid,y,ids,&quot;hidden&quot;);
    };
    sendToNext(top+ch/2,[5],&quot;经 L2&quot;);
    sendToNext(bottom+ch/2,[9],&quot;经 L6&quot;);
    const yturn=504;
    edge([[center[1],top+ch],[center[1],yturn],[center[0],yturn],[center[0],bottom-1]],&quot;hidden&quot;,[7],animate);
    badge(mid,yturn,[7],&quot;hidden&quot;);
    txt(mid,yturn-18,compact?&quot;经 L4&quot;:&quot;经 L4 传给 L5&quot;,&quot;text-small&quot;);
    for(const l of layers) {
      const i=l.slot===&quot;A&quot;?0:1, x=side(i), y=l.id&lt;=3?top:bottom;
      const inputStep=l.read-1;
      box(x,y,nodeWidth,ch,&quot;hidden&quot;,[l.read]);
      const readLabel=width&lt;310?&quot; 读 &quot;:&quot; · 读槽 &quot;;
      txt(center[i],y+15,&quot;L&quot;+l.id+readLabel+l.slot,&quot;label&quot;);
      txt(center[i],y+35,&quot;输入 &quot;+(exists(inputStep)?vec(l.input):&quot;·&quot;),&quot;text-small&quot;);
      txt(center[i],y+51,&quot;h × W&quot;+l.id,&quot;mono text-small&quot;);
      txt(center[i],y+68,&quot;输出 &quot;+(exists(l.read)?vec(l.output):&quot;·&quot;),&quot;text-small&quot;);
      badge(x+8,y,[l.read],&quot;hidden&quot;);
    }
    const outY=656;
    edge([[center[1],bottom+ch],[center[1],outY-1]],&quot;hidden&quot;,[10],animate);
    const finalWidth=Math.min(width*.46,215);
    box(center[1]-finalWidth/2,outY,finalWidth,48,&quot;hidden&quot;,[10]);
    txt(center[1],outY+15,&quot;下游算子的输入&quot;,&quot;label&quot;);
    txt(center[1],outY+35,exists(10)?vec(layer(7).output):&quot;·&quot;,&quot;mono&quot;);
  }
  function drawFocus(){
    const panel=get(&quot;[data-focus]&quot;), canvas=get(&quot;.wf-focus&quot;);
    if(!panel.open) return;
    const w=canvas.getBoundingClientRect().width;
    if(w&lt;1) return;
    const mid=w/2, gap=32, card=(w-gap-8)/2, left=4+card/2, right=w-4-card/2;
    canvas.replaceChildren();
    add(&quot;desc&quot;,{},canvas,&quot;计算流完成 L1 后记录 fork_event，拷贝流等待该事件再用 W5 覆盖槽 A。L2 到 L4 的计算与 H2D 可以重叠。拷贝流记录 copy_done，计算流的 wait_prefetch 等到它完成后才运行 L5。&quot;);
    const wrap=(value,width)=&gt;{
      const probe=add(&quot;text&quot;,{class:&quot;text-small&quot;,visibility:&quot;hidden&quot;},canvas),rows=[];let line=&quot;&quot;;
      for(const c of value){probe.textContent=line+c;if(line&amp;&amp;probe.getComputedTextLength()&gt;width){rows.push(line);line=c;}else line+=c;}
      if(line)rows.push(line);probe.remove();return rows;
    };
    const prepared=lines=&gt;lines.flatMap(line=&gt;wrap(line,card-16));
    const group=(x,y,kind,lines,height)=&gt;{
      add(&quot;rect&quot;,{x:x-card/2,y,width:card,height,rx:6,fill:&quot;var(--background)&quot;,stroke:colors[kind],&quot;stroke-width&quot;:1.5},canvas);
      prepared(lines).forEach((line,i)=&gt;add(&quot;text&quot;,{x,y:y+17+i*18,&quot;dominant-baseline&quot;:&quot;middle&quot;,&quot;text-anchor&quot;:&quot;middle&quot;,class:&quot;text-small&quot;},canvas,line));
    };
    const link=(d,kind,control=false)=&gt;{
      add(&quot;path&quot;,{d,fill:&quot;none&quot;,stroke:colors[kind],&quot;stroke-width&quot;:1.5,&quot;stroke-dasharray&quot;:control?&quot;4 3&quot;:&quot;none&quot;,&quot;marker-end&quot;:&quot;url(#wf-arrow-&quot;+kind+&quot;)&quot;},canvas);
    };
    [ [left,&quot;计算流&quot;],[right,&quot;拷贝流&quot;] ].forEach(([x,title])=&gt;add(&quot;text&quot;,{x,y:17,&quot;text-anchor&quot;:&quot;middle&quot;,class:&quot;label&quot;},canvas,title));
    const rows=[
      [[&quot;L1 读完槽 A&quot;,&quot;h1=&quot;+vec(layer(1).output),&quot;start_prefetch&quot;,&quot;输入：h1&quot;,&quot;目标：L5&quot;,&quot;记录 fork_event&quot;],[&quot;wait fork_event&quot;,&quot;① 等旧层读完&quot;,&quot;才允许覆盖 A&quot;]],
      [[&quot;L2 → L3 → L4&quot;,&quot;继续计算激活&quot;,&quot;h4=&quot;+vec(layer(3).output)],[&quot;CPU 权重 W5&quot;,&quot;H2D → 静态槽 A&quot;,&quot;异步提交拷贝&quot;]],
      [[&quot;wait_prefetch&quot;,&quot;目标层 L5&quot;,&quot;② 等待事件&quot;,&quot;copy_done&quot;,&quot;h4 保留在本流&quot;],[&quot;记录 copy_done&quot;,&quot;事件完成代表&quot;,&quot;W5 已拷贝到 A&quot;]],
      [[&quot;L5 读 h4 + W5&quot;,&quot;h5=&quot;+vec(layer(5).output),&quot;传给 L6&quot;],[&quot;A 当前为 W5&quot;,&quot;L5 读完后再为&quot;,&quot;下轮预取 W1&quot;]]
    ];
    const boxes=[];let y=35;
    rows.forEach((row,i)=&gt;{
      if(i===1){add(&quot;text&quot;,{x:mid,y:y+12,&quot;text-anchor&quot;:&quot;middle&quot;,class:&quot;text-small quiet&quot;},canvas,&quot;两支可重叠&quot;);y+=35;}
      const height=Math.max(...row.map(lines=&gt;prepared(lines).length))*18+22;
      if(i===1)add(&quot;rect&quot;,{x:1,y:y-9,width:w-2,height:height+18,rx:8,fill:&quot;none&quot;,stroke:colors.muted,&quot;stroke-dasharray&quot;:&quot;3 4&quot;},canvas);
      group(left,y,&quot;hidden&quot;,row[0],height);group(right,y,i===1?&quot;copy&quot;:&quot;muted&quot;,row[1],height);
      boxes.push({y,height});y+=height+40;
    });
    boxes.forEach((b,i)=&gt;{if(i&lt;boxes.length-1){link(`M${left} ${b.y+b.height} V${boxes[i+1].y}`,&quot;hidden&quot;);if(i&lt;2)link(`M${right} ${b.y+b.height} V${boxes[i+1].y}`,i===1?&quot;copy&quot;:&quot;muted&quot;,i!==1);}});
    const a=boxes[0],done=boxes[2];
    link(`M${left+card/2} ${a.y+a.height/2} H${right-card/2}`,&quot;muted&quot;,true);
    link(`M${right-card/2} ${done.y+done.height/2} H${left+card/2}`,&quot;muted&quot;,true);
    [[a,&quot;①&quot;],[done,&quot;②&quot;]].forEach(([b,n])=&gt;add(&quot;text&quot;,{x:mid,y:b.y+b.height/2-10,&quot;text-anchor&quot;:&quot;middle&quot;,class:&quot;text-small&quot;},canvas,n));
    canvas.setAttribute(&quot;viewBox&quot;,&quot;0 0 &quot;+w+&quot; &quot;+y);canvas.setAttribute(&quot;height&quot;,y);
  }
  get(&quot;[data-focus]&quot;).addEventListener(&quot;toggle&quot;,drawFocus);

(() =&gt; {
  const waitFor = async (test, label) =&gt; {

    if (action.mode !== &#x27;prefetch&#x27; || !Number.isInteger(action.step) || action.step &lt; 0 || action.step &gt; 11) {

    }
    const root = await waitFor(() =&gt; document.querySelector(&#x27;#weights-flow&#x27;), &#x27;图初始化&#x27;);
    (await waitFor(() =&gt; root.querySelector(&#x27;[data-action=&quot;overview&quot;]&#x27;), &#x27;全局按钮&#x27;)).click();
    const count = () =&gt; root.querySelector(&#x27;[data-count]&#x27;).textContent;
    await waitFor(() =&gt; count().startsWith(&#x27;全图&#x27;), &#x27;全局状态&#x27;);
    for (let step = 1; step &lt;= action.step; step++) {
      root.querySelector(&#x27;[data-action=&quot;next&quot;]&#x27;).click();
      await waitFor(() =&gt; count() === step + &#x27; / 11&#x27;, &#x27;第 &#x27; + step + &#x27; 步&#x27;);
    }

      const panel = root.querySelector(&#x27;details[data-focus]&#x27;);
      const canvas = root.querySelector(&#x27;svg.wf-focus&#x27;);
      panel.open = true;
      // The shell may reveal its visual pane only after this adapter returns.
      // The original drawFocus intentionally skips a canvas whose width is zero.
      if (canvas.getBoundingClientRect().width &gt; 0) {
        panel.dispatchEvent(new Event(&#x27;toggle&#x27;));
      } else {
        const observer = new ResizeObserver(() =&gt; {
          if (canvas.getBoundingClientRect().width &gt; 0) {

    }

  );

    globalThis.location.pathname,
    globalThis.location.search,

      new TextEncoder().encode(serializedState).length > 16 * 1024

        "Widget state must be a JSON object of at most 16 KiB",

      state == null ||

<script>

    document.body.insertBefore(root,original[0] || dataElement);

    function validState(value) {

      const node = nextVariant?.nodes.find(item => item.id === value.node);
      if (!node || !['chain','visual'].includes(value.screen)) return null;
      const target = value.target === null ? null : Number(value.target);
      if (target !== null && (!Number.isInteger(target) || target < 0 || target >= node.targets.length)) return null;
      return {variant:nextVariant.id,node:node.id,screen:value.screen,target};
    }
    const state = () => ({variant:variant.id,node:selected,screen,target:targetIndex});
    function parseRoute() {
      const query = new URLSearchParams(location.search);

          } else branch.setAttribute('aria-hidden','true');
          const button = make('button',undefined,'cw-node'); button.type = 'button'; button.dataset.cwNode = node.id;
          const childCount = variant.nodes.filter(child => child.parent === node.id).length;
          const label = make('span'); label.append(make('code',node.title),make('small','[' + node.kind + '] ' + node.summary + (childCount ? ' · ' + childCount + ' 个子节点' : '')));
          button.append(make('span',node.number,'cw-number'),label); row.append(branch,button); item.append(row);
          if (hasChildren) { const nested = make('ol',undefined,'cw-tree'); nested.hidden = collapsed.has(node.id); append(nested,node.id); item.append(nested); }
          list.append(item);
        });
      };
      append(top,null); $('.cw-tools strong').textContent = '调用与返回 · ' + variant.nodes.length + ' 节点 / ' + Math.max(...variant.nodes.map(depthOf)) + ' 层';
    }

      $('.cw-note').hidden = !node.note; $('.cw-note').textContent = node.note || '';

      if (variant.provenance === 'teaching') $('.cw-evidence>div').append(make('p','此分支说明教学算法，不表示 vLLM 内存在同名函数。','cw-guide'));

        const repo = variant.repositories[evidence.repo];

        link.href = repo.url + '/blob/' + repo.commit + '/' + evidence.path + '#L' + evidence.line + (evidence.end ? '-L' + evidence.end : '');

    async function invoke(action) {
      if (!frame) {
        if (typeof window.openLessonTarget !== 'function') throw new Error('当前页面缺少步骤入口');
        const work = nativeQueue.then(() => window.openLessonTarget(action));
        nativeQueue = work.catch(() => {});
        return work;
      }
      const deadline = Date.now() + 5000;
      while (!frameReady && Date.now() < deadline) {
        frame.contentWindow?.postMessage({type:'lesson-call-ping'},'*');
        await new Promise(resolve => setTimeout(resolve,80));
      }
      if (!frameReady) throw new Error('内嵌可视化尚未就绪，请稍后重试');
      const id = topic + ':' + ++requestId;
      return new Promise((resolve,reject) => {
        const timer = setTimeout(() => { replies.delete(id); reject(new Error('步骤定位超时')); },8000);
        replies.set(id,{resolve,reject,timer});
        frame.contentWindow.postMessage({type:'lesson-call-open',id,action},'*');
      });
    }
    async function openTarget(index,method = 'push',scroll = true) {
      const target = nodeById(selected).targets[index];
      if (!target) return;
      const currentPage = location.pathname.split('/').at(-1);
      if (target.action.page && target.action.page !== currentPage) {
        if (!['index.html','comparison.html'].includes(target.action.page)) throw new Error('不支持的页面目标');
        const url = new URL(target.action.page,location.href); url.hash = '';
        location.assign(urlFor({...state(),screen:'visual',target:index},url)); return;
      }
      const job = ++revision; busy = true; screen = 'visual'; targetIndex = index; clearError(); render();
      $('.cw-context').textContent = '正在定位：' + target.label;
      try {
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const result = await invoke(target.action);
        if (job !== revision) return;
        $('.cw-context').textContent = '来自节点 ' + nodeById(selected).number + ' · ' + nodeById(selected).title + ' → ' + (result?.label || target.label);
        if (method) remember(method);
        if (scroll) { $('.cw-context').scrollIntoView({block:'start'}); $('.cw-context').focus({preventScroll:true}); }
      } catch (error) {
        if (job === revision) { screen = 'chain'; render(); errorMessage(error); }
      } finally { if (job === revision) { busy = false; root.dataset.cwBusy = 'false'; detail(); } }
    }
    function pauseVisual() {
      if (frame) frame.contentWindow?.postMessage({type:'lesson-call-pause'},'*');
      else window.dispatchEvent(new Event('lesson-pause-visual'));
    }
    function openChain() {
      revision++; busy = false; screen = 'chain'; clearError();
      pauseVisual();
      revealSelected(); buildTree(); render(); remember('push'); scrollSelected();
      root.scrollIntoView({block:'start'});
    }
    root.addEventListener('click',event => {
      const target = event.target.closest('[data-cw-target]');
      if (target) { openTarget(Number(target.dataset.cwTarget)); return; }
      const layer = event.target.closest('[data-cw-view]');
      if (layer) {
        if (layer.dataset.cwView === 'chain') openChain();
        else if (targetIndex !== null) openTarget(targetIndex);
        else { screen = 'visual'; clearError(); render(); remember('push'); }
        return;
      }
      const toggle = event.target.closest('[data-cw-toggle]');
      if (toggle) {
        const id = toggle.dataset.cwToggle;
        if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
        buildTree(); detail(); root.querySelector('[data-cw-toggle="' + id + '"]').focus({preventScroll:true}); return;
      }
      const button = event.target.closest('[data-cw-node],[data-cw-ancestor]');
      if (button) {
        selected = button.dataset.cwNode || button.dataset.cwAncestor; targetIndex = null; clearError();
        if (button.dataset.cwAncestor) { revealSelected(); buildTree(); }
        detail(); remember('push');
        if (button.dataset.cwAncestor) scrollSelected();
        if (matchMedia('(max-width:760px)').matches) { $('.cw-detail').scrollIntoView({block:'start'}); $('.cw-detail').focus({preventScroll:true}); }
      }
    });
    $('[data-cw-expand]').addEventListener('click',() => { collapsed.clear(); buildTree(); detail(); });
    $('[data-cw-depth]').addEventListener('click',() => { resetTree(); buildTree(); detail(); });
    $('[data-cw-fold]').addEventListener('click',() => { collapsed = new Set(variant.nodes.filter(node => node.parent !== null).map(node => node.id)); buildTree(); detail(); });
    $('.cw-variant select').addEventListener('change',event => {
      variant = variants.get(event.target.value); selected = variant.entry || variant.nodes[0].id; targetIndex = null;
      resetTree(); buildTree(); clearError(); render(); remember('push');
    });
    for (const name of ['click','change']) document.addEventListener(name,event => {
      if (event.isTrusted && !busy && screen === 'visual' && event.target.closest('.lesson-original') && event.target.closest('button,select,input')) markEdited();
    },true);
    window.addEventListener('popstate',() => {
      if (routeKey() === lastRoute) return;
      lastRoute = routeKey(); revision++; busy = false;
      const next = parseRoute() || {variant:fallback.id,node:fallback.entry || fallback.nodes[0].id,screen:'chain',target:null};
      applyState(next); resetTree(); buildTree(); render(); clearError();
      if (screen === 'visual' && targetIndex !== null) openTarget(targetIndex,null,false);
      else if (screen === 'chain') { pauseVisual(); scrollSelected(); }
    });
    resetTree(); buildTree(); render();
    if (screen === 'visual' && targetIndex !== null) openTarget(targetIndex,null,false);
    else if (screen === 'chain') scrollSelected();
    document.documentElement.dataset.callChainReady = 'true';
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',mount,{once:true}); else mount();
})();
</script>

  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
  border-color: #fff;
  background: #fff;
}

.form-switch .form-check-input:checked {
  background: var(--blue);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
  outline: none;
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  flex: 1;
  margin: 0;
  padding: 0;
  border: 0;
  accent-color: var(--primary);

  outline: none;
  border-radius: var(--radius-full);
  color: var(--foreground);
  background: transparent;
}

  height: 2px;
  border-radius: var(--radius-full);
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  margin-top: -9px;
  border-color: transparent;
  background: currentColor;
  box-shadow: var(--shadow-sm);
}

.form-range:focus-visible::-webkit-slider-runnable-track {
  outline: 2px auto Highlight;
  outline-color: -webkit-focus-ring-color;
}

.form-range::-moz-range-track {
  background: var(--form-range-track, var(--border));
  height: 2px;
  border-radius: var(--radius-full);
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  border-color: transparent;
  background: currentColor;
  box-shadow: var(--shadow-sm);
}

.form-range:focus-visible::-moz-range-thumb {
  outline: 2px solid Highlight;
  outline-offset: 2px;
}

.form-range:disabled {
  opacity: 1;

}

.btn:not(.btn-primary, .viz-tile):is(

  [aria-selected=&quot;true&quot;],

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible,

}

.viz-carousel-controls :is(button, summary):focus-visible {

  outline-offset: 2px !important;
}

/* Web recipes are the default, including on renderers without inline style queries. */
@supports (border-radius: if(style(--corner-shape: round): 1px; else: 2px)) {
  /* Match the host&#x27;s proportional text-sm scale at every text preference. */
  .tooltip,
  .viz-badge,
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    font-size: if(
      style(--corner-shape: round): round(
          nearest,
          calc(var(--font-size-base) * 14 / 16),
          1px
        );
        else: round(nearest, calc(var(--font-size-base) * 13 / 14), 1px)
    );
  }

  .btn,
  .nav-link,
  .form-select {
    border-radius: if(
      style(--corner-shape: round): var(--radius-full); else: var(--radius-lg)

  }

  .form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
    border-radius: if(
      style(--corner-shape: round): calc(var(--radius-sm) / 2);

  }

  .tooltip {
    font-weight: if(
      style(--corner-shape: round): 600; else: var(--font-weight-normal)

  }
}

@media (pointer: coarse) {

    [type=&quot;week&quot;],

  }

  .form-control-color[type=&quot;color&quot;] {

    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;

    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {

  color: var(--destructive);
}

        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||

        !isArray(ports) ||
        ports.length !== 1

      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];

          &quot;message&quot;,

            const data = apply(getMessageData, event, []);

p;lt;4，继续使用旧专家布局。&lt;/li&gt;&lt;li&gt;第 3 步：E0 已经很热，但还不到期：本周期新增合计 [9,3,3,3]；E0 占一半命中。计数 3&amp;lt;4，不触发重排。&lt;/li&gt;&lt;li&gt;第 4 步：先完成 forward 与采样：仍按旧映射计算；本步新增 [3,1,1,1]。请求尚未结束，本步输出也尚未返回。&lt;/li&gt;&lt;li&gt;步后检查：4≥4，触发重排：先更新统计窗口，再把计数 3→4；达到 step_interval 后重置为 0，进入重排。&lt;/li&gt;&lt;li&gt;汇总负载，决定新的副本和位置：物理计数→逻辑专家→EP all-reduce，得到 [12,4,4,4]；E0 从 1 份增为 3 份，生成目标布局。&lt;/li&gt;&lt;li&gt;本地来源先存入临时缓冲：GPU0：旧 p2→缓冲 p1、旧 p0→缓冲 p2；GPU1：旧 p3→缓冲 p4。在用权重仍不改。&lt;/li&gt;&lt;li&gt;跨卡传 E0、E1 权重：GPU0 的 p0/E0→GPU1 缓冲 p5；p1/E1→GPU1 缓冲 p3。A/B/C 仍处于同一请求中。&lt;/li&gt;&lt;li&gt;等待全部发送和接收完成：GPU1 缓冲 [E1,E3,E0] 就绪；下一次 forward 仍要等写回和映射切换。&lt;/li&gt;&lt;li&gt;把缓冲写回目标物理槽：p0 保留，其余槽写入目标权重；此刻旧映射还未切换，不启动下一步 forward。&lt;/li&gt;&lt;li&gt;所有层完成后，切换映射：更新 physical↔logical 和副本数。新布局生效；请求、DP 归属、KV cache 均未搬动。&lt;/li&gt;&lt;li&gt;返回第 4 步输出，请求仍未结束：EPLB 返回后构造本步输出；Scheduler 更新 A/B/C，准备下一次 decode。&lt;/li&gt;&lt;li&gt;第 5 步：同一请求使用新专家布局：A/B 仍在 DP0，C 仍在 DP1；token 的专家计算按新映射找物理副本。&lt;/li&gt;&lt;li&gt;请求结束是另一个事件：第 5 步的 EPLB 计数为 1，不再重排；示例输出 EOS，Scheduler 才结束 A/B/C。专家迁移已提前完成。&lt;/li&gt;&lt;/ol&gt;&lt;/section&gt;

    &lt;details class=&quot;notes&quot;&gt;
    &lt;summary class=&quot;cursor-interaction text-small&quot;&gt;DPLB 选组与 EPLB 放置：边界及源码&lt;/summary&gt;
    &lt;ul class=&quot;text-small&quot;&gt;
      &lt;li&gt;DPLB 选择一个 DP rank 对应的 EngineCore；若 TP&amp;gt;1，它背后是一组 TP workers。本例 TP=1，每个 DP rank 对应一张 GPU。&lt;/li&gt;
      &lt;li&gt;此处单 API client：从 DP0 开始扫描，分配后本地 waiting 加 1。一般情况起点为 floor(DP 数 × client_index / client_count)，分配后加 client_count。同分保留扫描时先遇到者；起点不会逐请求轮转。&lt;/li&gt;
      &lt;li&gt;此图的三个新请求之间不接收新统计；Coordinator 后续会用新快照覆盖本地估计。4 是此版的固定启发式权重，不代表等待请求一定耗时 4 倍。分值不直接使用 token 数、KV 命中或 GPU 利用率。显式指定 data_parallel_rank 会绕过该打分路径。&lt;/li&gt;
      &lt;li&gt;EPLB 策略从每逻辑专家一个副本开始重算，总物理槽固定。放置算法输入没有旧映射，因此目标是负载均衡，不保证迁移量最小。&lt;/li&gt;
      &lt;li&gt;单节点、4 个逻辑专家、6 个物理槽，每 GPU 必须放 3 个副本。等权副本按 q0…q5 展示；源码排序不保证等权元素顺序，最终槽位可不同。GPU 累计负载并列时，先取较小 rank。&lt;/li&gt;
      &lt;li&gt;多节点且专家组数可被节点数整除：先把专家组分给节点，再在节点内复制、放置到 GPU；否则进入全局策略。本图固定单节点。&lt;/li&gt;
      &lt;li&gt;权重迁移先保留不变槽、本地复制到缓冲、P2P 发送/接收并等待、缓冲写回；所有层重排完成后更新映射，再进入后续 forward。API 可继续接收排队请求。&lt;/li&gt;
      &lt;li&gt;同一逻辑专家的远端接收按 rank 去重；收到一次后可复制到本卡多个目标槽。多个旧持有 rank 时，远端目标分摊给旧持有者。&lt;/li&gt;
      &lt;li&gt;数据为教学输入；执行的是规则仿真，未运行模型或测量加速效果。EPLB 装箱使用每副本平均负载估计。&lt;/li&gt;
    &lt;/ul&gt;

&lt;details&gt;
    &lt;summary class=&quot;cursor-interaction text-small&quot;&gt;示例配置、触发边界与源码&lt;/summary&gt;
    &lt;ul class=&quot;text-small&quot;&gt;
      &lt;li&gt;固定单节点、DP=2、TP=PP=1、EP 跨两张 GPU，已启用 EPLB。A/B 归 DP0，C 归 DP1；每请求每步贡献一个 token，MoE top-2。A 命中 E0/E1，B 命中 E0/E2，C 命中 E0/E3；每步合计 [3,1,1,1]，4 步为 [12,4,4,4]。&lt;/li&gt;
      &lt;li&gt;教学配置 window_size=4、step_interval=4，计数从一次正常重排后 0 开始。前 3 步仅显示本周期新增统计，旧窗口样本省略；第 4 步已用新 4 步完全覆盖窗口。旧布局是运行中示例快照，不是默认启动布局。默认参数为 window_size=1000、step_interval=3000；启动计数设为 interval−floor(interval/4)，所以首次重排较早。&lt;/li&gt;
      &lt;li&gt;触发周期重排的条件：本次 EPLB 计数加 1 后 ≥ step_interval。专家负载决定副本和位置；源码没有“某专家命中 N 次”或 balancedness 日志阈值的触发分支。即使负载均匀，到期也重新规划；新旧槽位一致时保留权重。&lt;/li&gt;
      &lt;li&gt;窗口统计的是 token 的 top-k 专家选择次数，不是用户请求数；图中汇总值用于讲解。运行时先记各 rank 的物理专家计数，到期才按逻辑专家归并并在 EP 组 all-reduce。&lt;/li&gt;
      &lt;li&gt;启动时加载权重、创建映射和统计窗口，profiling 预留通信资源。本次迁移的临时权重缓冲在重排时申请并跨层复用；不是每个请求到达前先迁移一次。&lt;/li&gt;
      &lt;li&gt;本版常见生成路径是 forward→logits/采样→bookkeeping→EPLB→返回本步输出。迁移可插在同一请求的两个 decode 步之间；权重搬完、所有层映射更新之后才进入后续 forward。图中时间间距不表示耗时。&lt;/li&gt;
      &lt;li&gt;请求的 DP 归属和 KV cache 不变。这里显示专家权重的 P2P，forward 内 token activation 的 EP 派发/回收另属计算通信。API 可继续接收排队请求。&lt;/li&gt;
      &lt;li&gt;在线 DP dummy 步不写入负载窗口，但仍推进重排计数，使空闲 rank 也参加同步重排。此例两 rank 每步均有真实 token；不展开 dummy 分支。&lt;/li&gt;
      &lt;li&gt;E0 依次取得两个冗余副本：12÷1→12÷2→12÷3；随后六份预测负载均为 4。采用前图相同的合法并列顺序，目标 [E0,E2,E0 | E1,E3,E0]；等权排序不同可产生其他槽位排列。&lt;/li&gt;
      &lt;li&gt;请求结束仅作教学收尾，示例令第 5 步输出 EOS。此图为源码规则仿真，未运行模型或测量迁移性能。&lt;/li&gt;
    &lt;/ul&gt;

// 插入含 #lb-atlas 的真实可视化 document，位于现有脚本之后。
window.openLessonTarget = async function(action) {
  const root = document.getElementById(&#x27;lb-atlas&#x27;);
  const mode = action?.mode, step = Number(action?.step);
  const counts = {overview:8,feedback:7,choice:6,placement:11,timeline:16};
  const preset = action?.preset || &#x27;original&#x27;;
  if (!root || !Object.hasOwn(counts,mode) || !Number.isInteger(step) || step &lt; 1 || step &gt; counts[mode] || ![&#x27;original&#x27;,&#x27;counter&#x27;,&#x27;tie&#x27;].includes(preset)) throw new Error(&#x27;负载均衡跳转参数无效&#x27;);
  const waitFor = async (test) =&gt; {
    const deadline = Date.now() + 4000;
    let stable = 0;
    while (Date.now() &lt; deadline) {
      if (test()) { if (++stable &gt;= 2) return; } else stable = 0;
      await new Promise(resolve =&gt; setTimeout(resolve, 20));
    }
    throw new Error(&#x27;可视化未到达请求的模式与步骤&#x27;);
  };
  const select = root.querySelector(&#x27;#atlas-mode&#x27;);
  select.value = mode; select.dispatchEvent(new Event(&#x27;change&#x27;, {bubbles:true}));
  if (mode === &#x27;choice&#x27;) {
    const scenario = root.querySelector(&#x27;#atlas-preset&#x27;);
    scenario.value = preset; scenario.dispatchEvent(new Event(&#x27;change&#x27;, {bubbles:true}));
  }
  root.querySelector(&#x27;#atlas-global&#x27;).click();
  const next = root.querySelector(&#x27;#atlas-next&#x27;);
  for (let i=0; i&lt;step; i++) {
    if (next.disabled) throw new Error(&#x27;尚未到目标步骤，下一步已禁用&#x27;);
    next.click();
  }
  const expectedPreset = mode === &#x27;choice&#x27; ? preset : &#x27;none&#x27;;
  await waitFor(() =&gt; root.dataset.mode === mode &amp;&amp; Number(root.dataset.step) === step &amp;&amp; [...root.querySelectorAll(&#x27;.atlas-frame&#x27;)].some(frame =&gt; !frame.hidden &amp;&amp; frame.dataset.mode === mode &amp;&amp; frame.dataset.preset === expectedPreset &amp;&amp; Number(frame.dataset.step) === step));
  return {label:root.querySelector(&#x27;#atlas-title&#x27;).textContent.trim() + (mode === &#x27;choice&#x27; ? &#x27; · &#x27; + root.querySelector(&#x27;#atlas-preset&#x27;).selectedOptions[0].textContent.trim() : &#x27;&#x27;)};
};
// Runs in the visualization document, including sandboxed srcdoc frames.
(() =&gt; {

    ? new Promise(resolve =&gt; document.addEventListener(&#x27;DOMContentLoaded&#x27;,resolve,{once:true}))
    : Promise.resolve();

    if (/^(暂停(?:流程|播放|动画)?|停止播放)$/.test(button.textContent.trim())) button.click();

    if (event.source !== parent || !event.data || typeof event.data !== &#x27;object&#x27;) return;

    if (type !== &#x27;lesson-call-open&#x27; || typeof id !== &#x27;string&#x27;) return;

(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));

        shift({ padding: tooltipGap }),

              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(

              `${Math.max(0, availableHeight)}px`,

        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {

    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;

    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);

      updatePosition(trigger, floating);

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }

      closeTooltip();
    }

    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }

    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) =&gt; {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll(&quot;*&quot;)) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) =&gt; {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host &amp;&amp; !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }

    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });

  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();

  listen(document);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });

    root.id = 'lesson-call-chain';
    root.innerHTML = `<header class="cw-header"><a href="../index.html">← vLLM 学习笔记</a><h1></h1><p>先沿源码调用链定位接口，再进入对应的可视化步骤。</p></header>

      <p class="cw-error" role="alert" hidden></p>
      <section class="cw-chain"><div class="cw-variant"><label>实现与场景 <select aria-label="选择调用链实现"></select></label><p class="cw-scope-text"></p><details class="cw-scope"><summary>源码仓库与固定 commit</summary><div class="cw-repositories"></div></details></div>
      <p class="cw-guide">点 ＋ 展开子调用，点名称查看输入、状态变化与返回续点。「动作」「分支」「循环」表示控制块；异步提交与完成回报分开标记。</p>
      <div class="cw-layout"><section class="cw-tree-panel" aria-label="源码调用树"><div class="cw-tools"><strong></strong><div><button type="button" data-cw-expand>全部展开</button> <button type="button" data-cw-fold>只看主链</button></div></div><div class="cw-tree-scroll"><ol class="cw-tree"></ol></div></section>

      <section class="cw-evidence"><h3>源码依据 · 行号属于所示 commit</h3><div></div></section><section class="cw-targets"><h3>进入可视化执行</h3><p>按下列入口定位现有图中的对应步骤。</p><div></div></section></article></div></section>
      <div class="cw-context" tabindex="-1" hidden></div>`;
    document.body.insertBefore(root,original[0] || dataElement);

    $('.cw-header h1').textContent = data.title;
    for (const item of data.variants) {
      const option = make('option',item.title); option.value = item.id; $('.cw-variant select').append(option);

    function validState(value) {
      const nextVariant = variants.get(value?.variant);
      const node = nextVariant?.nodes.find(item => item.id === value.node);

      const target = value.target === null ? null : Number(value.target);

      return {variant:nextVariant.id,node:node.id,screen:value.screen,target};
    }
    const state = () => ({variant:variant.id,node:selected,screen,target:targetIndex});
    function parseRoute() {
      const query = new URLSearchParams(location.search);
      if (!query.has('cw-view')) return null;

      variant = variants.get(next.variant); selected = next.node; screen = next.screen; targetIndex = next.target;

          if (hasChildren) {
            branch.type = 'button'; branch.dataset.cwToggle = node.id;

          if (hasChildren) { const nested = make('ol',undefined,'cw-tree'); nested.hidden = collapsed.has(node.id); append(nested,node.id); item.append(nested); }
          list.append(item);

      };
      append(top,null); $('.cw-tools strong').textContent = '调用与返回 · ' + variant.nodes.length + ' 个节点';
    }

      const node = nodeById(selected);

      for (const evidence of node.evidence) {
        const repo = variant.repositories[evidence.repo];
        const link = make('a',evidence.label + ' · ' + evidence.path + ':' + evidence.line + (evidence.end ? '–' + evidence.end : ''));

        $('.cw-targets>div').append(button);

    window.addEventListener('message',event => {
      if (!frame || event.source !== frame.contentWindow || !event.data) return;
      if (event.data.type === 'lesson-call-ready') frameReady = true;
      if (event.data.type === 'lesson-call-result') {
        const pending = replies.get(event.data.id);
        if (pending) { replies.delete(event.data.id); clearTimeout(pending.timer); event.data.ok ? pending.resolve(event.data.result) : pending.reject(new Error(event.data.error)); }
      }
      if (event.data.type === 'lesson-call-edited' && !busy && screen === 'visual') markEdited();
    });
    function markEdited() {
      targetIndex = null;
      $('.cw-context').textContent = '图中的模式或步骤已手动调整，当前状态不再绑定调用链节点。返回调用链可重新定位源码对应步骤。';
      remember();
    }
    async function invoke(action) {
      if (!frame) {
        if (typeof window.openLessonTarget !== 'function') throw new Error('当前页面缺少步骤入口');
        const work = nativeQueue.then(() => window.openLessonTarget(action));
        nativeQueue = work.catch(() => {});
        return work;
      }
      const deadline = Date.now() + 5000;
      while (!frameReady && Date.now() < deadline) {
        frame.contentWindow?.postMessage({type:'lesson-call-ping'},'*');
        await new Promise(resolve => setTimeout(resolve,80));
      }
      if (!frameReady) throw new Error('内嵌可视化尚未就绪，请稍后重试');
      const id = topic + ':' + ++requestId;
      return new Promise((resolve,reject) => {
        const timer = setTimeout(() => { replies.delete(id); reject(new Error('步骤定位超时')); },8000);
        replies.set(id,{resolve,reject,timer});
        frame.contentWindow.postMessage({type:'lesson-call-open',id,action},'*');
      });
    }
    async function openTarget(index,method = 'push',scroll = true) {
      const target = nodeById(selected).targets[index];
      if (!target) return;
      const currentPage = location.pathname.split('/').at(-1);
      if (target.action.page && target.action.page !== currentPage) {
        if (!['index.html','comparison.html'].includes(target.action.page)) throw new Error('不支持的页面目标');
        const url = new URL(target.action.page,location.href); url.hash = '';
        location.assign(urlFor({...state(),screen:'visual',target:index},url)); return;
      }
      const job = ++revision; busy = true; screen = 'visual'; targetIndex = index; clearError(); render();
      $('.cw-context').textContent = '正在定位：' + target.label;
      try {
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const result = await invoke(target.action);
        if (job !== revision) return;
        $('.cw-context').textContent = '来自节点 ' + nodeById(selected).number + ' · ' + nodeById(selected).title + ' → ' + (result?.label || target.label);
        if (method) remember(method);
        if (scroll) { $('.cw-context').scrollIntoView({block:'start'}); $('.cw-context').focus({preventScroll:true}); }
      } catch (error) {
        if (job === revision) { screen = 'chain'; render(); errorMessage(error); }
      } finally { if (job === revision) { busy = false; root.dataset.cwBusy = 'false'; detail(); } }
    }
    function pauseVisual() {
      if (frame) frame.contentWindow?.postMessage({type:'lesson-call-pause'},'*');
      else window.dispatchEvent(new Event('lesson-pause-visual'));
    }
    function openChain() {
      revision++; busy = false; screen = 'chain'; clearError();
      pauseVisual();
      revealSelected(); buildTree(); render(); remember('push'); scrollSelected();
      root.scrollIntoView({block:'start'});
    }
    root.addEventListener('click',event => {
      const target = event.target.closest('[data-cw-target]');
      if (target) { openTarget(Number(target.dataset.cwTarget)); return; }
      const layer = event.target.closest('[data-cw-view]');
      if (layer) {
        if (layer.dataset.cwView === 'chain') openChain();
        else if (targetIndex !== null) openTarget(targetIndex);
        else { screen = 'visual'; clearError(); render(); remember('push'); }
        return;
      }
      const toggle = event.target.closest('[data-cw-toggle]');
      if (toggle) {
        const id = toggle.dataset.cwToggle;
        if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
        buildTree(); detail(); root.querySelector('[data-cw-toggle="' + id + '"]').focus({preventScroll:true}); return;
      }
      const button = event.target.closest('[data-cw-node]');
      if (button) {
        selected = button.dataset.cwNode; targetIndex = null; clearError(); detail(); remember('push');
        if (matchMedia('(max-width:760px)').matches) { $('.cw-detail').scrollIntoView({block:'start'}); $('.cw-detail').focus({preventScroll:true}); }
      }
    });
    $('[data-cw-expand]').addEventListener('click',() => { collapsed.clear(); buildTree(); detail(); });
    $('[data-cw-fold]').addEventListener('click',() => { collapsed = new Set(variant.nodes.filter(node => node.parent !== null).map(node => node.id)); buildTree(); detail(); });
    $('.cw-variant select').addEventListener('change',event => {
      variant = variants.get(event.target.value); selected = variant.entry || variant.nodes[0].id; targetIndex = null;
      resetTree(); buildTree(); clearError(); render(); remember('push');
    });
    for (const name of ['click','change']) document.addEventListener(name,event => {
      if (event.isTrusted && !busy && screen === 'visual' && event.target.closest('.lesson-original') && event.target.closest('button,select,input')) markEdited();
    },true);
    window.addEventListener('popstate',() => {
      if (routeKey() === lastRoute) return;
      lastRoute = routeKey(); revision++; busy = false;
      const next = parseRoute() || {variant:fallback.id,node:fallback.entry || fallback.nodes[0].id,screen:'chain',target:null};
      applyState(next); resetTree(); buildTree(); render(); clearError();
      if (screen === 'visual' && targetIndex !== null) openTarget(targetIndex,null,false);
      else if (screen === 'chain') { pauseVisual(); scrollSelected(); }
    });
    resetTree(); buildTree(); render();
    if (screen === 'visual' && targetIndex !== null) openTarget(targetIndex,null,false);
    else if (screen === 'chain') scrollSelected();
    document.documentElement.dataset.callChainReady = 'true';
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',mount,{once:true}); else mount();
})();
</script>
